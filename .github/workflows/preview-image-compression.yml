name: Sync compression preview (temporary)
on:
  push:
    branches: [feature/local-image-compression]
permissions:
  contents: write
jobs:
  sync-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/local-image-compression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/build-preview.py
      - name: Commit generated assets
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Qiye-preview.html src/version.js
          if ! git diff --cached --quiet; then
            git commit -m "build: update compressor standalone preview"
            git push origin HEAD:feature/local-image-compression
          fi
