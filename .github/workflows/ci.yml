name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Logic and integration tests
        run: npm test
      - name: Documentation links and bilingual wiki
        run: |
          python3 scripts/check-docs.py
          python3 scripts/build-wiki.py
      - name: Validate release version and packaging rules
        run: |
          python3 scripts/package-release.py --check-version
          python3 -m unittest discover -s tests -p 'release_test.py'
      - name: Build same-source Pages
        run: python3 scripts/build-pages.py "$RUNNER_TEMP/qiye-pages"
      - name: Package extension, source and standalone preview
        run: |
          python3 scripts/package-release.py
          git diff --exit-code -- src/version.js community/index.json
          # Qiye-preview.html is regenerated and committed by publish_web after verification.
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-release
          path: dist/qiye-*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiye-browser-report
          path: |
            test-results
            output/playwright/map
            output/playwright/bookmarks
            output/playwright/hotsearch
            output/playwright/pomodoro
            output/playwright/codec
          retention-days: 14
      - name: Source archive
        run: git archive --format=zip --output="$RUNNER_TEMP/qiye-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-source
          path: ${{ runner.temp }}/qiye-source.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: qiye-static
          path: ${{ runner.temp }}/qiye-pages
          include-hidden-files: true
          retention-days: 7

  browser_regression:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [desktop, services, utilities]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate same-source standalone preview
        run: python3 scripts/build-preview.py
      - name: Install test browser
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Browser regression (${{ matrix.group }})
        run: |
          case "${{ matrix.group }}" in
            desktop)
              python3 tests/browser-e2e.py --output test-results
              python3 tests/widgets-e2e.py --output test-results/widgets
              python3 tests/daily-widgets-e2e.py
              python3 tests/daily-widgets-e2e.py --preview
              python3 tests/interaction-e2e.py
              python3 tests/interaction-e2e.py --preview
              python3 tests/presentation-e2e.py
              python3 tests/presentation-e2e.py --preview
              python3 tests/search-overlays-e2e.py
              python3 tests/search-overlays-e2e.py --preview
              python3 tests/workspaces-e2e.py
              python3 tests/workspaces-e2e.py --preview
              python3 tests/widget-life-e2e.py
              python3 tests/widget-life-e2e.py --preview
              ;;
            services)
              python3 tests/weather-e2e.py
              python3 tests/weather-e2e.py --preview
              python3 tests/hotsearch-e2e.py
              python3 tests/hotsearch-e2e.py --preview
              python3 tests/bookmarks-e2e.py
              python3 tests/bookmarks-e2e.py --preview
              python3 tests/bookmarks-organize-e2e.py
              python3 tests/bookmarks-organize-e2e.py --preview
              python3 tests/bookmarks-native-e2e.py
              ;;
            utilities)
              python3 tests/pomodoro-e2e.py
              python3 tests/pomodoro-e2e.py --preview
              python3 tests/converter-e2e.py
              python3 tests/converter-e2e.py --preview
              python3 tests/codec-e2e.py
              python3 tests/codec-e2e.py --preview
              python3 tests/map-e2e.py
              python3 tests/map-e2e.py --preview
              python3 tests/map-extension-e2e.py
              python3 tests/extension-e2e.py
              python3 tests/tab-favicon-e2e.py
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiye-browser-${{ matrix.group }}
          path: |
            test-results
            output/playwright/map
            output/playwright/bookmarks
            output/playwright/hotsearch
            output/playwright/pomodoro
            output/playwright/codec
          retention-days: 14

  release:
    needs: [verify, browser_regression]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: qiye-publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: qiye-release
          path: dist
      - name: Publish a new version or resume its draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py dist


  publish_web:
    needs: [verify, browser_regression]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: qiye-publish-web
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Commit verified standalone preview to main
        run: |
          python3 scripts/build-preview.py
          node scripts/build-community.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Qiye-preview.html src/version.js community/index.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize verified standalone preview [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish same-source GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/qiye-public" origin/gh-pages
          python3 scripts/build-pages.py "$RUNNER_TEMP/qiye-public"
          git -C "$RUNNER_TEMP/qiye-public" add -A
          if ! git -C "$RUNNER_TEMP/qiye-public" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/qiye-public" commit -m "deploy: update Qiye Pages from verified main"
            git -C "$RUNNER_TEMP/qiye-public" push origin HEAD:gh-pages
          fi
