name: Verify and publish host
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test the host without a widgets checkout
        run: |
          python scripts/build-preview.py
          npm test
          python scripts/check-docs.py
          python scripts/build-wiki.py
          python -m unittest discover -s tests -p 'release_test.py'
          python scripts/package-release.py
          git diff --exit-code -- Qiye-preview.html src/version.js
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Desktop, plugin protocol and real MV3 regression
        run: |
          python tests/plugin-e2e.py
          python tests/plugin-e2e.py --preview
          python tests/component-gallery-e2e.py
          python tests/component-gallery-e2e.py --preview
          python tests/extension-e2e.py
          python tests/editor-e2e.py
          python tests/search-overlays-e2e.py
          python tests/search-overlays-e2e.py --preview
          python tests/tab-favicon-e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-release
          path: dist/qiye-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-browser-report
          path: |
            test-results
            output/playwright
  release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: qiye-release
          path: dist
      - name: Publish immutable host release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py dist
  publish_web:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: host-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build public host
        run: python scripts/build-pages.py "$RUNNER_TEMP/qiye-public"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/qiye-public
      - uses: actions/deploy-pages@v4
        id: deployment
