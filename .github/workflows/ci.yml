name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Logic and integration tests
        run: npm test
      - name: Build same-source Pages
        run: python3 scripts/build-pages.py "$RUNNER_TEMP/qiye-pages"
      - name: Install test browser
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Browser regression on real HTTP origin
        run: python3 tests/browser-e2e.py --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiye-browser-report
          path: test-results
          retention-days: 14
      - name: Source archive
        run: git archive --format=zip --output="$RUNNER_TEMP/qiye-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-source
          path: ${{ runner.temp }}/qiye-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-static
          path: ${{ runner.temp }}/qiye-pages
          include-hidden-files: true
          retention-days: 7
