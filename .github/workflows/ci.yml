name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Logic and integration tests
        run: npm test
      - name: Validate release version and packaging rules
        run: |
          python3 scripts/package-release.py --check-version
          python3 -m unittest discover -s tests -p 'release_test.py'
      - name: Build same-source Pages
        run: python3 scripts/build-pages.py "$RUNNER_TEMP/qiye-pages"
      - name: Install test browser
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Browser regression on real HTTP origin
        run: |
          python3 tests/browser-e2e.py --output test-results
          python3 tests/widgets-e2e.py --output test-results/widgets
          python3 tests/daily-widgets-e2e.py
          python3 tests/daily-widgets-e2e.py --preview
          python3 tests/interaction-e2e.py
          python3 tests/interaction-e2e.py --preview
          python3 tests/extension-e2e.py
      - name: Package extension, source and standalone preview
        run: |
          python3 scripts/package-release.py
          git diff --exit-code -- Qiye-preview.html src/version.js
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-release
          path: dist/qiye-*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiye-browser-report
          path: test-results
          retention-days: 14
      - name: Source archive
        run: git archive --format=zip --output="$RUNNER_TEMP/qiye-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: qiye-source
          path: ${{ runner.temp }}/qiye-source.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: qiye-static
          path: ${{ runner.temp }}/qiye-pages
          include-hidden-files: true
          retention-days: 7

  release:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: qiye-publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: qiye-release
          path: dist
      - name: Publish a new version or resume its draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py dist
