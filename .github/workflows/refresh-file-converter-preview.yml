name: Refresh standalone preview (temporary)
on:
  push:
    branches: [feat/local-file-converter]
    paths: ['.github/workflows/refresh-file-converter-preview.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Ktclat/qiye'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-file-converter
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild standalone HTML from source
        run: python3 scripts/build-preview.py
      - name: Commit generated preview to feature branch
        run: |
          if ! git diff --quiet -- Qiye-preview.html src/version.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Qiye-preview.html src/version.js
            git commit -m "build: refresh standalone preview for file converter"
            git push origin HEAD:feat/local-file-converter
          fi
