<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>收藏到栖页</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="popup-header">
      <img class="popup-logo" src="icons/icon48.png" alt="" width="36" height="36">
      <div><strong>栖页 <span>Qiye</span></strong><p>给常用的网页，一个位置。</p></div>
    </header>
    <main>
      <h1>收好这一页</h1>
      <p id="page-url" class="page-url">正在读取当前网页…</p>
      <form id="save-form">
        <label for="page-title">名称</label>
        <input id="page-title" name="title" type="text" maxlength="120" autocomplete="off" required disabled>
        <label for="group-select">放到分组</label>
        <select id="group-select" name="group" disabled></select>
        <button id="save-button" class="primary-button" type="submit" disabled>添加到栖页 <span aria-hidden="true">↗</span></button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <footer><button type="button" id="open-qiye">打开我的栖页 <span aria-hidden="true">→</span></button><span class="local-label">本机保存</span></footer>
  </body>
</html>
