/* v0.2: quieter desktop chrome, consistent spacing, and readable settings. */
:root{--border:var(--panel-border);--text:var(--fg);--panel-soft:var(--field);--accent-soft:rgba(120,217,198,.12)}
body{isolation:isolate;line-height:1.45}
.wallpaper{transition:filter .25s ease;background-repeat:no-repeat}
.sidebar{width:64px;background:rgba(11,20,28,.27);border-color:rgba(255,255,255,.07);backdrop-filter:blur(28px) saturate(1.15);gap:8px}
.brand{margin:24px 0 24px;gap:8px}
.sidebar>.brand,.sidebar>.side-button,.sidebar-bottom{flex-shrink:0}
.groups{flex:1;min-height:0;max-height:none;gap:8px;padding:2px 0 8px}
.group-button{width:46px;min-height:55px;border-radius:13px;gap:6px;color:rgba(240,248,248,.7);transition:background .18s,color .18s}
.group-button.active{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#f5fffc}
.group-button.active:before{left:-9px;width:2px;height:21px;background:#b7f4e4}
.group-button .icon{width:19px;height:19px}
.sidebar-bottom{gap:8px;padding-bottom:20px;margin-top:8px}
.side-button{width:40px;height:40px}
.top-tools{position:fixed;top:22px;right:25px;gap:8px}
.tool-button{width:35px;height:35px;border-radius:11px;background:rgba(15,31,40,.14);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.1)}
.tool-button:hover{background:rgba(255,255,255,.19);box-shadow:0 4px 18px #0613231c}
main{margin-left:64px;padding:0 38px 90px}
.hero{padding-top:clamp(62px,8vh,100px)}
.clock{font-weight:300;letter-spacing:-3px;text-shadow:0 2px 22px #00152524}
.date{margin-top:8px;font-size:12px;letter-spacing:.7px;color:rgba(255,255,255,.84)}
.search-wrapper{width:min(640px,100%);margin-top:29px}
.search-form{height:52px;border-radius:27px;background:rgba(246,249,247,.83);border-color:rgba(255,255,255,.32);box-shadow:0 6px 26px rgba(9,25,39,.13);transition:background .18s,box-shadow .18s}
.search-form:focus-within{background:rgba(252,254,253,.96);box-shadow:0 12px 38px rgba(5,24,37,.18),0 0 0 3px rgba(213,255,242,.13)}
.engine-button{width:65px;padding-left:17px;position:relative;border-radius:27px 0 0 27px}
.engine-button:after{content:"";position:absolute;right:1px;top:17px;bottom:17px;width:1px;background:rgba(54,75,76,.16)}
.search-form input{padding-left:13px;font-size:14px}
.search-submit{width:48px;border-radius:0 27px 27px 0;transition:background .16s}
.search-submit:hover{background:rgba(48,92,79,.08)}
.search-shortcut{font-size:9px;opacity:.7;padding:3px 6px}
.engine-menu,.search-suggestions{top:61px;border-radius:17px;padding:8px;box-shadow:0 16px 48px #0713213b}
.engine-option,.suggestion{min-height:39px}
.desktop-wrap{max-width:1280px;margin:32px auto 0}
.desktop-heading{margin-bottom:14px;color:rgba(255,255,255,.65)}
#group-heading{font-size:12px;letter-spacing:.4px}
.desktop{padding-bottom:36px}
.tile-body{height:calc(100% - 24px)}
.tile-link[data-size="1x1"] .tile-body,.tile-add .tile-body{max-width:calc(var(--tile-size) - 10px);max-height:calc(var(--tile-size) - 10px)}
.tile-link .tile-body:hover,.tile-folder .tile-body:hover{transform:translateY(-3px);box-shadow:0 10px 24px #06152238,inset 0 1px 0 #ffffff1f}
.tile-link .tile-body:active,.tile-folder .tile-body:active{transform:translateY(-1px) scale(.98)}
.tile-link .tile-body>.icon{width:30px;height:30px}
.tile-label{height:24px;padding-top:8px;font-size:11px;line-height:15px;letter-spacing:.15px;text-shadow:0 1px 7px rgba(0,0,0,.46)}
.tile-widget .tile-body{box-shadow:0 6px 23px #09172520}
.tile-actions button{box-shadow:0 2px 9px #07162335}
.tile-add .tile-body{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.09)}
.tile-add .tile-body:hover{border-color:rgba(255,255,255,.7)}
.app-dialog{width:min(700px,calc(100% - 36px));max-height:calc(100dvh - 64px);border-radius:22px;box-shadow:0 28px 110px #030b1661;scrollbar-gutter:stable}
.dialog-head{position:sticky;top:0;z-index:4;background:var(--panel);padding:25px 28px 20px;border-bottom:1px solid var(--panel-border)}
.dialog-head h2{font-weight:600;font-size:19px}
.dialog-head p{font-size:12px;line-height:1.65}
.dialog-close{width:33px;height:33px;border-radius:50%}
.tab-bar{margin-top:16px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-button{white-space:nowrap;font-size:12px;min-height:37px}
.dialog-body{padding-top:17px}
.field>span{font-size:12px}
.field input,.field select,.field textarea{border-radius:10px}
.field small,.help-text{line-height:1.8}
.primary-button,.secondary-button,.danger-button{min-height:37px;border-radius:10px;font-size:12px}
.setting-row{padding-top:15px;padding-bottom:15px;gap:18px}
.setting-copy strong{font-size:12px}
.setting-copy small{line-height:1.75}
.catalog-card{border-radius:15px;transition:background .18s,border-color .18s,transform .18s}
.catalog-card:hover{transform:translateY(-2px)}
.context-menu{width:205px;border-radius:14px;padding:6px}
.context-menu button{min-height:34px;font-size:12px;gap:11px}
.context-menu .size-options button{min-height:29px;font-size:10px}
.toast{border-radius:14px;bottom:40px;max-width:min(650px,calc(100% - 36px))}
.daily-quote{left:96px;right:32px;bottom:35px;color:rgba(255,255,255,.71)}
.wallpaper-credit{position:fixed;right:21px;bottom:10px;z-index:16;max-width:min(350px,70vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 9px;border-radius:6px;background:rgba(9,20,30,.2);color:rgba(255,255,255,.72);font-size:10px;line-height:1.5;backdrop-filter:blur(9px);text-shadow:0 1px 5px #0005;transition:color .16s,background .16s}
.wallpaper-credit:hover{color:#fff;background:rgba(9,20,30,.42)}
.minimal .wallpaper-credit{opacity:.65}.minimal .wallpaper-credit:hover{opacity:1}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Site icons are image resources only; the text fallback remains until load. */
.site-visual{position:relative;display:grid;place-items:center;width:100%;height:100%;min-width:0;border-radius:inherit;overflow:hidden}
.site-visual.is-loaded{background:rgba(250,252,253,.96)}
.site-fallback{display:grid;place-items:center;width:100%;height:100%;color:inherit}
.site-visual.is-loaded>.site-fallback{visibility:hidden}
.site-visual>.site-favicon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;width:60%;height:60%;max-width:38px;max-height:38px;object-fit:contain;background:transparent;pointer-events:none}
.site-visual>.site-favicon[hidden]{display:none}
.site-fallback>.icon{width:30px;height:30px}
.tile-link[data-size="2x2"] .site-favicon,.tile-link[data-size="4x2"] .site-favicon{max-width:60px;max-height:60px}
.tile-link[data-size="2x2"] .site-fallback>.icon,.tile-link[data-size="4x2"] .site-fallback>.icon{width:48px;height:48px}
.mini-site .site-favicon{max-width:30px;max-height:30px}
.mini-site .site-glyph{font-size:21px}
.mini-site .site-glyph.small{font-size:15px}
.folder-site .site-visual,.folder-site .site-fallback{max-width:none;overflow:visible}
.folder-site .site-visual{overflow:hidden}
.folder-site .site-glyph{font-size:26px}

const WEBDAV_LOCAL_KEY = 'qiye.webdav.local.v1';
const DEFAULT_WEBDAV_CONFIG = Object.freeze({
  enabled: false, endpoint: '', path: 'qiye.json', username: '', password: '', autoSync: false
});

const REQUEST_TIMEOUT_MS = 15000;
const REVIEW_LIFETIME_MS = 10 * 60 * 1000;
const copy = value => JSON.parse(JSON.stringify(value));

class WebDAVError extends Error {
  constructor(code, message) { super(message); this.name = 'WebDAVError'; this.code = code; }
}

function fail(code, message) { throw new WebDAVError(code, message); }

function validateWebDAVConfig(input, { requireEndpoint = false } = {}) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) fail('INVALID_CONFIG', 'WebDAV 配置格式不正确。');
  const config = { ...DEFAULT_WEBDAV_CONFIG };
  for (const key of Object.keys(config)) if (input[key] !== undefined) config[key] = input[key];
  if (typeof config.enabled !== 'boolean' || typeof config.autoSync !== 'boolean') fail('INVALID_CONFIG', '同步开关格式不正确。');
  for (const key of ['endpoint', 'path', 'username', 'password']) {
    if (typeof config[key] !== 'string' || config[key].length > (key === 'endpoint' ? 4096 : 1024) || /[\u0000-\u001f\u007f]/.test(config[key])) {
      fail('INVALID_CONFIG', 'WebDAV 配置包含无效字符或过长的内容。');
    }
  }
  config.endpoint = config.endpoint.trim();
  config.path = config.path.trim() || 'qiye.json';
  if (config.username.includes(':')) fail('INVALID_CONFIG', 'WebDAV 用户名不能包含冒号。');
  if (!config.username && config.password) fail('INVALID_CONFIG', '填写密码时也需要填写 WebDAV 用户名。');
  if (!config.endpoint) {
    if (requireEndpoint || config.enabled) fail('NOT_CONFIGURED', '请先填写 WebDAV 目录地址。');
  } else {
    if (!/^https?:\/\//i.test(config.endpoint) || /[\s\\]/u.test(config.endpoint)) fail('UNSAFE_URL', '目录地址须为完整的 HTTPS 地址。');
    let endpoint;
    try { endpoint = new URL(config.endpoint); } catch { fail('UNSAFE_URL', 'WebDAV 目录地址无效。'); }
    if (endpoint.username || endpoint.password || endpoint.search || endpoint.hash) fail('UNSAFE_URL', '目录地址不能包含账号、密码、查询参数或片段；请将凭据填入独立字段。');
    if (endpoint.protocol !== 'https:' && !(endpoint.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(endpoint.hostname))) {
      fail('UNSAFE_URL', 'WebDAV 使用 HTTPS；只有本机 localhost 或 127.0.0.1 的服务可使用 HTTP。');
    }
    // Reject traversal before URL normalization can silently remove dot segments.
    const rawPath = config.endpoint.replace(/^https?:\/\/[^/]+/i, '');
    checkPathSegments(rawPath, true);
    endpoint.pathname = endpoint.pathname.endsWith('/') ? endpoint.pathname : `${endpoint.pathname}/`;
    config.endpoint = endpoint.href;
  }
  if (config.path.startsWith('/') || config.path.endsWith('/') || /[?#\\]/.test(config.path)) fail('UNSAFE_PATH', '同步文件请填写相对于目录的文件名，例如 qiye.json。');
  const segments = checkPathSegments(config.path, false);
  if (!segments.length || !segments.at(-1).toLowerCase().endsWith('.json')) fail('UNSAFE_PATH', '同步文件名须以 .json 结尾。');
  config.path = segments.map(segment => encodeURIComponent(segment)).join('/');
  return config;
}

function checkPathSegments(value, allowOuterSlashes) {
  let pieces = value.split('/');
  if (allowOuterSlashes) {
    if (pieces[0] === '') pieces.shift();
    if (pieces.at(-1) === '') pieces.pop();
  }
  return pieces.map(piece => {
    let decoded;
    try { decoded = decodeURIComponent(piece); } catch { fail('UNSAFE_PATH', 'WebDAV 路径包含无效的 URL 编码。'); }
    if (!decoded || decoded === '.' || decoded === '..' || /[\u0000-\u001f\u007f/\\?#]/.test(decoded) || /%[0-9a-f]{2}/i.test(decoded)) {
      fail('UNSAFE_PATH', 'WebDAV 路径不能包含空目录、跳转目录或编码后的路径分隔符。');
    }
    return decoded;
  });
}

function webDAVTargetURL(config) {
  const checked = validateWebDAVConfig(config, { requireEndpoint: true });
  return new URL(checked.path, checked.endpoint).href;
}

function webDAVOriginPattern(config) {
  return `${new URL(webDAVTargetURL(config)).origin}/*`;
}

function chromeAPI(owner, method, ...args) {
  return new Promise((resolve, reject) => {
    try {
      const result = owner[method](...args, value => {
        if (globalThis.chrome?.runtime?.lastError) reject(new WebDAVError('BROWSER_API', '浏览器未能完成 WebDAV 权限或存储操作。'));
        else resolve(value);
      });
      if (result && typeof result.then === 'function') result.then(resolve, reject);
    } catch { reject(new WebDAVError('BROWSER_API', '浏览器未能完成 WebDAV 权限或存储操作。')); }
  });
}

/** Call directly inside a click/submit handler, before awaiting storage/network. */
function requestWebDAVPermission(config) {
  const origin = webDAVOriginPattern(config);
  if (!globalThis.chrome?.permissions?.request) return Promise.resolve(true); // Browser preview uses the server's own CORS policy.
  return chromeAPI(globalThis.chrome.permissions, 'request', { origins: [origin] }).then(granted => {
    if (!granted) fail('PERMISSION_DENIED', '未获得该 WebDAV 网站的访问权限，现有数据没有改变。');
    return true;
  });
}

async function checkPermission(config) {
  if (!globalThis.chrome?.permissions?.contains) return;
  const granted = await chromeAPI(globalThis.chrome.permissions, 'contains', { origins: [webDAVOriginPattern(config)] });
  if (!granted) fail('PERMISSION_REQUIRED', '请在 WebDAV 设置中点击连接或同步，授予所填网站的访问权限。');
}

const browserStore = {
  async get() {
    if (globalThis.chrome?.storage?.local) {
      const values = await chromeAPI(globalThis.chrome.storage.local, 'get', WEBDAV_LOCAL_KEY);
      return values?.[WEBDAV_LOCAL_KEY] ?? null;
    }
    if (!globalThis.localStorage) fail('STORAGE_UNAVAILABLE', '此环境无法保存 WebDAV 本机配置。');
    const raw = globalThis.localStorage.getItem(WEBDAV_LOCAL_KEY);
    try { return raw === null ? null : JSON.parse(raw); } catch { fail('INVALID_LOCAL_CONFIG', 'WebDAV 本机配置损坏；请清除同步配置后重新填写。'); }
  },
  async set(value) {
    if (globalThis.chrome?.storage?.local) return chromeAPI(globalThis.chrome.storage.local, 'set', { [WEBDAV_LOCAL_KEY]: value });
    if (!globalThis.localStorage) fail('STORAGE_UNAVAILABLE', '此环境无法保存 WebDAV 本机配置。');
    globalThis.localStorage.setItem(WEBDAV_LOCAL_KEY, JSON.stringify(value));
  },
  async remove() {
    if (globalThis.chrome?.storage?.local) return chromeAPI(globalThis.chrome.storage.local, 'remove', WEBDAV_LOCAL_KEY);
    if (globalThis.localStorage) globalThis.localStorage.removeItem(WEBDAV_LOCAL_KEY);
  }
};

function randomID() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  fail('CRYPTO_UNAVAILABLE', '此环境不支持安全同步标识；请在 HTTPS 页面或扩展中打开栖页。');
}

/** Ignore the local storage revision, which legitimately differs on each device. */
async function webDAVStateFingerprint(state) {
  const checked = validateImport(state);
  checked.updatedAt = 0;
  if (!globalThis.crypto?.subtle) fail('CRYPTO_UNAVAILABLE', '此环境不支持安全同步校验；请在 HTTPS 页面或扩展中打开栖页。');
  const digest = await globalThis.crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(checked)));
  return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
}

function summary(state) {
  return state ? {
    updatedAt: state.updatedAt, groups: state.groups.length,
    sites: state.items.filter(item => item.type === 'link').length,
    widgets: state.items.filter(item => item.type === 'widget').length,
    todos: state.todos.length, notesLength: state.notes.length
  } : null;
}

function strongETag(value) {
  return typeof value === 'string' && value.length <= 1024 && /^"[\x21\x23-\x7e\x80-\xff]*"$/.test(value) ? value : null;
}

function authHeader(config) {
  if (!config.username) return null;
  // RFC 7617: UTF-8 Basic credentials, sent only to the exact configured endpoint.
  const bytes = new TextEncoder().encode(`${config.username}:${config.password}`);
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return `Basic ${btoa(binary)}`;
}

function httpError(status) {
  const messages = {
    401: 'WebDAV 验证失败，请检查用户名和密码或应用专用密码。',
    403: 'WebDAV 拒绝访问，请检查目录与读写权限。',
    405: '该地址不支持所需的 WebDAV 读写方法，请填写实际的 WebDAV 目录。',
    409: '同步文件的父目录不存在或不接受此文件；请先在 WebDAV 服务中创建目录。',
    413: 'WebDAV 服务拒绝了过大的备份文件。',
    423: 'WebDAV 文件被锁定，请稍后重试。',
    507: 'WebDAV 存储空间不足。'
  };
  return new WebDAVError(`HTTP_${status}`, messages[status] || `WebDAV 返回 HTTP ${status}，本次操作尚未完成。`);
}

async function limitedText(response) {
  const length = Number(response.headers.get('Content-Length'));
  if (Number.isFinite(length) && length > MAX_BACKUP_BYTES) {
    try { await response.body?.cancel(); } catch { /* Already closed. */ }
    fail('REMOTE_TOO_LARGE', '远程备份超过 6 MiB，已停止读取。');
  }
  if (!response.body?.getReader) {
    const text = await response.text();
    if (new TextEncoder().encode(text).byteLength > MAX_BACKUP_BYTES) fail('REMOTE_TOO_LARGE', '远程备份超过 6 MiB，已停止读取。');
    return text;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8', { fatal: true });
  let size = 0, text = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      size += value.byteLength;
      if (size > MAX_BACKUP_BYTES) { await reader.cancel(); fail('REMOTE_TOO_LARGE', '远程备份超过 6 MiB，已停止读取。'); }
      text += decoder.decode(value, { stream: true });
    }
    return text + decoder.decode();
  } finally { reader.releaseLock(); }
}

/** Injectable adapters make protocol tests exercise the production algorithm. */
function createWebDAVSync({ fetchImpl = (...args) => fetch(...args), store = browserStore,
  currentState = loadState, permissionCheck = checkPermission, now = () => Date.now(), timeoutMs = REQUEST_TIMEOUT_MS,
  lock = operation => globalThis.navigator?.locks?.request
    ? globalThis.navigator.locks.request(WEBDAV_LOCAL_KEY, operation) : operation()
} = {}) {
  let queue = Promise.resolve();
  const reviews = new Map();
  const downloads = new Map();

  function serial(operation) {
    const task = () => lock(operation);
    const result = queue.then(task, task);
    queue = result.catch(() => {});
    return result;
  }

  async function readRecord() {
    const raw = await store.get();
    if (!raw) return null;
    if (raw.version !== 1 || typeof raw.revision !== 'string') fail('INVALID_LOCAL_CONFIG', 'WebDAV 本机配置格式不正确；请清除同步配置后重新填写。');
    return { ...raw, config: validateWebDAVConfig(raw.config) };
  }

  async function loadConfig() { return copy((await readRecord())?.config || DEFAULT_WEBDAV_CONFIG); }

  async function saveConfig(input) {
    const config = validateWebDAVConfig(input);
    return serial(async () => {
      const record = await readRecord();
      const identityChanged = !record || ['endpoint', 'path', 'username', 'password'].some(key => record.config[key] !== config[key]);
      await store.set({
        version: 1, revision: identityChanged ? randomID() : record.revision, config,
        baseline: identityChanged ? null : record.baseline,
        lastError: null, lastErrorAt: null, lastAction: identityChanged ? null : record.lastAction
      });
      if (identityChanged) { reviews.clear(); downloads.clear(); }
      return copy(config);
    });
  }

  async function clearConfig() {
    return serial(async () => { await store.remove(); reviews.clear(); downloads.clear(); });
  }

  async function status() {
    const record = await readRecord();
    const config = record?.config || DEFAULT_WEBDAV_CONFIG;
    return {
      configured: Boolean(config.endpoint), enabled: config.enabled, autoSync: config.autoSync,
      hasBaseline: Boolean(record?.baseline), lastSyncedAt: record?.baseline?.at || null,
      lastAction: record?.lastAction || null, lastError: record?.lastError || null,
      lastErrorAt: record?.lastErrorAt || null,
      target: config.endpoint ? webDAVTargetURL(config) : null
    };
  }

  async function request(config, method, { body, etag, create = false } = {}) {
    const target = webDAVTargetURL(config);
    await permissionCheck(config);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const headers = { Accept: 'application/json' };
    const authorization = authHeader(config);
    if (authorization) headers.Authorization = authorization;
    if (body !== undefined) headers['Content-Type'] = 'application/json; charset=utf-8';
    if (etag) headers['If-Match'] = etag;
    if (create) headers['If-None-Match'] = '*';
    try {
      const response = await fetchImpl(target, {
        method, headers, ...(body !== undefined ? { body } : {}),
        credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer', cache: 'no-store', signal: controller.signal
      });
      // redirect:error prevents sending credentials to a redirect target. Also
      // reject redirected/mismatched responses from adapters or browser anomalies.
      if (response.redirected || response.type === 'opaqueredirect' || (response.url && response.url !== target) || (response.status >= 300 && response.status < 400)) {
        try { await response.body?.cancel(); } catch { /* Nothing to consume. */ }
        fail('REDIRECT_REJECTED', 'WebDAV 地址发生了重定向。请直接填写最终目录地址；凭据不会转发到新地址。');
      }
      const result = { status: response.status, etag: strongETag(response.headers.get('ETag')), text: null };
      if (method === 'GET' && response.status === 200) result.text = await limitedText(response);
      else { try { await response.body?.cancel(); } catch { /* No response body needed. */ } }
      return result;
    } catch (error) {
      if (error instanceof WebDAVError) throw error;
      if (controller.signal.aborted) fail('TIMEOUT', method === 'PUT'
        ? 'WebDAV 上传超时，远程写入结果尚未确认；请重新同步以核对，本机数据已保留。'
        : 'WebDAV 请求超时，请检查服务地址和网络连接。');
      if (error instanceof TypeError && /encoded data/i.test(error.message)) fail('INVALID_REMOTE', '远程文件不是有效的 UTF-8 JSON 备份。');
      fail('NETWORK_ERROR', method === 'PUT'
        ? 'WebDAV 上传未能完成确认。请检查网络、证书、重定向和 CORS；网页预览还需服务端允许跨域。远程写入结果未知，请重新同步核对。'
        : '无法连接 WebDAV。请检查网络、证书和最终目录地址；网页预览还需要服务端允许 CORS，并暴露 ETag 响应头。');
    } finally { clearTimeout(timer); }
  }

  async function readRemote(config) {
    const response = await request(config, 'GET');
    if (response.status === 404) return { exists: false, state: null, fingerprint: null, etag: null };
    if (response.status !== 200) throw httpError(response.status);
    let state;
    try { state = validateImport(response.text); } catch { fail('INVALID_REMOTE', '远程文件不是兼容的栖页备份，或内容未通过校验；两端数据均未替换。'); }
    return { exists: true, state, fingerprint: await webDAVStateFingerprint(state), etag: response.etag };
  }

  async function testConnection(input) {
    const config = validateWebDAVConfig(input || await loadConfig(), { requireEndpoint: true });
    const remote = await readRemote(config);
    return {
      status: remote.exists ? 'readable' : 'empty', exists: remote.exists,
      hasStrongETag: Boolean(remote.etag), remote: summary(remote.state),
      message: remote.exists
        ? (remote.etag ? '远程备份可读取，并提供强 ETag。写入权限将在实际同步时验证。' : '远程备份可读取，但缺少可用的强 ETag；可以下载，暂不能安全覆盖上传。网页预览需暴露 ETag 响应头。')
        : '服务器返回 404，尚未找到同步文件。请确认目录已存在；首次手动同步会尝试创建文件。此测试未验证写入权限，也未创建文件。'
    };
  }

  async function matchesLocal(fingerprint) {
    return await webDAVStateFingerprint(await currentState()) === fingerprint;
  }

  function localChanged(localFingerprint) {
    return { status: 'local-changed', localFingerprint, message: '同步期间本机内容发生了变化，已停止应用旧版本。请保存后重新同步。' };
  }

  function rememberReview(record, local, localFingerprint, remote, reason) {
    const token = randomID();
    for (const [key, review] of reviews) if (now() - review.at > REVIEW_LIFETIME_MS) reviews.delete(key);
    if (reviews.size >= 20) reviews.delete(reviews.keys().next().value);
    reviews.set(token, { at: now(), revision: record.revision, localFingerprint,
      remoteFingerprint: remote.fingerprint, etag: remote.etag, exists: remote.exists });
    const messages = {
      'first-sync': '这是本机首次连接该备份，两端内容不同。请先比较并选择保留哪一端。',
      'both-changed': '本机和远程都在上次同步后发生了变化，请比较后选择，当前没有覆盖任何一端。',
      'remote-changed': '远程内容与本机不同，请确认要上传本机版本还是下载远程版本。',
      'remote-deleted': '上次同步的远程文件已不存在。请确认后再用本机内容重新创建。',
      'review-stale': '刚才比较的版本已经变化，请重新比较后选择。',
      'write-conflict': '上传前远程版本已被其他设备更新，条件写入已停止，请重新比较。',
      'after-write-changed': '上传后读回的远程版本与提交内容不同，可能已被其他设备更新。同步结果尚未确认，请比较。'
    };
    return { status: 'conflict', reason, message: messages[reason] || messages['both-changed'], review: token,
      local: summary(local), remote: summary(remote.state), remoteState: remote.state ? copy(remote.state) : null, localFingerprint };
  }

  async function recordResult(record, result) {
    await store.set({ ...record, lastAction: result.status, lastError: result.status === 'conflict' ? result.message : null,
      lastErrorAt: result.status === 'conflict' ? now() : null });
    return result;
  }

  async function baseline(record, localFingerprint, remote, action) {
    await store.set({ ...record, baseline: { localFingerprint, remoteFingerprint: remote.fingerprint,
      etag: remote.etag, at: now() }, lastAction: action, lastError: null, lastErrorAt: null });
  }

  function downloadReady(record, localFingerprint, remote) {
    const token = randomID();
    downloads.set(token, { revision: record.revision, localFingerprint, remote: copy(remote), at: now() });
    // The UI may recheck a review immediately before applying it. Bind download
    // reviews to both versions just like a conflict decision, so that recheck
    // returns a fresh download instead of spuriously reporting a stale review.
    reviews.set(token, { at: now(), revision: record.revision, localFingerprint,
      remoteFingerprint: remote.fingerprint, etag: remote.etag, exists: remote.exists });
    if (downloads.size > 20) downloads.delete(downloads.keys().next().value);
    if (reviews.size > 20) reviews.delete(reviews.keys().next().value);
    return { status: 'download-ready', message: '远程备份已读取并校验，请确认后应用到本机。',
      state: copy(remote.state), review: token, localFingerprint, remoteFingerprint: remote.fingerprint, remote: summary(remote.state) };
  }

  async function writeRemote(record, local, localFingerprint, remote) {
    if (remote.exists && !remote.etag) fail('NO_STRONG_ETAG', '服务端没有提供可用的强 ETag，无法安全覆盖远程文件。请启用 ETag；网页预览需通过 CORS 暴露 ETag 响应头。你仍可下载远程备份。');
    if (!await matchesLocal(localFingerprint)) return localChanged(localFingerprint);
    const body = exportState(local);
    const response = await request(record.config, 'PUT', { body, etag: remote.etag, create: !remote.exists });
    if (response.status === 412) {
      const latest = await readRemote(record.config);
      return recordResult(record, rememberReview(record, local, localFingerprint, latest, 'write-conflict'));
    }
    if (![200, 201, 204].includes(response.status)) throw httpError(response.status);
    let verified;
    try { verified = await readRemote(record.config); } catch {
      fail('WRITE_UNVERIFIED', '服务器已接受上传，但读回验证未完成。远程写入可能已成功；本机数据已保留，请重新同步核对。');
    }
    if (!verified.exists || verified.fingerprint !== localFingerprint) {
      return recordResult(record, rememberReview(record, local, localFingerprint, verified, 'after-write-changed'));
    }
    await baseline(record, localFingerprint, verified, 'uploaded');
    return { status: 'uploaded', localFingerprint, message: '本机版本已上传，并已读回验证。', hasStrongETag: Boolean(verified.etag) };
  }

  async function synchronize(input, { mode = 'sync', manual = false, review = null, expectedConfig = undefined } = {}) {
    const local = validateImport(input);
    const localFingerprint = await webDAVStateFingerprint(local);
    const expected = expectedConfig === undefined ? null : validateWebDAVConfig(expectedConfig);
    if (!['sync', 'upload', 'download'].includes(mode)) fail('INVALID_MODE', '不支持的同步操作。');
    return serial(async () => {
      const record = await readRecord();
      // Compare inside the same lock as network synchronization. A different tab
      // may replace the endpoint after the UI checks it but before this lock.
      // The old UI's permission prompt must never authorize a different target.
      if (expected && (!record || Object.keys(DEFAULT_WEBDAV_CONFIG).some(key => record.config[key] !== expected[key]))) {
        return { status: 'config-changed', localFingerprint, message: 'WebDAV 连接在另一标签已更改，请重新确认。' };
      }
      if (!record?.config?.enabled) return { status: 'disabled', localFingerprint, message: 'WebDAV 同步未启用。' };
      if (!manual && (!record.config.autoSync || !record.baseline)) return {
        status: 'needs-initial-sync', localFingerprint, message: '请先完成一次手动同步，再开启自动同步。'
      };
      try {
        if (!await matchesLocal(localFingerprint)) return localChanged(localFingerprint);
        const remote = await readRemote(record.config);
        if (!await matchesLocal(localFingerprint)) return localChanged(localFingerprint);
        const existingReview = review ? reviews.get(review) : null;
        if (review && (!existingReview || now() - existingReview.at > REVIEW_LIFETIME_MS || existingReview.revision !== record.revision

/** A deliberately small arithmetic parser: no eval, Function, or executable input. */
function calculateExpression(source) {
  const text = String(source).replace(/[×x]/g, '*').replace(/[÷]/g, '/').replace(/[−]/g, '-').replace(/\s+/g, '');
  if (!text || text.length > 256 || /[^\d.+\-*/()%]/.test(text)) throw new Error('请输入有效算式');
  let position = 0;
  let depth = 0;
  function number() {
    const match = /^(?:\d+(?:\.\d*)?|\.\d+)/.exec(text.slice(position));
    if (!match) throw new Error('算式还没有写完整');
    position += match[0].length;
    return Number(match[0]);
  }
  function primary() {
    if (++depth > 48) throw new Error('括号层数过多');
    let value;
    if (text[position] === '(') {
      position += 1;
      value = expression();
      if (text[position] !== ')') throw new Error('请检查括号');
      position += 1;
    } else value = number();
    depth -= 1;
    while (text[position] === '%') { value /= 100; position += 1; }
    return value;
  }
  function unary() {
    let sign = 1;
    while (text[position] === '+' || text[position] === '-') { if (text[position] === '-') sign *= -1; position += 1; }
    return sign * primary();
  }
  function term() {
    let value = unary();
    while (text[position] === '*' || text[position] === '/') {
      const operator = text[position++];
      const right = unary();
      if (operator === '/' && right === 0) throw new Error('不能除以 0');
      value = operator === '*' ? value * right : value / right;
    }
    return value;
  }
  function expression() {
    let value = term();
    while (text[position] === '+' || text[position] === '-') {
      const operator = text[position++];
      const right = term();
      value = operator === '+' ? value + right : value - right;
    }
    return value;
  }
  const value = expression();
  if (position !== text.length) throw new Error('请检查算式');
  if (!Number.isFinite(value)) throw new Error('结果超出计算范围');
  return Number(value.toPrecision(12));
}

  return `<div class="w-calculator-screen"><input class="w-calculator-input" data-widget-input="calculator" inputmode="decimal" maxlength="256" autocomplete="off" aria-label="计算算式" placeholder="0"><span class="w-calculator-error" data-live="calculator-error" role="status"></span></div><div class="w-calculator-keys">${keys.map((key) => `<button type="button" data-action="widget-calc" data-value="${key}" class="w-calculator-key${key === '=' ? ' is-equal' : ['÷', '×', '−', '+', 'C'].includes(key) ? ' is-operator' : ''}" aria-label="${({ C: '清空', '⌫': '删除一位', '=': '计算结果', '÷': '除以', '×': '乘以', '−': '减去', '+': '加上' })[key] || key}">${key}</button>`).join('')}</div>`;

function habitStreak(dates, now = new Date()) {
  const records = new Set(Array.isArray(dates) ? dates : []);
  const date = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (!records.has(localDateKey(date))) date.setDate(date.getDate() - 1);
  let streak = 0;
  while (records.has(localDateKey(date)) && streak <= 36600) { streak += 1; date.setDate(date.getDate() - 1); }
  return streak;
}

function habitList(state, now = new Date()) {
  const habits = Array.isArray(state.habits) ? state.habits : [];
  return habits.length ? habits.map((habit) => {

    const streak = habitStreak(habit.dates, now);
    return `<li class="w-habit-row"><button type="button" class="w-habit-check${done ? ' is-done' : ''}" data-action="widget-habit-toggle" data-habit-id="${escapeHtml(habit.id)}" aria-pressed="${done}" aria-label="${escapeHtml(`${done ? '取消今日打卡' : '今日打卡'}：${habit.name}`)}">${icon('check')}</button><span class="w-habit-name" title="${escapeHtml(habit.name)}">${escapeHtml(habit.name)}<small>${streak ? `连续 ${streak} 天` : '从今天开始'}</small></span><button type="button" class="widget-icon-button w-row-delete" data-action="widget-habit-delete" data-habit-id="${escapeHtml(habit.id)}" aria-label="${escapeHtml(`删除习惯：${habit.name}`)}">${icon('close')}</button></li>`;

}

}

function cityKey(city) { return `${city.latitude.toFixed(4)},${city.longitude.toFixed(4)}`; }

function weatherDescription(code) {
  if (code === 0) return '晴';
  if (code === 1) return '晴间多云';
  if (code === 2) return '多云';
  if (code === 3) return '阴';
  if ([45, 48].includes(code)) return '雾';
  if ([51, 53, 55, 56, 57].includes(code)) return '毛毛雨';
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '雨';
  if ([71, 73, 75, 77, 85, 86].includes(code)) return '雪';
  if ([95, 96, 99].includes(code)) return '雷雨';
  return '天气数据';
}

function weatherArt(code = 2, isDay = true) {
  const cloud = '<path d="M21 54c-9 0-15-6-15-13s6-13 13-13c3-11 12-17 22-15 10 2 16 9 16 18 9-1 17 4 17 12s-6 13-15 13H21Z" fill="rgba(255,255,255,.96)"/>';
  const sun = '<circle cx="56" cy="23" r="15" fill="#ffd982"/><g stroke="#ffe6a9" stroke-width="2.5" stroke-linecap="round"><path d="M56 2v-2m0 44v3M35 23h-3m45 0h3M41 8l-2-2m34 34 2 2M41 38l-2 2M71 8l2-2"/></g>';
  const moon = '<path d="M64 8a18 18 0 1 0 14 28A18 18 0 0 1 64 8Z" fill="#fff0bd"/>';
  const precipitation = code >= 51 && code < 95;
  const snow = [71, 73, 75, 77, 85, 86].includes(code);
  return `<svg class="w-weather-art" viewBox="0 0 84 78" aria-hidden="true">${code <= 2 ? (isDay ? sun : moon) : ''}${code === 0 ? '' : cloud}${precipitation ? `<g stroke="${snow ? '#fff' : '#bfe9ff'}" stroke-width="3" stroke-linecap="round"><path d="m24 64-3 6m20-6-3 6m20-6-3 6"/>${snow ? '<path d="m19 65 7 4m10-4 7 4m10-4 7 4"/>' : ''}</g>` : ''}${code >= 95 ? '<path d="m44 58-9 12h7l-3 9 16-17h-9l4-4Z" fill="#ffda79"/>' : ''}</svg>`;
}

function parseWeatherResponse(raw, now = Date.now()) {
  const current = raw?.current;
  if (!current || typeof current.temperature_2m !== 'number' || !Number.isFinite(current.temperature_2m) || typeof current.weather_code !== 'number' || !Number.isFinite(current.weather_code)) throw new Error('天气服务返回的数据不完整');
  const number = (value) => typeof value === 'number' && Number.isFinite(value) ? value : null;
  return { fetchedAt: now, temperature: current.temperature_2m, feelsLike: number(current.apparent_temperature), humidity: number(current.relative_humidity_2m), code: current.weather_code, isDay: current.is_day !== 0, max: number(raw.daily?.temperature_2m_max?.[0]), min: number(raw.daily?.temperature_2m_min?.[0]), observedAt: typeof current.time === 'string' ? current.time : '' };
}

function readWeatherCache(key) {
  try {
    const value = JSON.parse(globalThis.localStorage?.getItem(WEATHER_CACHE_KEY) || '{}')[key];
    return value && Number.isFinite(value.temperature) && Number.isFinite(value.code) && Number.isFinite(value.fetchedAt) && value.fetchedAt <= Date.now() + 60_000 ? value : null;
  } catch { return null; }
}

function writeWeatherCache(key, data) {
  try {
    let cache;
    try { cache = JSON.parse(globalThis.localStorage?.getItem(WEATHER_CACHE_KEY) || '{}'); } catch { cache = {}; }
    const entries = Object.entries(cache && typeof cache === 'object' ? cache : {}).filter(([other, value]) => other !== key && value && Number.isFinite(value.fetchedAt)).sort((a, b) => b[1].fetchedAt - a[1].fetchedAt).slice(0, 7);
    globalThis.localStorage?.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ...Object.fromEntries(entries), [key]: data }));
  } catch { /* The weather still works when browser storage is unavailable. */ }
}

function weatherState(city) {
  const key = cityKey(city);
  if (!weatherStates.has(key)) weatherStates.set(key, { status: 'idle', data: readWeatherCache(key), error: '', lastAttempt: 0 });
  return weatherStates.get(key);
}

  const top = header(city.name, 'pin', configButton('设置天气城市'));
  if (!state.settings?.weatherEnabled) return `${top}<div class="w-weather-off">${weatherArt(2)}<span>把天气带进新标签页</span><button type="button" class="w-weather-enable" data-action="widget-weather-enable">启用天气</button></div><div class="w-weather-source">发送城市坐标至 Open-Meteo</div>`;
  const current = weatherState(city);
  if (!current.data) return `${top}<div class="w-weather-unavailable">${icon('cloud')}<strong>${current.status === 'error' ? '暂时无法获取天气' : '正在获取天气'}</strong><span>${current.status === 'error' ? escapeHtml(current.error) : '等待 Open-Meteo 返回数据'}</span>${current.status === 'error' ? '<button type="button" class="w-weather-enable" data-action="widget-weather-retry">重新加载</button>' : '<span class="w-weather-loading" aria-label="正在加载"></span>'}</div><div class="w-weather-source">Open-Meteo</div>`;
  const weather = current.data;
  const updated = new Date(weather.fetchedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  const stale = Date.now() - weather.fetchedAt >= WEATHER_TTL;
  const detail = [weatherDescription(weather.code), weather.min !== null && weather.max !== null ? `${Math.round(weather.min)}° / ${Math.round(weather.max)}°` : ''].filter(Boolean).join(' · ');
  return `${top}<div class="w-weather-current"><strong>${Math.round(weather.temperature)}<sup>°</sup></strong>${weatherArt(weather.code, weather.isDay)}</div><div class="w-weather-description">${escapeHtml(detail)}</div><div class="w-weather-details">${weather.feelsLike !== null ? `<span>体感 ${Math.round(weather.feelsLike)}°</span>` : ''}${weather.humidity !== null ? `<span>湿度 ${Math.round(weather.humidity)}%</span>` : ''}</div><button type="button" class="w-weather-update${current.status === 'error' ? ' is-error' : ''}" data-action="widget-weather-retry" title="${escapeHtml(current.status === 'error' ? current.error : '重新获取天气')}"${current.status === 'loading' ? ' disabled' : ''}>${current.status === 'loading' ? '正在更新…' : current.status === 'error' ? `缓存 ${updated} · 更新失败 ↻` : `${stale ? '缓存' : '更新'} ${updated} · Open-Meteo ↻`}</button>`;
}

function cachedWallpaper() {
  try {
    const stored = globalThis.localStorage?.getItem(WALLPAPER_CACHE_KEY) || '';
    if (stored.length > 5000) return null;
    const cache = JSON.parse(stored || '{}');
    if (!Number.isFinite(cache.at) || Date.now() - cache.at > 86_400_000 || cache.at > Date.now() + 60_000) return null;
    const photo = normalizeWallpaperPhoto(cache.photo);
    return photo ? { photo, page: Number.isInteger(cache.page) && cache.page >= 1 && cache.page <= 1000 ? cache.page : 1 } : null;
  } catch { return null; }
}

function currentWallpaperBrowser(state) {
  if (!wallpaperBrowser) {
    const cached = cachedWallpaper();
    wallpaperBrowser = createWallpaperBrowser({
      initialPhoto: cached?.photo || normalizeWallpaperPhoto(state.settings?.remoteWallpaper),
      startPage: cached?.page || 1 + Math.floor(Math.random() * 20),
      onChange: (reason) => {
        const current = wallpaperBrowser.getState();
        if (current.status === 'ready' && current.photo) {
          try { globalThis.localStorage?.setItem(WALLPAPER_CACHE_KEY, JSON.stringify({ at: Date.now(), page: current.page, photo: current.photo })); } catch { /* Browsing still works without local cache. */ }
        }
        for (const binding of wallpaperBindings) {
          if (reason === 'image') syncWallpaperImages(binding);
          else updateWallpaperCards(binding);
        }
      },
    });
  }
  return wallpaperBrowser;
}

function wallpaperStatus(current) {
  if (current.applying) return '正在应用壁纸…';
  if (current.status === 'loading') return '正在寻找下一处风景…';
  if (current.status === 'error') return current.error;
  if (current.imageStatus === 'error') return '照片暂时无法加载，可以换一张';
  if (current.imageStatus === 'loading') return '照片加载中…';
  return '';
}

function renderWallpaper(item, state) {
  const enabled = state.settings?.wallpaperApiEnabled === true;
  const current = enabled ? currentWallpaperBrowser(state).getState() : null;
  const photo = current?.photo;
  const disableButton = enabled ? `<button type="button" class="widget-icon-button" data-action="widget-wallpaper-disable" title="暂停在线壁纸" aria-label="暂停在线壁纸">${icon('pause')}</button>` : '';
  const top = header('在线壁纸', 'image', `<div class="widget-heading-actions">${enabled ? `<button type="button" class="widget-icon-button" data-action="widget-wallpaper-refresh" title="换一组照片" aria-label="换一组照片"${current.status === 'loading' || current.applying ? ' disabled' : ''}>${icon('reset')}</button>` : '<span class="w-wallpaper-provider-tag">PICSUM</span>'}${disableButton}</div>`);
  const landscape = '<svg class="w-wallpaper-landscape" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="309" cy="40" r="27" fill="#f5dca8"/><path d="M0 105 67 38 144 129 236 75 344 164 400 111V180H0Z" fill="#4d807b"/><path d="m0 152 103-70 97 79 84-43 116 38v24H0Z" fill="#285a57"/><path d="m0 172 140-45 125 53H0Z" fill="#1e4847"/></svg>';
  if (!enabled) return `${landscape}<div class="w-wallpaper-content">${top}<div class="w-wallpaper-invite"><strong>给桌面换一处风景</strong><span>来自公开摄影图库 · 无需账号</span><button type="button" class="w-wallpaper-primary" data-action="widget-wallpaper-enable">浏览在线壁纸 ${icon('arrow')}</button></div><div class="w-wallpaper-disclosure">启用后向 Picsum 及其图片服务请求照片</div></div>`;

function updateWallpaperCards(binding) {
  if (!binding.alive) return;
  const state = binding.context.getState();
  for (const root of widgetRoots(binding.container, 'wallpaper')) {
    const item = findItem(root, state);
    if (item) root.innerHTML = renderWallpaper(item, state);
  }
  syncWallpaperImages(binding);
}

function syncWallpaperImages(binding) {
  if (!binding.alive || !wallpaperBrowser) return;
  const state = binding.context.getState();
  const current = wallpaperBrowser.getState();
  for (const root of widgetRoots(binding.container, 'wallpaper')) {
    const image = root.querySelector('[data-widget-image="wallpaper"]');
    if (!image || image.dataset.photoId !== current.photo?.id || state.settings?.wallpaperApiEnabled !== true) continue;
    root.classList.toggle('has-wallpaper-image', current.imageStatus === 'ready');
    root.classList.toggle('has-wallpaper-error', current.imageStatus === 'error');

async function removeItem(id) {
 const item=state.items.find(i=>i.id===id); if(!item)return;
 const removed=clone(item), oldIndex=state.items.indexOf(item), childIds=state.items.filter(i=>i.folderId===id).map(i=>i.id);
 if(item.type==='folder')state.items.forEach(i=>{if(i.folderId===id)i.folderId=null;});
 state.items=state.items.filter(i=>i.id!==id); await commit();
 toast(item.type==='folder'?'文件夹已移除，里面的网站已移回桌面。':`已移除${item.title}`,async()=>{
  if(!state.groups.some(g=>g.id===removed.groupId))removed.groupId=currentGroup().id;

  if(!state.items.some(i=>i.id===removed.id))state.items.splice(Math.min(oldIndex,state.items.length),0,removed);
  if(removed.type==='folder')state.items.forEach(i=>{if(childIds.includes(i.id)&&!i.folderId&&i.groupId===removed.groupId)i.folderId=removed.id;});

 });

 item.groupId=targetGroup;if(item.type==='link')item.folderId=folderId;
 if(item.type==='folder')state.items.forEach(i=>{if(i.folderId===id)i.groupId=targetGroup;});
 await commit();
}
function exportBackup(source=state) {
 const data=exportState(source);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=`Qiye-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('备份已导出。');
}
async function importBookmarks(button) {
 if(button)button.disabled=true;
 try { const bookmarks=await requestBookmarks(); if(!bookmarks.length)return toast('浏览器中没有可导入的 http / https 书签。'); openDialog('import-preview',{bookmarks}); }
 catch(err){toast(err.message);}
 finally{if(button?.isConnected)button.disabled=false;}
}
function contextButton(action,label,glyph='grid',extra='') { return `<button role="menuitem" data-context="${action}" ${extra}>${icon(glyph)}${label}</button>`; }
function openContext(event,{itemId,groupId}={}) {
 event.preventDefault(); hideSearchMenus();
 const menu=$('#context-menu');menu.dataset.item=itemId || '';menu.dataset.group=groupId || '';
 const item=state.items.find(i=>i.id===itemId),group=state.groups.find(g=>g.id===groupId);
 let html;
 if(item) html = `${contextButton('edit','编辑'+(item.type==='widget'?'组件':item.type==='folder'?'文件夹':'网站'),'edit')}${contextButton('move','移动到…','move')}${contextButton('duplicate','复制一份','copy')}<hr><div class="menu-label">卡片尺寸</div><div class="size-options">${(item.type==='widget'?['2x2','4x2']:['1x1','2x1','2x2','4x2']).map(s=>`<button data-context="resize" data-size="${s}" class="${item.size===s?'selected':''}">${s.replace('x',' × ')}</button>`).join('')}</div><hr>${contextButton('delete','移除','trash','class="danger"')}`;
 else if(group)html=`${contextButton('edit-group','编辑分组','edit')}${state.groups.length>1?contextButton('delete-group','删除分组','trash','class="danger"'):''}`;
 else html=`${contextButton('add-link','添加网站','link')}${contextButton('add-widget','添加组件','grid')}${contextButton('add-folder','新建文件夹','folder')}<hr>${contextButton('edit-desktop',editing?'完成编辑':'编辑桌面','edit')}${contextButton('wallpaper','更换壁纸','wallpaper')}${contextButton('local-search','本地搜索','search')}<hr>${contextButton('export','立即备份','download')}${contextButton('settings','设置','settings')}`;
 menu.innerHTML=html;menu.hidden=false;
 const r=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(event.clientX,innerWidth-r.width-8))+'px';menu.style.top=Math.max(8,Math.min(event.clientY,innerHeight-r.height-8))+'px';
}
function confirmDeleteGroup(id) {
 const group=state.groups.find(g=>g.id===id);if(!group || state.groups.length<2)return;
 const target=state.groups.find(g=>g.id!==id);
 openDialog('confirm',{title:`删除「${group.name}」分组？`,message:`其中的网站和组件会移到「${target.name}」，内容会保留。`,label:'删除分组',callback:async()=>{
  const oldGroup=clone(group),oldIndex=state.groups.indexOf(group),movedIds=state.items.filter(i=>i.groupId===id).map(i=>i.id);
  state.groups=state.groups.filter(g=>g.id!==id);state.items.forEach(i=>{if(i.groupId===id)i.groupId=target.id;});state.activeGroupId=target.id;await commit();closeDialog();
  toast('分组已删除，内容已保留。',async()=>{
   if(!state.groups.some(g=>g.id===id))state.groups.splice(Math.min(oldIndex,state.groups.length),0,oldGroup);
   const eligible=new Set(state.items.filter(i=>movedIds.includes(i.id)&&i.groupId===target.id).map(i=>i.id));
   state.items.forEach(i=>{if(eligible.has(i.id)&&(!i.folderId||eligible.has(i.folderId)))i.groupId=id;});
   state.activeGroupId=id;await commit();toast('已恢复分组。');
  });
 }});
}

dialog.addEventListener('submit',async event=>{
 event.preventDefault();const form=event.target;const data=new FormData(form);const value=name=>String(data.get(name) || '').trim();
 const submit=$('button[type=submit]',form);if(submit)submit.disabled=true;

   const url=safeUrl(value('url'));if(!url)throw new Error('请输入有效的 http 或 https 网站地址。');
   if(!value('title'))throw new Error('请填写网站名称。');
   const old=state.items.find(i=>i.id===form.dataset.id),groupId=value('groupId');
   const item={...(old || {}),id:old?.id || uid(),type:'link',title:value('title'),url,icon:value('icon') || value('title').slice(0,2),iconMode:value('iconMode')==='text'?'text':'auto',color:value('color') || COLORS[0],groupId,size:old?.size || '1x1',folderId:old?.groupId===groupId?old.folderId:null};
   if(old)state.items[state.items.indexOf(old)]=item;else state.items.push(item);
   await commit();closeDialog();toast(old?'网站已更新。':'已添加到桌面。');
  }else if(form.id==='folder-form'){
   const old=state.items.find(i=>i.id===form.dataset.id),groupId=value('groupId');
   if(old){old.title=value('title');old.groupId=groupId;state.items.forEach(i=>{if(i.folderId===old.id)i.groupId=groupId;});}

   await commit();closeDialog();toast('文件夹已保存。');
  }else if(form.id==='group-form'){
   const old=state.groups.find(g=>g.id===form.dataset.id);
   if(old){old.name=value('name');old.icon=value('icon');}else{const g={id:uid(),name:value('name'),icon:value('icon')};state.groups.push(g);state.activeGroupId=g.id;}
   await commit();closeDialog();toast('分组已保存。');
  }else if(form.id==='engine-form'){
   if(state.settings.customEngines.length>=12)throw new Error('最多支持 12 个自定义引擎，请先删除不再使用的引擎。');
   const template=value('url');if(!template.includes('{q}'))throw new Error('搜索地址需要包含 {q} 占位符。');if(!safeUrl(template.replace(/\{q\}/g,'test')))throw new Error('搜索地址必须使用 http 或 https。');
   state.settings.customEngines.push({id:uid(),name:value('name'),letter:value('name').slice(0,1),color:'#83cbb2',url:template});await persist();renderEngine();openDialog('settings',{tab:'search'});toast('搜索引擎已添加。');
  }else if(form.id==='widget-form'){
   const item=state.items.find(i=>i.id===form.dataset.id),type=form.dataset.type;if(!item)throw new Error('组件已被移除，请重新添加。');
   item.title=value('title');item.size=value('size');const c=item.config || (item.config={});
   if(type==='weather'){const latitude=Number(value('latitude')),longitude=Number(value('longitude'));if(!Number.isFinite(latitude)||latitude<-90||latitude>90||!Number.isFinite(longitude)||longitude<-180||longitude>180)throw new Error('请填写有效的经纬度。');state.settings.weatherCity={name:value('cityName'),latitude,longitude};state.settings.weatherEnabled=data.has('weatherEnabled');}
   if(type==='countdown'){c.title=value('eventTitle');c.date=value('date');}
   if(type==='focus'){const duration=Number(value('duration'));if(!Number.isInteger(duration)||duration<1||duration>180)throw new Error('专注时长需为 1–180 分钟。');state.focus={duration,remaining:duration*60,endAt:null,running:false};}
   if(type==='workday'){c.endTime=value('endTime');c.payday=Number(value('payday'));c.workdays=data.getAll('workdays').map(Number);}
   if(type==='clock'){c.timeZone=value('timeZone');c.label=value('label');}
   if(type==='quote'){c.text=value('text');c.author=value('author');}
   if(type==='notes')c.color=value('color');
   await commit();closeDialog();toast('组件设置已保存。');
  }else if(form.id==='move-form'){
   const folder=state.items.find(i=>i.id===value('folderId')&&i.type==='folder');await moveItem(form.dataset.id,folder?.groupId || value('groupId'),folder?.id || null);closeDialog();toast('已移动。');

   await commit();closeDialog();toast(`已导入 ${count} 个网站，相同分组内的重复网址已跳过。`);
  }
 }catch(err){const area=$('#form-error',form);if(area){area.textContent=err.message || '保存失败，请检查填写内容。';area.hidden=false;}else toast(err.message);}

  if(input.dataset.range){await persist();return;}
  if(input.name==='searchEngine'&&dialogKind==='settings'){state.settings.searchEngine=input.value;await persist();renderEngine();return;}
  if(input.name==='cityPreset'&&input.value){const [name,lat,lon]=input.value.split('|');const f=input.form;f.elements.cityName.value=name;f.elements.latitude.value=lat;f.elements.longitude.value=lon;return;}

  if(input.id==='backup-file'){
   const file=input.files?.[0];input.value='';if(!file)return;if(file.size>6*1024*1024)throw new Error('备份文件过大，最大支持 6 MB。');
   const restored=validateImport(await file.text());openDialog('restore-preview',{state:restored});return;

   const file=input.files?.[0];input.value='';if(!file)return;if(file.size>4*1024*1024)throw new Error('壁纸最大支持 4 MB，请先压缩图片或视频。');
   if(!/^(image\/(png|jpeg|webp|gif|avif)|video\/(mp4|webm))$/.test(file.type))throw new Error('请使用 PNG、JPEG、WebP、GIF、AVIF 图片或 MP4、WebM 视频。');
   const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('文件读取失败'));reader.readAsDataURL(file);});
   const old=clone(state.settings);state.settings.customWallpaper=url;state.settings.customWallpaperType=file.type.startsWith('video/')?'video':'image';state.settings.remoteWallpaper=null;
   try{await persist();}catch(err){state.settings=old;throw err;}
   applySettings();openDialog('wallpaper');toast('本地壁纸已保存。');

 }catch(err){if(input.dataset.setting||input.dataset.range)renderDesktop();if(!err.notified)toast(err.message || '操作没有完成。');}

async function applyDesktopDrop(intent) {
 if (intent.kind === 'group-reorder') {
  const ordered = reorderById(state.groups,intent.groupId,intent.targetId,intent.position);
  if (ordered === state.groups) return;
  state.groups = ordered; await commit(); return;
 }
 const item = state.items.find(entry => entry.id === intent.itemId);
 if (!item) return;
 if (intent.kind === 'reorder') {
  const target = state.items.find(entry => entry.id === intent.targetId);
  if (!target || item.groupId !== target.groupId || item.folderId || target.folderId) return;
  const ordered = reorderById(state.items,item.id,target.id,intent.position);
  if (ordered === state.items) return;
  state.items = ordered; await commit(); return;
 }
 if (!state.groups.some(group => group.id === intent.groupId)) return;
 if (intent.kind === 'folder') {
  const folder = state.items.find(entry => entry.id === intent.folderId && entry.type === 'folder' && entry.groupId === intent.groupId);
  if (!folder || item.type !== 'link') return;
  await moveItem(item.id,folder.groupId,folder.id); toast('已收进文件夹。'); return;
 }
 if (intent.kind === 'group') {
  await moveItem(item.id,intent.groupId); toast('已移动到所选分组。'); return;
 }
 if (intent.kind === 'append') {
  item.groupId = intent.groupId;
  if (item.type === 'link') item.folderId = null;
  if (item.type === 'folder') state.items.forEach(child => { if (child.folderId === item.id) child.groupId = intent.groupId; });
  state.items = [...state.items.filter(entry => entry.id !== item.id),item];
  await commit();
 }
}

async function init() {
 try{state=await loadState();persistedState=clone(state);}catch(err){blockedStorage=true;toast(err.message);}
 syncController=createSyncController({
  getState:()=>clone(state), beforeSync:async()=>{await saveQueue;if(blockedStorage)throw new Error('请先恢复本机桌面数据，再进行同步。');if(JSON.stringify(state)!==JSON.stringify(persistedState))await persist({fromSync:true});},
  applyRemote:applySyncedDesktop,toast,openDialog,closeDialog,exportBackup,
  isEditing:()=>dialog.open || desktopDrag?.isDragging() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || ''),
  refreshPanel:()=>{if(dialogKind==='settings'&&dialogData.tab==='sync')openDialog('settings',{tab:'sync'});}
 });
 await syncController.init();
 await faviconCacheReady;
 $$('[data-action=add-group]').forEach(e=>e.innerHTML=icon('plus'));
 $$('.sidebar-bottom [data-action=local-search]').forEach(e=>e.innerHTML=icon('search'));
 $$('.sidebar-bottom [data-action=settings]').forEach(e=>e.innerHTML=icon('settings'));
 $$('.top-tools [data-action=wallpaper]').forEach(e=>e.innerHTML=icon('wallpaper'));
 $$('.top-tools [data-action=edit]').forEach(e=>e.innerHTML=icon('edit'));
 $$('.top-tools [data-action=add]').forEach(e=>e.innerHTML=icon('plus'));
 $('#search-submit').innerHTML=icon('search');
 desktopDrag=createDesktopDragController({
  document, getState:()=>state, getActiveGroupId:()=>currentGroup().id,
  canDragGroups:()=>editing, isBlocked:()=>dialog.open || blockedStorage || state.settings.minimal,
  onStart:()=>{hideSearchMenus();$('#context-menu').hidden=true;},
  onDrop:applyDesktopDrop,
  onError:err=>{renderDesktop();if(!err.notified)toast(err.message || '移动未保存，请重试。');}
 });
 renderDesktop();
 subscribeState(incoming=>{if(saving || !incoming || incoming.updatedAt===state.updatedAt)return;state=incoming;persistedState=clone(incoming);if(!dialog.open&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName || ''))renderDesktop();});
 new ResizeObserver(updateGrid).observe($('.desktop-wrap'));
 new ResizeObserver(updatePinnedHeader).observe($('#clock-block'));
 window.addEventListener('scroll',updatePinnedHeader,{passive:true});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applySettings);
 setInterval(()=>{renderClock();if(!document.hidden)refreshLiveWidgets($('#desktop'),state);},1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderClock();refreshLiveWidgets($('#desktop'),state);syncController.onVisible();}});
 document.addEventListener('focusout',()=>syncController.onIdle());
 setInterval(()=>{if(!document.hidden)syncController.onIdle();},60000);
 if(new URLSearchParams(location.search).get('search')==='local')openDialog('local-search');
 if(blockedStorage)openDialog('settings',{tab:'data'});
}
init().catch(err=>{console.error('Qiye initialization failed',err);toast('桌面初始化失败，请刷新页面重试。');});

</script>
</body>
</html>
