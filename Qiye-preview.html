main{margin-left:66px;padding:0 34px 70px;min-height:100vh}.hero{padding-top:46px;text-align:center;position:relative;z-index:11}.clock{display:inline-flex;align-items:baseline;padding:0 8px;line-height:1.1;letter-spacing:-2.5px;color:#fff;font-variant-numeric:tabular-nums;font-size:var(--clock-size);font-weight:300;text-shadow:0 2px 22px #00152518;transition:opacity .15s}.clock:hover{opacity:.85}#clock-seconds{font-size:.38em;letter-spacing:0;opacity:.65;padding-left:9px}#clock-period{font-size:14px;margin-left:8px;letter-spacing:0}.date{font-size:13px;font-weight:400;letter-spacing:.5px;margin-top:6px;color:#ffffffca;min-height:18px}.search-wrapper{position:relative;margin:31px auto 0;width:min(620px,100%);text-align:left}.search-form{display:flex;align-items:center;gap:4px;height:50px;border-radius:18px;background:#f3f7f4ca;box-shadow:0 8px 32px #071b301a;border:1px solid #ffffff21;backdrop-filter:blur(24px);transition:.2s;color:#203841}.search-form:focus-within{background:#f9fcf5ed;box-shadow:0 10px 40px #001c3533,0 0 0 3px #c8fff012}.engine-button{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 0 0 16px;height:100%;width:62px;flex-shrink:0}.engine-letter{display:grid;place-items:center;font-size:20px;font-weight:750}.engine-button .icon{width:10px;height:10px;opacity:.6}.search-form input{border:none;outline:none;background:none;min-width:0;flex:1;color:#263a43;height:100%;font-size:14px;padding:0 6px}.search-form input:focus{outline:none}.search-form input::placeholder{color:#5a6d7399}.search-form input::-webkit-search-cancel-button{opacity:.5}.search-shortcut{color:#6a7a7c8f;white-space:nowrap;border:1px solid #52697322;border-radius:5px;font-size:10px;font-family:inherit;padding:3px 5px;user-select:none}.search-submit{width:46px;height:100%;flex-shrink:0;color:#415963}.search-submit .icon{width:19px;height:19px}.engine-menu,.search-suggestions{position:absolute;top:60px;left:0;right:0;border:1px solid var(--panel-border);padding:9px; .sidebar>.brand,.sidebar>.side-button,.sidebar-bottom{flex-shrink:0}
.groups{flex:1;min-height:0;max-height:none;gap:8px;padding:2px 0 8px}
.group-button{width:46px;min-height:55px;border-radius:13px;gap:6px;color:rgba(240,248,248,.7);transition:background .18s,color .18s}
.group-button.active{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#f5fffc}
.group-button.active:before{left:-9px;width:2px;height:21px;background:#b7f4e4}
.group-button .icon{width:19px;height:19px}
.sidebar-bottom{gap:8px;padding-bottom:20px;margin-top:8px}
.side-button{width:40px;height:40px}
.top-tools{position:fixed;top:22px;right:25px;gap:8px}
.tool-button{width:35px;height:35px;border-radius:11px;background:rgba(15,31,40,.14);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.1)}
.tool-button:hover{background:rgba(255,255,255,.19);box-shadow:0 4px 18px #0613231c}
main{margin-left:64px;padding:0 38px 90px}
.hero{padding-top:clamp(62px,8vh,100px)}
.clock{font-weight:300;letter-spacing:-3px;text-shadow:0 2px 22px #00152524}
.date{margin-top:8px;font-size:12px;letter-spacing:.7px;color:rgba(255,255,255,.84)}
.search-wrapper{width:min(640px,100%);margin-top:29px}
.search-form{height:52px;border-radius:27px;background:rgba(246,249,247,.83);border-color:rgba(255,255,255,.32);box-shadow:0 6px 26px rgba(9,25,39,.13);transition:background .18s,box-shadow .18s}
.search-form:focus-within{background:rgba(252,254,253,.96);box-shadow:0 12px 38px rgba(5,24,37,.18),0 0 0 3px rgba(213,255,242,.13)}
.engine-button{width:65px;padding-left:17px;position:relative;border-radius:27px 0 0 27px}
.engine-button:after{content:"";position:absolute;right:1px;top:17px;bottom:17px;width:1px;background:rgba(54,75,76,.16)}
.search-form input{padding-left:13px;font-size:14px}
.search-submit{width:48px;border-radius:0 27px 27px 0;transition:background .16s}
.search-submit:hover{background:rgba(48,92,79,.08)}
.search-shortcut{font-size:9px;opacity:.7;padding:3px 6px}
.engine-menu,.search-suggestions{top:61px;border-radius:17px;padding:8px;box-shadow:0 16px 48px #0713213b}
.engine-option,.suggestion{min-height:39px}
.desktop-wrap{max-width:1280px;margin:32px auto 0}
.desktop-heading{margin-bottom:14px;color:rgba(255,255,255,.65)}
#group-heading{font-size:12px;letter-spacing:.4px}
.desktop{padding-bottom:36px}
.tile-body{height:calc(100% - 24px)}
.tile-link[data-size="1x1"] .tile-body,.tile-add .tile-body{max-width:calc(var(--tile-size) - 10px);max-height:calc(var(--tile-size) - 10px)}
.tile-link .tile-body:hover,.tile-folder .tile-body:hover{transform:translateY(-3px);box-shadow:0 10px 24px #06152238,inset 0 1px 0 #ffffff1f}
.tile-link .tile-body:active,.tile-folder .tile-body:active{transform:translateY(-1px) scale(.98)}
.tile-link .tile-body>.icon{width:30px;height:30px}
.tile-label{height:24px;padding-top:8px;font-size:11px;line-height:15px;letter-spacing:.15px;text-shadow:0 1px 7px rgba(0,0,0,.46)}
.tile-widget .tile-body{box-shadow:0 6px 23px #09172520}
.tile-actions button{box-shadow:0 2px 9px #07162335}
.tile-add .tile-body{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.09)}
.tile-add .tile-body:hover{border-color:rgba(255,255,255,.7)}
.app-dialog{width:min(700px,calc(100% - 36px));max-height:calc(100dvh - 64px);border-radius:22px;box-shadow:0 28px 110px #030b1661;scrollbar-gutter:stable}
.dialog-head{position:sticky;top:0;z-index:4;background:var(--panel);padding:25px 28px 20px;border-bottom:1px solid var(--panel-border)}
.dialog-head h2{font-weight:600;font-size:19px}
.dialog-head p{font-size:12px;line-height:1.65}
.dialog-close{width:33px;height:33px;border-radius:50%}
.tab-bar{margin-top:16px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-button{white-space:nowrap;font-size:12px;min-height:37px}
.dialog-body{padding-top:17px}
.field>span{font-size:12px}
.field input,.field select,.field textarea{border-radius:10px}
.field small,.help-text{line-height:1.8}
.primary-button,.secondary-button,.danger-button{min-height:37px;border-radius:10px;font-size:12px}
.setting-row{padding-top:15px;padding-bottom:15px;gap:18px}
.setting-copy strong{font-size:12px}
.setting-copy small{line-height:1.75}
.catalog-card{border-radius:15px;transition:background .18s,border-color .18s,transform .18s}
.catalog-card:hover{transform:translateY(-2px)}
.context-menu{width:205px;border-radius:14px;padding:6px}
.context-menu button{min-height:34px;font-size:12px;gap:11px}
.context-menu .size-options button{min-height:29px;font-size:10px}
.toast{border-radius:14px;bottom:40px;max-width:min(650px,calc(100% - 36px))}
.daily-quote{left:96px;right:32px;bottom:35px;color:rgba(255,255,255,.71)}
.wallpaper-credit{position:fixed;right:21px;bottom:10px;z-index:16;max-width:min(350px,70vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 9px;border-radius:6px;background:rgba(9,20,30,.2);color:rgba(255,255,255,.72);font-size:10px;line-height:1.5;backdrop-filter:blur(9px);text-shadow:0 1px 5px #0005;transition:color .16s,background .16s}
.wallpaper-credit:hover{color:#fff;background:rgba(9,20,30,.42)}
.minimal .wallpaper-credit{opacity:.65}.minimal .wallpaper-credit:hover{opacity:1}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:1700px){.hero{padding-top:9vh}.desktop-wrap{margin-top:38px}.search-wrapper{width:660px}}
@media(max-width:1000px){main{padding-right:26px;padding-left:26px}.desktop-wrap{margin-top:28px}.hero{padding-top:68px}}
@media(max-width:700px){.top-tools{top:17px;right:19px}.app-dialog{width:calc(100% - 26px);max-height:calc(100dvh - 26px)}.dialog-head{padding:21px 21px 18px}.dialog-body{padding-right:21px;padding-left:21px}.tab-bar{margin-left:21px;margin-right:21px}.search-form{height:49px}.search-form input{font-size:12px}.date{font-size:11px}.engine-menu{grid-template-columns:repeat(3,minmax(0,1fr))}.engine-option{padding:10px 8px;font-size:11px}}
@media(max-width:560px){.sidebar{width:52px}.brand{margin-top:22px;margin-bottom:15px}.group-button{width:40px;min-height:51px;font-size:9px}.group-button.active:before{left:-6px}.groups{gap:6px}.side-button{width:35px;height:35px}.sidebar-bottom{padding-bottom:13px;gap:5px}main{margin-left:52px;padding:0 16px 88px}.hero{padding-top:80px}.clock{font-size:clamp(48px,12vw,70px);letter-spacing:-2px}.search-wrapper{margin-top:24px}.search-form{height:46px}.engine-button{width:49px;padding-left:10px}.engine-button:after{top:14px;bottom:14px}.search-form input{padding-left:9px;font-size:11px}.search-submit{width:35px}.desktop-wrap{margin-top:23px}.desktop-heading{margin-bottom:10px}.tile-label{font-size:10px}.daily-quote{left:68px;right:16px;bottom:36px;font-size:9px}.wallpaper-credit{right:13px;bottom:10px;max-width:calc(100vw - 78px);font-size:9px}.app-dialog{border-radius:19px}.tab-button{font-size:11px;padding:8px 7px}.dialog-head h2{font-size:18px}.dialog-head p{font-size:11px}.toast{bottom:56px;left:50%;font-size:11px}.context-menu{width:196px}}
@media(max-width:390px){.two-columns{grid-template-columns:1fr}.tab-bar{gap:1px}.tab-button{padding:8px 5px}.clock{font-size:52px}.date{letter-spacing:0;font-size:10px}.theme-options{gap:5px}}

/* Site icons are image resources only; the text fallback remains until load. */
.site-visual{position:relative;display:grid;place-items:center;width:100%;height:100%;min-width:0;border-radius:inherit;overflow:hidden}
.site-visual.is-loaded{background:rgba(250,252,253,.96)}
.site-fallback{display:grid;place-items:center;width:100%;height:100%;color:inherit}
.site-visual.is-loaded>.site-fallback{visibility:hidden}
.site-visual>.site-favicon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;width:60%;height:60%;max-width:38px;max-height:38px;object-fit:contain;background:transparent;pointer-events:none}
.site-visual>.site-favicon[hidden]{display:none}
.site-fallback>.icon{width:30px;height:30px}
.tile-link[data-size="2x2"] .site-favicon,.tile-link[data-size="4x2"] .site-favicon{max-width:60px;max-height:60px}
.tile-link[data-size="2x2"] .site-fallback>.icon,.tile-link[data-size="4x2"] .site-fallback>.icon{width:48px;height:48px}
.mini-site .site-favicon{max-width:30px;max-height:30px}
.mini-site .site-glyph{font-size:21px}
.mini-site .site-glyph.small{font-size:15px}
.folder-site .site-visual,.folder-site .site-fallback{max-width:none;overflow:visible}
.folder-site .site-visual{overflow:hidden}
.folder-site .site-glyph{font-size:26px}
.folder-site .site-glyph.small{font-size:19px}
.suggestion-site{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--tile-color,#486c91);color:var(--tile-ink,#fff);overflow:hidden}
.suggestion-site .site-favicon{width:72%;height:72%;max-width:24px;max-height:24px}
.suggestion-site .site-glyph,.suggestion-site .site-glyph.small{font-size:13px;letter-spacing:0}
.suggestion-site .site-fallback>.icon,.suggestion-site>.icon{width:17px;height:17px;opacity:1}
.form-preview .preview-icon{overflow:hidden;color:var(--tile-ink,#fff)}
.form-preview .preview-icon .site-glyph{font-size:28px}
.favicon-controls{display:flex;gap:13px;align-items:center;margin:-3px 0 18px}
.favicon-controls .secondary-button{flex:none;min-width:95px}
.favicon-controls .help-text{margin:0;min-width:0}
.favicon-controls .secondary-button:disabled{opacity:.48;cursor:default;filter:none}
@media(max-width:390px){.favicon-controls{align-items:flex-start;gap:10px}.favicon-controls .secondary-button{min-width:85px;padding-right:12px;padding-left:12px}}

/* Independent sticky clock/search. Both are direct children of the full page,
   so either can remain visible beyond the initial header area. */
:root{--header-pin-top:16px;--pinned-clock-height:0px;--search-surface:rgba(23,33,43,.92);--search-focus:rgba(30,44,57,.98);--header-surface:rgba(23,33,43,.92)}
html[data-theme=light]{color-scheme:light;--search-surface:rgba(246,249,247,.9);--search-focus:rgba(252,254,253,.98);--header-surface:rgba(245,248,248,.92)}
html[data-theme=dark]{color-scheme:dark}
main{padding-top:clamp(54px,7vh,90px)}
.clock-block{position:relative;z-index:20;width:fit-content;max-width:100%;margin:0 auto;padding:8px 20px 12px;text-align:center;border:1px solid transparent;border-radius:24px;transition:background .18s,box-shadow .18s,border-color .18s}
.clock{white-space:nowrap}
#clock-seconds{font-size:1em;font-weight:200;letter-spacing:inherit;opacity:.6;padding-left:.14em}
#clock-seconds:empty{display:none}
.search-wrapper{z-index:21;margin-top:22px}
.pin-clock .clock-block{position:sticky;top:var(--header-pin-top)}
.pin-search .search-wrapper{position:sticky;top:var(--header-pin-top)}
.pin-clock.pin-search .search-wrapper{top:calc(var(--header-pin-top) + var(--pinned-clock-height) + 12px)}
.clock-block.is-stuck{background:var(--header-surface);border-color:var(--panel-border);backdrop-filter:blur(28px);box-shadow:0 8px 30px #07132126}
.clock-block.is-stuck .clock{color:var(--fg);text-shadow:none}
.clock-block.is-stuck .date{color:var(--muted)}
.search-form{background:var(--search-surface);border-color:var(--panel-border);color:var(--fg)}
.search-form:focus-within{background:var(--search-focus)}
.search-form input,.search-submit{color:var(--fg)}
.search-form input::placeholder{color:var(--muted);opacity:.9}
.search-shortcut{color:var(--muted);border-color:var(--panel-border);opacity:1}
.engine-button:after{background:var(--panel-border)}
.desktop{grid-auto-flow:row}
.desktop-heading{justify-content:space-between;height:auto;min-height:27px;gap:12px}
.desktop-heading #edit-hint{line-height:1.6}
.desktop-wrap{margin-top:34px}
.daily-quote{position:static;margin:clamp(30px,5vh,64px) 0 0;display:block;padding-bottom:8px}
.minimal main{padding-top:24vh}
.minimal .desktop-wrap{display:none}

/* Provider logos use the same image/caching pipeline as site cards. */
.engine-mark{display:grid;place-items:center;width:23px;height:23px;flex:0 0 23px;color:var(--engine-color);border-radius:5px;overflow:hidden}
.engine-mark .site-visual{width:100%;height:100%}
.engine-mark .site-favicon{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
.engine-mark .site-glyph,.engine-mark .site-glyph.small{font-size:19px;line-height:1;font-weight:650;letter-spacing:0}
.engine-option .engine-mark{width:21px;height:21px;flex-basis:21px}
.engine-list-row{gap:12px}
.engine-list-row>.engine-mark{width:26px;height:26px;flex-basis:26px}
.engine-list-copy{flex:1;min-width:0}
.engine-list-row small{max-width:100%}
.engine-list-row .engine-extract-button{flex-shrink:0;margin-left:0;padding:7px 9px;border:1px solid var(--panel-border);border-radius:8px;font-size:11px;color:var(--fg);background:var(--panel-2)}
.engine-list-row .engine-extract-button:hover{border-color:var(--accent)}
.engine-list-row>[data-delete-engine]{margin-left:0;padding:6px}

/* Pointer dragging keeps widget editing and touch scrolling intact. */

.tile-link:hover>.tile-label,.tile-folder:hover>.tile-label{opacity:0}
.tile-link:focus-within>.tile-label,.tile-folder:focus-within>.tile-label{opacity:0}
.editing .group-button{touch-action:none;cursor:grab}
.editing .tile-actions{right:3px;top:3px;gap:2px}
.tile.dragging{opacity:.28}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
body.is-dragging .tile-body{transform:none!important}
.drop-before>.tile-body,.drop-after>.tile-body{box-shadow:0 0 0 2px #a9e3d333}
.drop-inside{outline:3px solid var(--accent)!important;outline-offset:3px;border-radius:var(--radius)}
.group-button.drop-inside{background:var(--accent-strong);color:#fff}
.drag-preview{position:fixed;z-index:100;pointer-events:none;display:flex;flex-direction:column;gap:3px;min-width:125px;max-width:235px;padding:12px 16px;border:1px solid var(--panel-border);border-radius:14px;background:var(--panel);color:var(--fg);box-shadow:0 12px 35px #04142240}
.drag-preview small{font-size:10px;color:var(--muted)}
.drag-preview strong{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-indicator{position:fixed;z-index:99;pointer-events:none;background:var(--accent);border-radius:8px;box-shadow:0 0 0 2px #142a2944,0 0 16px #93e2cf66}
html[data-theme=dark] .tile-folder .tile-body{background:rgba(34,49,61,.86);border-color:var(--panel-border)}
html[data-theme=dark] .tile-add .tile-body{background:rgba(26,41,52,.64);border-color:#adbfce55}
html[data-theme=light] .tile-folder .tile-body{background:rgba(239,246,244,.75);border-color:#ffffff7a}
@media(min-width:1700px){main{padding-top:8vh}}
@media(max-width:900px){main{padding-top:64px}.desktop-wrap{margin-top:28px}}
@media(max-width:560px){
 :root{--header-pin-top:54px}
 main{padding-top:72px}
 .clock-block{padding:7px 10px 10px;border-radius:20px}
 .clock{font-size:clamp(38px,10.8vw,64px);letter-spacing:-1.8px}
 #clock-period{font-size:.22em;padding-left:5px}
 .search-wrapper{margin-top:17px}
 .desktop-wrap{margin-top:25px}
 .daily-quote{margin-top:32px;font-size:10px}
 .engine-mark{width:20px;height:20px;flex-basis:20px}
 .engine-list-row{gap:8px}
 .engine-list-row .engine-extract-button{padding:6px;font-size:10px}
 .desktop-heading{align-items:flex-start}
 .desktop-heading #edit-hint{font-size:10px}
 .desktop-heading .pill-button{white-space:nowrap;flex-shrink:0}
}
@media(hover:none),(pointer:coarse){
 .tile-link>.tile-label,.tile-folder>.tile-label{max-width:calc(100% - 26px);align-self:flex-start}
 .tile-link:hover>.tile-label,.tile-folder:hover>.tile-label{opacity:1}
}

:root {
  --ui-font: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  --ui-scale: 1; --surface-rgb: 24 33 43; --surface-opacity: .72; --surface-blur: 14px;
  --material-blur: var(--surface-blur); --material-texture: linear-gradient(transparent,transparent);
  --surface-background: rgb(var(--surface-rgb) / var(--surface-opacity));
  --surface-shadow: 0 12px 40px rgb(5 15 25 / .16), inset 0 1px 0 rgb(255 255 255 / .045);
  --sidebar-width: 50px; --sidebar-opacity: .28; --search-width: 600px; --search-height: 46px;
  --search-opacity: .65; --search-radius: 23px; --clock-weight: 400; --clock-color: #fff;
  --clock-offset-y: 0px; --search-offset-y: 0px; --nav-header-space: 0px;
  --desktop-max-width: 1350px; --icon-opacity: 1; --label-size: 12px;
  --accent-soft: color-mix(in srgb,var(--accent) 14%,transparent);
  font-family: var(--ui-font); font-optical-sizing: auto;
}
html[data-theme=light] {
  --surface-rgb: 247 250 252; --panel-border: rgb(45 65 83 / .12);
  --fg: #243442; --muted: #5b6e7d;
  --surface-shadow: 0 12px 40px rgb(20 37 56 / .12), inset 0 1px 0 rgb(255 255 255 / .8);
}
html[data-theme=dark] { --panel-border: rgb(223 240 255 / .13); --muted: #b1bfcb; }
html[data-font=system] { --ui-font: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',sans-serif; }
body { font-family: var(--ui-font); font-size: calc(14px * var(--ui-scale)); }
html[data-material=solid],html[data-material=mica] { --material-blur: 0px; }
html[data-material=acrylic] {
  --material-texture: repeating-linear-gradient(0deg,rgb(255 255 255 / .025) 0 1px,transparent 1px 3px);
}
html[data-material=mica] {
  --material-texture: linear-gradient(125deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent 54%,rgb(117 133 169 / .1));
  --surface-background: rgb(var(--surface-rgb) / max(.88,var(--surface-opacity)));
}
.sidebar,.app-dialog,.engine-menu,.search-suggestions,.context-menu,.shortcuts-tooltip,.top-tools {
  background-color: var(--surface-background); background-image: var(--material-texture);
  border-color: var(--panel-border); color: var(--fg);
  -webkit-backdrop-filter: blur(var(--material-blur));
  backdrop-filter: blur(var(--material-blur));
}
.app-dialog,.engine-menu,.search-suggestions,.context-menu,.shortcuts-tooltip { box-shadow: var(--surface-shadow); }
.app-dialog::backdrop { backdrop-filter: none; background: rgb(3 10 19 / .35); }
.clock-block.is-stuck {
  background: var(--surface-background); background-image: var(--material-texture);
  -webkit-backdrop-filter: blur(var(--material-blur)); backdrop-filter: blur(var(--material-blur));
}
.search-form {
  height: var(--search-height); border-radius: var(--search-radius);
  background: rgb(var(--surface-rgb) / var(--search-opacity)); background-image: var(--material-texture);
  -webkit-backdrop-filter: blur(var(--material-blur)); backdrop-filter: blur(var(--material-blur));
  border-color: var(--panel-border); box-shadow: 0 5px 22px rgb(8 24 40 / .1), inset 0 1px 0 rgb(255 255 255 / .06);
}
.search-form:focus-within { background-color: rgb(var(--surface-rgb) / min(1,calc(var(--search-opacity) + .12))); }
.engine-button { width: 61px; padding-left: 14px; border-radius: var(--search-radius) 0 0 var(--search-radius); }
.engine-button:after { top: 30%; bottom: 30%; }
.search-submit { width: 44px; border-radius: 0 var(--search-radius) var(--search-radius) 0; }
.search-form input { font-size: calc(14px * var(--ui-scale)); padding-left: 9px; }
.engine-menu,.search-suggestions { top: calc(100% + 9px); }
.engine-mark { overflow: visible; border-radius: 0; background: transparent; }
.engine-mark .site-visual,.engine-mark .site-visual.is-loaded { background: transparent; border: none; box-shadow: none; border-radius: 0; }
.engine-mark .site-favicon { object-fit: contain; padding: 0; border: none; background: transparent; filter: none; }
.engine-mark .site-fallback { background: transparent; }
/* This removes our artificial white tile, preserving the provider's actual art. */
.tile-folder .tile-body,
html[data-theme=light] .tile-folder .tile-body,
html[data-theme=dark] .tile-folder .tile-body {
  background: var(--surface-background); background-image: var(--material-texture);
  border-color: var(--panel-border);
  -webkit-backdrop-filter: blur(min(12px,var(--material-blur)));
  backdrop-filter: blur(min(12px,var(--material-blur)));
}
.tile-link .tile-body { opacity: var(--icon-opacity); }
.tile-label { font-size: calc(var(--label-size) * var(--ui-scale)); color: var(--label-color); height: calc(14px + var(--label-size)); line-height: 1.3; }
.tile-body { height: calc(100% - 14px - var(--label-size)); }
.tile-widget .tile-body { backdrop-filter: none; -webkit-backdrop-filter: none; }
.folder-item>.folder-site { border: 1px solid var(--panel-border); box-shadow: 0 4px 16px rgb(8 25 40 / .1); }
.folder-item>span { font-size: calc(12px * var(--ui-scale)); color: var(--fg); }

/* Navigation stays recoverable even when completely collapsed. */
.sidebar {
  width: var(--sidebar-width); gap: 8px; inset: 0 auto 0 0;
  border-right: 1px solid var(--panel-border); border-left: 0;
  background-color: rgb(var(--surface-rgb) / var(--sidebar-opacity));
  z-index: 30; transition: transform .2s ease,opacity .2s ease;
}
.brand { width: 100%; margin: 38px 0 24px; padding: 0; min-height: 36px; }
.brand-mark,.brand-avatar { width: 32px; height: 32px; }
.brand-avatar { display: block; object-fit: cover; border-radius: 50%; box-shadow: 0 2px 8px rgb(8 25 30 / .12); }
.brand:focus-visible { outline-offset: -3px; border-radius: 12px; }
.groups { flex: 1 1 auto; gap: 8px; padding: 4px 0; width: 100%; overflow-y: auto; overflow-x: hidden; }
.group-button { width: calc(100% - 8px); min-height: 56px; flex-shrink: 0; border-radius: 10px; color: var(--muted); font-size: calc(12px * var(--ui-scale)); gap: 5px; }
.group-button>span { max-width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.group-button .icon { width: 19px; height: 19px; }
.group-button:hover,.side-button:hover { color: var(--fg); background: color-mix(in srgb,var(--fg) 8%,transparent); }
.group-button.active { color: var(--fg); background: var(--accent-soft); box-shadow: inset 0 1px 0 rgb(255 255 255 / .08); }
.group-button.active:before { left: -4px; width: 2px; height: 19px; background: var(--accent); }
.side-button { width: min(36px,calc(var(--sidebar-width) - 8px)); height: 36px; border-radius: 10px; color: var(--muted); }
.sidebar-bottom { padding-bottom: 18px; margin-top: 6px; gap: 5px; }
.no-sidebar-labels .group-button>span { display: none; }
.no-sidebar-labels .group-button { min-height: 42px; }
html[data-sidebar-position=right] .sidebar { left: auto; right: 0; border-right: 0; border-left: 1px solid var(--panel-border); }
html[data-sidebar-position=right] .group-button.active:before { left: auto; right: -4px; border-radius: 3px 0 0 3px; }
main { margin-left: var(--sidebar-width); margin-right: 0; padding: max(12px,calc(6vh + var(--clock-offset-y) + var(--nav-header-space))) 38px 72px; }
html[data-sidebar-position=right] main { margin-left: 0; margin-right: var(--sidebar-width); }
html[data-sidebar-visibility=auto] main,html[data-sidebar-visibility=hidden] main { margin-left: 0; margin-right: 0; }
html[data-sidebar-visibility=auto] .sidebar,html[data-sidebar-visibility=hidden] .sidebar { transform: translateX(-100%); }
html[data-sidebar-position=right][data-sidebar-visibility=auto] .sidebar,html[data-sidebar-position=right][data-sidebar-visibility=hidden] .sidebar { transform: translateX(100%); }

function uid() {
  if (globalThis.crypto?.randomUUID) return `qy_${globalThis.crypto.randomUUID().replaceAll('-', '')}`;
  return `qy_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 12)}`;

/** Accept complete HTTP(S) URLs or a bare domain. Credentials and controls are never allowed. */
function safeUrl(input) {
  if (typeof input !== 'string') return null;
  let value = input.trim();
  if (!value || value.length > 4096 || /[\s\u0000-\u001f\u007f\\]/u.test(value)) return null;
  if (!/^https?:\/\//i.test(value)) {
    if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return null;
    if (value.startsWith('//')) value = `https:${value}`;
    else if (/^[^/?#]+\.[^/?#]+/.test(value)) value = `https://${value}`;
    else return null;
  }
  try {
    const parsed = new URL(value);
    if (!['http:', 'https:'].includes(parsed.protocol) || !parsed.hostname || parsed.username || parsed.password) return null;
    return parsed.href;
  } catch { return null; }
}

function url(value, path) { const result = safeUrl(value); if (!result) invalid(path, t("只支持安全的 http / https 地址")); return result; }

function validateMedia(value, type) {
  if (value === null) return null;
  if (typeof value !== 'string' || !value.startsWith('data:')) invalid('settings.customWallpaper', t("本地媒体仅支持 data URL；在线壁纸请使用壁纸小组件"));
  const match = /^data:(image\/(?:png|jpeg|webp|gif|avif)|video\/(?:mp4|webm));base64,([A-Za-z0-9+/]*={0,2})$/.exec(value);
  if (!match || match[2].length % 4 !== 0 || match[2].length === 0) invalid('settings.customWallpaper', t("仅支持 PNG、JPEG、WebP、GIF、AVIF、MP4 或 WebM 的 base64 数据"));
  if ((type === 'video') !== match[1].startsWith('video/')) invalid('settings.customWallpaperType', t("与媒体数据类型不一致"));
  const decodedSize = (match[2].length / 4) * 3 - (match[2].endsWith('==') ? 2 : match[2].endsWith('=') ? 1 : 0);
  if (decodedSize > MAX_MEDIA_BYTES) invalid('settings.customWallpaper', t("媒体文件不能超过 4 MiB"));
  return value;
}

const { widgetContentSummary } = __widget_data;
const { validateImport, exportState, MAX_BACKUP_BYTES, loadState } = __core;

/**
 * WebDAV stores one validated Qiye JSON file. Credentials and the synchronization
 * baseline live in a separate LOCAL record; neither enters a backup or PUT body.
 * Protocol: RFC 4918 section 8.6; RFC 9110 sections 13.1.1 / 13.1.2.
 * This module never replaces local state. Callers explicitly review and apply a
 * download using core.saveState's revision guard, then acknowledge it below.
 */
const WEBDAV_LOCAL_KEY = 'qiye.webdav.local.v1';
const DEFAULT_WEBDAV_CONFIG = Object.freeze({
  enabled: false, endpoint: '', path: 'qiye.json', username: '', password: '', autoSync: false
});

const REQUEST_TIMEOUT_MS = 15000;
const REVIEW_LIFETIME_MS = 10 * 60 * 1000;
const copy = value => JSON.parse(JSON.stringify(value));

class WebDAVError extends Error {
  constructor(code, message) { super(message); this.name = 'WebDAVError'; this.code = code; }
}

function fail(code, message) { throw new WebDAVError(code, message); }

function validateWebDAVConfig(input, { requireEndpoint = false } = {}) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) fail('INVALID_CONFIG', t("WebDAV 配置格式不正确。"));
  const fields = Object.keys(DEFAULT_WEBDAV_CONFIG);
  if (fields.some(key => !Object.hasOwn(input, key)) || Object.keys(input).some(key => !fields.includes(key))) {
    fail('INVALID_CONFIG', t("WebDAV 配置字段不完整或不受支持。"));
  }
  const config = { ...input };
  if (typeof config.enabled !== 'boolean' || typeof config.autoSync !== 'boolean') fail('INVALID_CONFIG', t("同步开关格式不正确。"));
  for (const key of ['endpoint', 'path', 'username', 'password']) {
    if (typeof config[key] !== 'string' || config[key].length > (key === 'endpoint' ? 4096 : 1024) || /[\u0000-\u001f\u007f]/.test(config[key])) {
      fail('INVALID_CONFIG', t("WebDAV 配置包含无效字符或过长的内容。"));
    }
  }
  config.endpoint = config.endpoint.trim();
  config.path = config.path.trim() || 'qiye.json';
  if (config.username.includes(':')) fail('INVALID_CONFIG', t("WebDAV 用户名不能包含冒号。"));
  if (!config.username && config.password) fail('INVALID_CONFIG', t("填写密码时也需要填写 WebDAV 用户名。"));
  if (!config.endpoint) {
    if (requireEndpoint || config.enabled) fail('NOT_CONFIGURED', t("请先填写 WebDAV 目录地址。"));
  } else {
    if (!/^https?:\/\//i.test(config.endpoint) || /[\s\\]/u.test(config.endpoint)) fail('UNSAFE_URL', t("目录地址须为完整的 HTTPS 地址。"));
    let endpoint;
    try { endpoint = new URL(config.endpoint); } catch { fail('UNSAFE_URL', t("WebDAV 目录地址无效。")); }
    if (endpoint.username || endpoint.password || endpoint.search || endpoint.hash) fail('UNSAFE_URL', t("目录地址不能包含账号、密码、查询参数或片段；请将凭据填入独立字段。"));
    if (endpoint.protocol !== 'https:' && !(endpoint.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(endpoint.hostname))) {
      fail('UNSAFE_URL', t("WebDAV 使用 HTTPS；只有本机 localhost 或 127.0.0.1 的服务可使用 HTTP。"));
    }
    // Reject traversal before URL normalization can silently remove dot segments.
    const rawPath = config.endpoint.replace(/^https?:\/\/[^/]+/i, '');
    checkPathSegments(rawPath, true);
    endpoint.pathname = endpoint.pathname.endsWith('/') ? endpoint.pathname : `${endpoint.pathname}/`;
    config.endpoint = endpoint.href;
  }
  if (config.path.startsWith('/') || config.path.endsWith('/') || /[?#\\]/.test(config.path)) fail('UNSAFE_PATH', t("同步文件请填写相对于目录的文件名，例如 qiye.json。"));
  const segments = checkPathSegments(config.path, false);
  if (!segments.length || !segments.at(-1).toLowerCase().endsWith('.json')) fail('UNSAFE_PATH', t("同步文件名须以 .json 结尾。"));
  config.path = segments.map(segment => encodeURIComponent(segment)).join('/');
  return config;
}

function checkPathSegments(value, allowOuterSlashes) {
  let pieces = value.split('/');
  if (allowOuterSlashes) {
    if (pieces[0] === '') pieces.shift();
    if (pieces.at(-1) === '') pieces.pop();
  }
  return pieces.map(piece => {
    let decoded;
    try { decoded = decodeURIComponent(piece); } catch { fail('UNSAFE_PATH', t("WebDAV 路径包含无效的 URL 编码。")); }
    if (!decoded || decoded === '.' || decoded === '..' || /[\u0000-\u001f\u007f/\\?#]/.test(decoded) || /%[0-9a-f]{2}/i.test(decoded)) {
      fail('UNSAFE_PATH', t("WebDAV 路径不能包含空目录、跳转目录或编码后的路径分隔符。"));
    }
    return decoded;
  });
}

function webDAVTargetURL(config) {
  const checked = validateWebDAVConfig(config, { requireEndpoint: true });
  return new URL(checked.path, checked.endpoint).href;
}

function webDAVOriginPattern(config) {
  return `${new URL(webDAVTargetURL(config)).origin}/*`;
}

function chromeAPI(owner, method, ...args) {
  return new Promise((resolve, reject) => {
    try {
      const result = owner[method](...args, value => {
        if (globalThis.chrome?.runtime?.lastError) reject(new WebDAVError('BROWSER_API', t("浏览器未能完成 WebDAV 权限或存储操作。")));
        else resolve(value);
      });
      if (result && typeof result.then === 'function') result.then(resolve, reject);
    } catch { reject(new WebDAVError('BROWSER_API', t("浏览器未能完成 WebDAV 权限或存储操作。"))); }
  });
}

/** Call directly inside a click/submit handler, before awaiting storage/network. */
function requestWebDAVPermission(config) {
  const origin = webDAVOriginPattern(config);
  if (!globalThis.chrome?.permissions?.request) return Promise.resolve(true); // Browser preview uses the server's own CORS policy.
  return chromeAPI(globalThis.chrome.permissions, 'request', { origins: [origin] }).then(granted => {
    if (!granted) fail('PERMISSION_DENIED', t("未获得该 WebDAV 网站的访问权限，现有数据没有改变。"));
    return true;
  });
}

async function checkPermission(config) {
  if (!globalThis.chrome?.permissions?.contains) return;
  const granted = await chromeAPI(globalThis.chrome.permissions, 'contains', { origins: [webDAVOriginPattern(config)] });
  if (!granted) fail('PERMISSION_REQUIRED', t("请在 WebDAV 设置中点击连接或同步，授予所填网站的访问权限。"));
}

const browserStore = {
  async get() {
    if (globalThis.chrome?.storage?.local) {
      const values = await chromeAPI(globalThis.chrome.storage.local, 'get', WEBDAV_LOCAL_KEY);
      return values?.[WEBDAV_LOCAL_KEY] ?? null;
    }
    if (!globalThis.localStorage) fail('STORAGE_UNAVAILABLE', t("此环境无法保存 WebDAV 本机配置。"));
    const raw = globalThis.localStorage.getItem(WEBDAV_LOCAL_KEY);
    try { return raw === null ? null : JSON.parse(raw); } catch { fail('INVALID_LOCAL_CONFIG', t("WebDAV 本机配置损坏；请清除同步配置后重新填写。")); }
  },
  async set(value) {
    if (globalThis.chrome?.storage?.local) return chromeAPI(globalThis.chrome.storage.local, 'set', { [WEBDAV_LOCAL_KEY]: value });
    if (!globalThis.localStorage) fail('STORAGE_UNAVAILABLE', t("此环境无法保存 WebDAV 本机配置。"));
    globalThis.localStorage.setItem(WEBDAV_LOCAL_KEY, JSON.stringify(value));
  },
  async remove() {
    if (globalThis.chrome?.storage?.local) return chromeAPI(globalThis.chrome.storage.local, 'remove', WEBDAV_LOCAL_KEY);
    if (globalThis.localStorage) globalThis.localStorage.removeItem(WEBDAV_LOCAL_KEY);
  }
};

function randomID() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  fail('CRYPTO_UNAVAILABLE', t("此环境不支持安全同步标识；请在 HTTPS 页面或扩展中打开栖页。"));
}

/** Ignore the local storage revision, which legitimately differs on each device. */
async function webDAVStateFingerprint(state) {
  const checked = validateImport(state);
  checked.updatedAt = 0;
  if (!globalThis.crypto?.subtle) fail('CRYPTO_UNAVAILABLE', t("此环境不支持安全同步校验；请在 HTTPS 页面或扩展中打开栖页。"));
  const digest = await globalThis.crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(checked)));
  return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
}

function summary(state) {
  return state ? {
    updatedAt: state.updatedAt, groups: state.groups.length,
    sites: state.items.filter(item => item.type === 'link').length,
    widgets: state.items.filter(item => item.type === 'widget').length,
    ...widgetContentSummary(state.items)
  } : null;
}

function strongETag(value) {
  return typeof value === 'string' && value.length <= 1024 && /^"[\x21\x23-\x7e\x80-\xff]*"$/.test(value) ? value : null;
}

function authHeader(config) {
  if (!config.username) return null;
  // RFC 7617: UTF-8 Basic credentials, sent only to the exact configured endpoint.
  const bytes = new TextEncoder().encode(`${config.username}:${config.password}`);
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return `Basic ${btoa(binary)}`;
}

function httpError(status) {
  const messages = {
    401: t("WebDAV 验证失败，请检查用户名和密码或应用专用密码。"),
    403: t("WebDAV 拒绝访问，请检查目录与读写权限。"),
    405: t("该地址不支持所需的 WebDAV 读写方法，请填写实际的 WebDAV 目录。"),
    409: t("同步文件的父目录不存在或不接受此文件；请先在 WebDAV 服务中创建目录。"),
    413: t("WebDAV 服务拒绝了过大的备份文件。"),
    423: t("WebDAV 文件被锁定，请稍后重试。"),
    507: t("WebDAV 存储空间不足。")
  };
  return new WebDAVError(`HTTP_${status}`, messages[status] || `${t("WebDAV 返回 HTTP {v0}，本次操作尚未完成。", {v0: status})}`);
}

async function limitedText(response) {
  const length = Number(response.headers.get('Content-Length'));
  if (Number.isFinite(length) && length > MAX_BACKUP_BYTES) {
    try { await response.body?.cancel(); } catch { /* Already closed. */ }
    fail('REMOTE_TOO_LARGE', t("远程备份超过 6 MiB，已停止读取。"));
  }
  if (!response.body?.getReader) {
    const text = await response.text();
    if (new TextEncoder().encode(text).byteLength > MAX_BACKUP_BYTES) fail('REMOTE_TOO_LARGE', t("远程备份超过 6 MiB，已停止读取。"));
    return text;
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8', { fatal: true });
  let size = 0, text = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      size += value.byteLength;
      if (size > MAX_BACKUP_BYTES) { await reader.cancel(); fail('REMOTE_TOO_LARGE', t("远程备份超过 6 MiB，已停止读取。")); }
      text += decoder.decode(value, { stream: true });
    }
    return text + decoder.decode();
  } finally { reader.releaseLock(); }
}

/** Injectable adapters make protocol tests exercise the production algorithm. */
function createWebDAVSync({ fetchImpl = (...args) => fetch(...args), store = browserStore,
  currentState = loadState, permissionCheck = checkPermission, now = () => Date.now(), timeoutMs = REQUEST_TIMEOUT_MS,
  lock = operation => globalThis.navigator?.locks?.request
    ? globalThis.navigator.locks.request(WEBDAV_LOCAL_KEY, operation) : operation()
} = {}) {
  let queue = Promise.resolve();
  const reviews = new Map();
  const downloads = new Map();

  function serial(operation) {
    const task = () => lock(operation);
    const result = queue.then(task, task);
    queue = result.catch(() => {});
    return result;
  }

  async function readRecord() {
    const raw = await store.get();
    if (!raw) return null;
    if (raw.version !== 1 || typeof raw.revision !== 'string') fail('INVALID_LOCAL_CONFIG', t("WebDAV 本机配置格式不正确；请清除同步配置后重新填写。"));
    return { ...raw, config: validateWebDAVConfig(raw.config) };
  }

  async function loadConfig() { return copy((await readRecord())?.config || DEFAULT_WEBDAV_CONFIG); }

  async function saveConfig(input) {
    const config = validateWebDAVConfig(input);
    return serial(async () => {
      const record = await readRecord();
      const identityChanged = !record || ['endpoint', 'path', 'username', 'password'].some(key => record.config[key] !== config[key]);
      await store.set({
        version: 1, revision: identityChanged ? randomID() : record.revision, config,
        baseline: identityChanged ? null : record.baseline,
        lastError: null, lastErrorAt: null, lastAction: identityChanged ? null : record.lastAction
      });
      if (identityChanged) { reviews.clear(); downloads.clear(); }
      return copy(config);
    });
  }

  async function clearConfig() {
    return serial(async () => { await store.remove(); reviews.clear(); downloads.clear(); });
  }

  async function status() {
    const record = await readRecord();
    const config = record?.config || DEFAULT_WEBDAV_CONFIG;
    return {
      configured: Boolean(config.endpoint), enabled: config.enabled, autoSync: config.autoSync,
      hasBaseline: Boolean(record?.baseline), lastSyncedAt: record?.baseline?.at || null,
      lastAction: record?.lastAction || null, lastError: record?.lastError || null,
      lastErrorAt: record?.lastErrorAt || null,
      target: config.endpoint ? webDAVTargetURL(config) : null
    };
  }

  async function request(config, method, { body, etag, create = false } = {}) {
    const target = webDAVTargetURL(config);
    await permissionCheck(config);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const headers = { Accept: 'application/json' };
    const authorization = authHeader(config);
    if (authorization) headers.Authorization = authorization;
    if (body !== undefined) headers['Content-Type'] = 'application/json; charset=utf-8';
    if (etag) headers['If-Match'] = etag;
    if (create) headers['If-None-Match'] = '*';
    try {
      const response = await fetchImpl(target, {
        method, headers, ...(body !== undefined ? { body } : {}),
        credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer', cache: 'no-store', signal: controller.signal
      });
      // redirect:error prevents sending credentials to a redirect target. Also
      // reject redirected/mismatched responses from adapters or browser anomalies.
      if (response.redirected || response.type === 'opaqueredirect' || (response.url && response.url !== target) || (response.status >= 300 && response.status < 400)) {
        try { await response.body?.cancel(); } catch { /* Nothing to consume. */ }
        fail('REDIRECT_REJECTED', t("WebDAV 地址发生了重定向。请直接填写最终目录地址；凭据不会转发到新地址。"));
      }
      const result = { status: response.status, etag: strongETag(response.headers.get('ETag')), text: null };
      if (method === 'GET' && response.status === 200) result.text = await limitedText(response);
      else { try { await response.body?.cancel(); } catch { /* No response body needed. */ } }
      return result;
    } catch (error) {
      if (error instanceof WebDAVError) throw error;
      if (controller.signal.aborted) fail('TIMEOUT', method === 'PUT'
        ? t("WebDAV 上传超时，远程写入结果尚未确认；请重新同步以核对，本机数据已保留。")
        : t("WebDAV 请求超时，请检查服务地址和网络连接。"));
      if (error instanceof TypeError && /encoded data/i.test(error.message)) fail('INVALID_REMOTE', t("远程文件不是有效的 UTF-8 JSON 备份。"));
      fail('NETWORK_ERROR', method === 'PUT'
        ? t("WebDAV 上传未能完成确认。请检查网络、证书、重定向和 CORS；网页预览还需服务端允许跨域。远程写入结果未知，请重新同步核对。")
        : t("无法连接 WebDAV。请检查网络、证书和最终目录地址；网页预览还需要服务端允许 CORS，并暴露 ETag 响应头。"));
    } finally { clearTimeout(timer); }
  }

  async function readRemote(config) {
    const response = await request(config, 'GET');
    if (response.status === 404) return { exists: false, state: null, fingerprint: null, etag: null };
    if (response.status !== 200) throw httpError(response.status);
    let state;
    try { state = validateImport(response.text); } catch { fail('INVALID_REMOTE', t("远程文件不是当前格式的栖页备份，或内容未通过校验；两端数据均未替换。")); }
    return { exists: true, state, fingerprint: await webDAVStateFingerprint(state), etag: response.etag };
  }

  async function testConnection(input) {
    const config = validateWebDAVConfig(input || await loadConfig(), { requireEndpoint: true });
    const remote = await readRemote(config);
    return {
      status: remote.exists ? 'readable' : 'empty', exists: remote.exists,
      hasStrongETag: Boolean(remote.etag), remote: summary(remote.state),
      message: remote.exists
        ? (remote.etag ? t("远程备份可读取，并提供强 ETag。写入权限将在实际同步时验证。") : t("远程备份可读取，但缺少可用的强 ETag；可以下载，暂不能安全覆盖上传。网页预览需暴露 ETag 响应头。"))
        : t("服务器返回 404，尚未找到同步文件。请确认目录已存在；首次手动同步会尝试创建文件。此测试未验证写入权限，也未创建文件。")
    };
  }

  async function matchesLocal(fingerprint) {
    return await webDAVStateFingerprint(await currentState()) === fingerprint;
  }

  function localChanged(localFingerprint) {
    return { status: 'local-changed', localFingerprint, message: t("同步期间本机内容发生了变化，已停止应用过期快照。请保存后重新同步。") };
  }

  function rememberReview(record, local, localFingerprint, remote, reason) {
    const token = randomID();
    for (const [key, review] of reviews) if (now() - review.at > REVIEW_LIFETIME_MS) reviews.delete(key);
    if (reviews.size >= 20) reviews.delete(reviews.keys().next().value);
    reviews.set(token, { at: now(), revision: record.revision, localFingerprint,
      remoteFingerprint: remote.fingerprint, etag: remote.etag, exists: remote.exists });
    const messages = {
      'first-sync': t("这是本机首次连接该备份，两端内容不同。请先比较并选择保留哪一端。"),
      'both-changed': t("本机和远程都在上次同步后发生了变化，请比较后选择，当前没有覆盖任何一端。"),
      'remote-changed': t("远程内容与本机不同，请确认要上传本机版本还是下载远程版本。"),
      'remote-deleted': t("上次同步的远程文件已不存在。请确认后再用本机内容重新创建。"),
      'review-stale': t("刚才比较的版本已经变化，请重新比较后选择。"),
      'write-conflict': t("上传前远程版本已被其他设备更新，条件写入已停止，请重新比较。"),
      'after-write-changed': t("上传后读回的远程版本与提交内容不同，可能已被其他设备更新。同步结果尚未确认，请比较。")
    };
    return { status: 'conflict', reason, message: messages[reason] || messages['both-changed'], review: token,
      local: summary(local), remote: summary(remote.state), remoteState: remote.state ? copy(remote.state) : null, localFingerprint };
  }

  async function recordResult(record, result) {
    await store.set({ ...record, lastAction: result.status, lastError: result.status === 'conflict' ? result.message : null,
      lastErrorAt: result.status === 'conflict' ? now() : null });
    return result;
  }

  async function baseline(record, localFingerprint, remote, action) {
    await store.set({ ...record, baseline: { localFingerprint, remoteFingerprint: remote.fingerprint,
      etag: remote.etag, at: now() }, lastAction: action, lastError: null, lastErrorAt: null });
  }

  function downloadReady(record, localFingerprint, remote) {
    const token = randomID();
    downloads.set(token, { revision: record.revision, localFingerprint, remote: copy(remote), at: now() });
    // The UI may recheck a review immediately before applying it. Bind download
    // reviews to both versions just like a conflict decision, so that recheck
    // returns a fresh download instead of spuriously reporting a stale review.
    reviews.set(token, { at: now(), revision: record.revision, localFingerprint,
      remoteFingerprint: remote.fingerprint, etag: remote.etag, exists: remote.exists });
    if (downloads.size > 20) downloads.delete(downloads.keys().next().value);
    if (reviews.size > 20) reviews.delete(reviews.keys().next().value);
    return { status: 'download-ready', message: t("远程备份已读取并校验，请确认后应用到本机。"),
      state: copy(remote.state), review: token, localFingerprint, remoteFingerprint: remote.fingerprint, remote: summary(remote.state) };
  }

  async function writeRemote(record, local, localFingerprint, remote) {
    if (remote.exists && !remote.etag) fail('NO_STRONG_ETAG', t("服务端没有提供可用的强 ETag，无法安全覆盖远程文件。请启用 ETag；网页预览需通过 CORS 暴露 ETag 响应头。你仍可下载远程备份。"));
    if (!await matchesLocal(localFingerprint)) return localChanged(localFingerprint);
    const body = exportState(local);
    const response = await request(record.config, 'PUT', { body, etag: remote.etag, create: !remote.exists });
    if (response.status === 412) {
      const latest = await readRemote(record.config);
      return recordResult(record, rememberReview(record, local, localFingerprint, latest, 'write-conflict'));
    }
    if (![200, 201, 204].includes(response.status)) throw httpError(response.status);
    let verified;
    try { verified = await readRemote(record.config); } catch {
      fail('WRITE_UNVERIFIED', t("服务器已接受上传，但读回验证未完成。远程写入可能已成功；本机数据已保留，请重新同步核对。"));
    }
    if (!verified.exists || verified.fingerprint !== localFingerprint) {
      return recordResult(record, rememberReview(record, local, localFingerprint, verified, 'after-write-changed'));
    }
    await baseline(record, localFingerprint, verified, 'uploaded');
    return { status: 'uploaded', localFingerprint, message: t("本机版本已上传，并已读回验证。"), hasStrongETag: Boolean(verified.etag) };
  }

  async function synchronize(input, { mode = 'sync', manual = false, review = null, expectedConfig = undefined } = {}) {
    const local = validateImport(input);
    const localFingerprint = await webDAVStateFingerprint(local);
    const expected = expectedConfig === undefined ? null : validateWebDAVConfig(expectedConfig);
    if (!['sync', 'upload', 'download'].includes(mode)) fail('INVALID_MODE', t("不支持的同步操作。"));
    return serial(async () => {
      const record = await readRecord();
      // Compare inside the same lock as network synchronization. A different tab
      // may replace the endpoint after the UI checks it but before this lock.
      // The old UI's permission prompt must never authorize a different target.
      if (expected && (!record || Object.keys(DEFAULT_WEBDAV_CONFIG).some(key => record.config[key] !== expected[key]))) {

async function uploadAvatar(file,panel) {
 const request = ++avatarRequestSequence, previous = state.settings.avatar, originalState = state;
 const status = $('#avatar-status',panel);
 status.textContent = t("正在裁切头像…");
 try {
  if (blockedStorage) throw new Error(t("请先恢复本机桌面数据，再修改头像。"));
  const avatar = await normalizeAvatarFile(file);
  if (request !== avatarRequestSequence || !panel.isConnected || !dialog.open) return;
  if (state !== originalState || state.settings.avatar !== previous) { status.textContent = t("桌面已更新，请重新选择头像。"); return; }
  state.settings.avatar = avatar;
  await persist();
  renderAvatar();
  if (request === avatarRequestSequence && panel.isConnected) status.textContent = t("已保存头像。点击侧栏头像即可打开设置。");
 } catch (error) {
  if (request !== avatarRequestSequence || !panel.isConnected) return;
  renderAvatar();
  status.textContent = error.message || t("头像未能保存，请重试。");
 }
}
async function resetAvatar() {
 if (blockedStorage) throw new Error(t("请先恢复本机桌面数据，再修改头像。"));
 const request = ++avatarRequestSequence, panel = $('#avatar-panel',dialog);

 state.settings.avatar = null;
 try {
  await persist();
  if (current()) $('#avatar-status',panel).textContent = t("已恢复栖页默认图标。");
 } catch (error) {
  if (current()) $('#avatar-status',panel).textContent = error.message || t("重置头像未能保存，请重试。");
  throw error;
 } finally { renderAvatar(); }
}

async function storeLocalWallpaper(blob,type='image',isCurrent=wallpaperRequest(),name) {
  if(!(blob instanceof Blob) || !blob.size || blob.size>4*1024*1024)
    throw new Error(t('壁纸不能超过 4 MiB'));
  const url=await blobToDataUrl(blob);
  if(!isCurrent())return false;
  await localWallpapers.remember(state.settings.customWallpaper,state.settings.customWallpaperType);
  await localWallpapers.put(blob,name);
  if(!isCurrent())return false;
  state.settings.customWallpaper=url;
  state.settings.customWallpaperType=type;
  state.settings.remoteWallpaper=null;
  state.settings.dailyWallpaper=false;
  await persist();
  applySettings();
  return true;
}
async function removeLocalWallpaper(row) {
 const previous=state.settings.customWallpaper;
 const active=previous&&await localWallpaperId(localWallpaperBlob(previous))===row.id;
 await localWallpapers.remove(row.id);
 if(active&&state.settings.customWallpaper===previous){
  state.settings.customWallpaper=null;state.settings.customWallpaperType='image';state.settings.remoteWallpaper=null;state.settings.dailyWallpaper=false;
  try{await persist();}catch(error){await localWallpapers.put(row.blob,row.name);applySettings();throw error;}
  applySettings();
 }
}

async function removeItem(id) {

 item.groupId=targetGroup;if(item.type==='link')item.folderId=folderId;
 if(item.type==='folder')state.items.forEach(i=>{if(i.folderId===id)i.groupId=targetGroup;});
 await commit(true,renderOptions);
}
function exportBackup(source=state) {

}

function confirmDeleteGroup(id) {
 const group=state.groups.find(g=>g.id===id);if(!group || state.groups.length<2)return;
 const target=state.groups.find(g=>g.id!==id);
 openDialog('confirm',{title:`${t("删除「{v0}」分组？", {v0: group.name})}`,message:`${t("其中的网站和组件会移到「{v0}」，内容会保留。", {v0: target.name})}`,label:t("删除分组"),callback:async()=>{
  const oldGroup=clone(group),oldIndex=state.groups.indexOf(group),movedIds=state.items.filter(i=>i.groupId===id).map(i=>i.id);
  state.groups=state.groups.filter(g=>g.id!==id);state.items.forEach(i=>{if(i.groupId===id)i.groupId=target.id;});state.activeGroupId=target.id;await commit();closeDialog();
  toast(t("分组已删除，内容已保留。"),async()=>{
   if(!state.groups.some(g=>g.id===id))state.groups.splice(Math.min(oldIndex,state.groups.length),0,oldGroup);
   const eligible=new Set(state.items.filter(i=>movedIds.includes(i.id)&&i.groupId===target.id).map(i=>i.id));
   state.items.forEach(i=>{if(eligible.has(i.id)&&(!i.folderId||eligible.has(i.folderId)))i.groupId=id;});
   state.activeGroupId=id;await commit();toast(t("已恢复分组。"));
  });
 }});
}

dialog.addEventListener('submit',async event=>{
 event.preventDefault();const form=event.target;const data=new FormData(form);const value=name=>String(data.get(name) || '').trim();
 const submit=$('button[type=submit]',form);if(submit)submit.disabled=true;
 try {
  if(form.id==='webdav-form'){await syncController.saveFromForm(form);return;}
  if(form.id==='link-form'){
   const url=safeUrl(value('url'));if(!url)throw new Error(t("请输入有效的 http 或 https 网站地址。"));
   if(!value('title'))throw new Error(t("请填写网站名称。"));
   const old=state.items.find(i=>i.id===form.dataset.id),groupId=value('groupId');
   const item={...(old || {}),id:old?.id || uid(),type:'link',title:value('title'),url,icon:value('icon') || value('title').slice(0,2),iconMode:value('iconMode')==='text'?'text':'auto',iconUrl:normalizeIconSelection(value('iconUrl')),color:value('color') || COLORS[0],groupId,size:old?.size || '1x1',folderId:old?.groupId===groupId?old.folderId:null};
   if(old)state.items[state.items.indexOf(old)]=item;else state.items.push(item);
   await commit();closeDialog();toast(old?t("网站已更新。"):t("已添加到桌面。"));
  }else if(form.id==='folder-form'){
   const old=state.items.find(i=>i.id===form.dataset.id),groupId=value('groupId');
   if(old){old.title=value('title');old.groupId=groupId;state.items.forEach(i=>{if(i.folderId===old.id)i.groupId=groupId;});}
   else state.items.push({id:uid(),groupId,type:'folder',title:value('title'),icon:'folder',color:'#719295',size:'2x2'});
   await commit();closeDialog();toast(t("文件夹已保存。"));
  }else if(form.id==='group-form'){
   const old=state.groups.find(g=>g.id===form.dataset.id);
   if(old){old.name=value('name');old.icon=value('icon');}else{const g={id:uid(),name:value('name'),icon:value('icon')};state.groups.push(g);state.activeGroupId=g.id;}
   await commit();closeDialog();toast(t("分组已保存。"));
  }else if(form.id==='engine-form'){
   if(state.settings.customEngines.length>=12)throw new Error(t("最多支持 12 个自定义引擎，请先删除不再使用的引擎。"));
   const template=value('url');if(!template.includes('{q}'))throw new Error(t("搜索地址需要包含 {q} 占位符。"));if(!safeUrl(template.replace(/\{q\}/g,'test')))throw new Error(t("搜索地址必须使用 http 或 https。"));
   state.settings.customEngines.push({id:uid(),name:value('name'),letter:value('name').slice(0,1),color:'#83cbb2',url:template});await persist();renderEngine();openDialog('settings',{tab:'search'});toast(t("搜索引擎已添加。"));
  }else if(form.id==='widget-form'){
   const item=state.items.find(i=>i.id===form.dataset.id);if(!item)throw new Error(t('组件已移除'));
   item.title=value('title');item.size=value('size');
   await commit();closeDialog();toast(t('组件设置已保存。'));
  }else if(form.id==='move-form'){
   const folder=state.items.find(i=>i.id===value('folderId')&&i.type==='folder');await moveItem(form.dataset.id,folder?.groupId || value('groupId'),folder?.id || null);closeDialog();toast(t("已移动。"));
  }else if(form.id==='bookmarks-form'){
   const selected=data.getAll('bookmark').map(Number);if(!selected.length)throw new Error(t("请至少选择一个网站。"));
   const groupId=value('groupId');let count=0;
   for(const index of selected){const b=dialogData.bookmarks[index];if(!b || state.items.some(i=>i.groupId===groupId&&i.url===b.url))continue;state.items.push({id:uid(),groupId,type:'link',title:b.title || new URL(b.url).hostname,url:b.url,icon:(b.title || new URL(b.url).hostname).slice(0,2),iconMode:'auto',color:COLORS[count%COLORS.length],size:'1x1',folderId:null});count++;}
   await commit();closeDialog();toast(`${t("已导入 {v0} 个网站，相同分组内的重复网址已跳过。", {v0: count})}`);
  }
 }catch(err){const area=$('#form-error',form);if(area){area.textContent=err.message || t("保存失败，请检查填写内容。");area.hidden=false;}else toast(err.message);}
 finally{if(submit?.isConnected)submit.disabled=false;}
});

   if(!/^(image\/(png|jpeg|webp|gif|avif)|video\/(mp4|webm))$/.test(file.type))throw new Error(t("请使用 PNG、JPEG、WebP、GIF、AVIF 图片或 MP4、WebM 视频。"));
   let blob=file, compressed=false;
   if(['image/png','image/jpeg','image/webp'].includes(file.type)){
     if(file.size>MAX_IMAGE_INPUT_BYTES)throw new Error(t("图片上传最多支持 32 MiB"));
     try{
       const optimized=await compressImage(file,{mode:'smart',quality:0.9,maxBytes:4*1024*1024});
       blob=optimized.blob;compressed=optimized.changed;
     }catch(error){
       if(file.size>4*1024*1024)throw error;
       // Original small wallpapers remain usable if the browser cannot encode
       // or the image is animated. Never flatten animation silently.
       blob=file;
     }
   }
   if(blob.size>4*1024*1024)throw new Error(t("图片压缩后仍超过 4 MiB；请使用图片压缩工具调整。"));
   if(!isCurrent())return;
   if(!await storeLocalWallpaper(blob,file.type.startsWith('video/')?'video':'image',isCurrent,file.name))return;
   wallpaperLibrary.showCustom();
   openDialog('wallpaper');
   toast(compressed?t('壁纸已自动压缩：{before} → {after}',{before:(file.size/1024/1024).toFixed(2)+' MiB',after:(blob.size/1024/1024).toFixed(2)+' MiB'}):t('本地壁纸已保存。'));
  }
 }catch(err){if(input.dataset.setting||input.dataset.range||input.dataset.preference||input.dataset.settingColor)renderDesktop();if(!err.notified)toast(err.message || t("操作没有完成。"));}
});

async function applyDesktopDrop(intent) {
 if (intent.kind === 'group-reorder') {
  const ordered = reorderById(state.groups,intent.groupId,intent.targetId,intent.position);
  if (ordered === state.groups) return;
  state.groups = ordered; await commit(true,{preserveWidgets:true}); return;
 }
 const item = state.items.find(entry => entry.id === intent.itemId);
 if (!item) return;
 if (intent.kind === 'reorder') {
  const target = state.items.find(entry => entry.id === intent.targetId);
  if (!target || item.groupId !== target.groupId || item.folderId || target.folderId) return;
  const ordered = reorderById(state.items,item.id,target.id,intent.position);
  if (ordered === state.items) return;
  state.items = ordered; await commit(true,{preserveWidgets:true}); return;
 }
 if (!state.groups.some(group => group.id === intent.groupId)) return;
 if(intent.kind==='create-folder'){
  const target=state.items.find(entry=>entry.id===intent.targetId);
  if(!target||target.id===item.id||item.type!=='link'||target.type!=='link'||item.folderId||target.folderId||item.groupId!==target.groupId||target.groupId!==intent.groupId)return;
  const folder={id:uid(),groupId:target.groupId,type:'folder',title:t("新建文件夹"),icon:'folder',color:'#7b9aaf',size:'1x1'};
  const index=state.items.indexOf(target);
  // Both children and their new parent enter the SAME validated storage write.
  item.folderId=folder.id;target.folderId=folder.id;
  state.items=[...state.items.slice(0,index),folder,...state.items.slice(index)];
  await commit(true,{preserveWidgets:true});toast(t("已创建文件夹，右键可重命名或移动项目。"));return;
 }
 if (intent.kind === 'folder') {
  const folder = state.items.find(entry => entry.id === intent.folderId && entry.type === 'folder' && entry.groupId === intent.groupId);
  if (!folder || item.type !== 'link') return;
  await moveItem(item.id,folder.groupId,folder.id,{preserveWidgets:true}); toast(t("已收进文件夹。")); return;
 }
 if (intent.kind === 'group') {
  await moveItem(item.id,intent.groupId,null,{preserveWidgets:true}); toast(t("已移动到所选分组。")); return;
 }
 if (intent.kind === 'append') {
  item.groupId = intent.groupId;
  if (item.type === 'link') item.folderId = null;
  if (item.type === 'folder') state.items.forEach(child => { if (child.folderId === item.id) child.groupId = intent.groupId; });
  state.items = [...state.items.filter(entry => entry.id !== item.id),item];
  await commit(true,{preserveWidgets:true});
 }
}

async function savePluginEnvelope(id,value,expected,{plugin,title,size}) {
 await saveQueue;
 const current=state.items.find(item=>item.id===id);
 const revision=current?.widget==='community'?current.data.value:JSON.stringify({config:current?.config,data:current?.data});
 if(!current||revision!==expected)throw new Error(t('组件内容已在其他位置修改，请重新打开。'));
 const candidate=clone(state),item=candidate.items.find(item=>item.id===id);
 item.widget='community';item.config={manifest:plugin.manifest,source:plugin.source};item.data={value:JSON.stringify(value)};
 if(title!==undefined)item.title=title;if(size!==undefined)item.size=size;
 state=validateImport(candidate);await persist();
 if(item.title!==current.title||item.size!==current.size)setTimeout(()=>renderDesktop({preserveWidgets:true}),0);

}
