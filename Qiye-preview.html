/* v0.2: quieter desktop chrome, consistent spacing, and readable settings. */
:root{--border:var(--panel-border);--text:var(--fg);--panel-soft:var(--field);--accent-soft:rgba(120,217,198,.12)}
body{isolation:isolate;line-height:1.45}
.wallpaper{transition:filter .25s ease;background-repeat:no-repeat}
.sidebar{width:64px;background:rgba(11,20,28,.27);border-color:rgba(255,255,255,.07);backdrop-filter:blur(28px) saturate(1.15);gap:8px}
.brand{margin:24px 0 24px;gap:8px}
.sidebar>.brand,.sidebar>.side-button,.sidebar-bottom{flex-shrink:0}
.groups{flex:1;min-height:0;max-height:none;gap:8px;padding:2px 0 8px}
.group-button{width:46px;min-height:55px;border-radius:13px;gap:6px;color:rgba(240,248,248,.7);transition:background .18s,color .18s}
.group-button.active{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#f5fffc}
.group-button.active:before{left:-9px;width:2px;height:21px;background:#b7f4e4}
.group-button .icon{width:19px;height:19px}
.sidebar-bottom{gap:8px;padding-bottom:20px;margin-top:8px}
.side-button{width:40px;height:40px}
.top-tools{position:fixed;top:22px;right:25px;gap:8px}
.tool-button{width:35px;height:35px;border-radius:11px;background:rgba(15,31,40,.14);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.1)}
.tool-button:hover{background:rgba(255,255,255,.19);box-shadow:0 4px 18px #0613231c}
main{margin-left:64px;padding:0 38px 90px}
.hero{padding-top:clamp(62px,8vh,100px)}
.clock{font-weight:300;letter-spacing:-3px;text-shadow:0 2px 22px #00152524}
.date{margin-top:8px;font-size:12px;letter-spacing:.7px;color:rgba(255,255,255,.84)}
.search-wrapper{width:min(640px,100%);margin-top:29px}
.search-form{height:52px;border-radius:27px;background:rgba(246,249,247,.83);border-color:rgba(255,255,255,.32);box-shadow:0 6px 26px rgba(9,25,39,.13);transition:background .18s,box-shadow .18s}
.search-form:focus-within{background:rgba(252,254,253,.96);box-shadow:0 12px 38px rgba(5,24,37,.18),0 0 0 3px rgba(213,255,242,.13)}
.engine-button{width:65px;padding-left:17px;position:relative;border-radius:27px 0 0 27px}
.engine-button:after{content:"";position:absolute;right:1px;top:17px;bottom:17px;width:1px;background:rgba(54,75,76,.16)}
.search-form input{padding-left:13px;font-size:14px}
.search-submit{width:48px;border-radius:0 27px 27px 0;transition:background .16s}
.search-submit:hover{background:rgba(48,92,79,.08)}
.search-shortcut{font-size:9px;opacity:.7;padding:3px 6px}
.engine-menu,.search-suggestions{top:61px;border-radius:17px;padding:8px;box-shadow:0 16px 48px #0713213b}
.engine-option,.suggestion{min-height:39px}
.desktop-wrap{max-width:1280px;margin:32px auto 0}
.desktop-heading{margin-bottom:14px;color:rgba(255,255,255,.65)}
#group-heading{font-size:12px;letter-spacing:.4px}
.desktop{padding-bottom:36px}
.tile-body{height:calc(100% - 24px)}
.tile-link[data-size="1x1"] .tile-body,.tile-add .tile-body{max-width:calc(var(--tile-size) - 10px);max-height:calc(var(--tile-size) - 10px)}
.tile-link .tile-body:hover,.tile-folder .tile-body:hover{transform:translateY(-3px);box-shadow:0 10px 24px #06152238,inset 0 1px 0 #ffffff1f}
.tile-link .tile-body:active,.tile-folder .tile-body:active{transform:translateY(-1px) scale(.98)}
.tile-link .tile-body>.icon{width:30px;height:30px}
.tile-label{height:24px;padding-top:8px;font-size:11px;line-height:15px;letter-spacing:.15px;text-shadow:0 1px 7px rgba(0,0,0,.46)}
.tile-widget .tile-body{box-shadow:0 6px 23px #09172520}
.tile-actions button{box-shadow:0 2px 9px #07162335}
.tile-add .tile-body{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.09)}
.tile-add .tile-body:hover{border-color:rgba(255,255,255,.7)}
.app-dialog{width:min(700px,calc(100% - 36px));max-height:calc(100dvh - 64px);border-radius:22px;box-shadow:0 28px 110px #030b1661;scrollbar-gutter:stable}
.dialog-head{position:sticky;top:0;z-index:4;background:var(--panel);padding:25px 28px 20px;border-bottom:1px solid var(--panel-border)}
.dialog-head h2{font-weight:600;font-size:19px}
.dialog-head p{font-size:12px;line-height:1.65}
.dialog-close{width:33px;height:33px;border-radius:50%}
.tab-bar{margin-top:16px;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab-button{white-space:nowrap;font-size:12px;min-height:37px}
.dialog-body{padding-top:17px}
.field>span{font-size:12px}
.field input,.field select,.field textarea{border-radius:10px}
.field small,.help-text{line-height:1.8}
.primary-button,.secondary-button,.danger-button{min-height:37px;border-radius:10px;font-size:12px}
.setting-row{padding-top:15px;padding-bottom:15px;gap:18px}
.setting-copy strong{font-size:12px}
.setting-copy small{line-height:1.75}
.catalog-card{border-radius:15px;transition:background .18s,border-color .18s,transform .18s}
.catalog-card:hover{transform:translateY(-2px)}
.context-menu{width:205px;border-radius:14px;padding:6px}
.context-menu button{min-height:34px;font-size:12px;gap:11px}
.context-menu .size-options button{min-height:29px;font-size:10px}
.toast{border-radius:14px;bottom:40px;max-width:min(650px,calc(100% - 36px))}
.daily-quote{left:96px;right:32px;bottom:35px;color:rgba(255,255,255,.71)}
.wallpaper-credit{position:fixed;right:21px;bottom:10px;z-index:16;max-width:min(350px,70vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 9px;border-radius:6px;background:rgba(9,20,30,.2);color:rgba(255,255,255,.72);font-size:10px;line-height:1.5;backdrop-filter:blur(9px);text-shadow:0 1px 5px #0005;transition:color .16s,background .16s}
.wallpaper-credit:hover{color:#fff;background:rgba(9,20,30,.42)}
.minimal .wallpaper-credit{opacity:.65}.minimal .wallpaper-credit:hover{opacity:1}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Site icons are image resources only; the text fallback remains until load. */
.site-visual{position:relative;display:grid;place-items:center;width:100%;height:100%;min-width:0;border-radius:inherit;overflow:hidden}
.site-visual.is-loaded{background:rgba(250,252,253,.96)}
.site-fallback{display:grid;place-items:center;width:100%;height:100%;color:inherit}
.site-visual.is-loaded>.site-fallback{visibility:hidden}
.site-visual>.site-favicon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;width:60%;height:60%;max-width:38px;max-height:38px;object-fit:contain;background:transparent;pointer-events:none}
.site-visual>.site-favicon[hidden]{display:none}
.site-fallback>.icon{width:30px;height:30px}
.tile-link[data-size="2x2"] .site-favicon,.tile-link[data-size="4x2"] .site-favicon{max-width:60px;max-height:60px}
.tile-link[data-size="2x2"] .site-fallback>.icon,.tile-link[data-size="4x2"] .site-fallback>.icon{width:48px;height:48px}
.mini-site .site-favicon{max-width:30px;max-height:30px}
.mini-site .site-glyph{font-size:21px}
.mini-site .site-glyph.small{font-size:15px}
.folder-site .site-visual,.folder-site .site-fallback{max-width:none;overflow:visible}
.folder-site .site-visual{overflow:hidden}
.folder-site .site-glyph{font-size:26px}
.folder-site .site-glyph.small{font-size:19px}
.suggestion-site{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--tile-color,#486c91);color:var(--tile-ink,#fff);overflow:hidden}
.suggestion-site .site-favicon{width:72%;height:72%;max-width:24px;max-height:24px}
.suggestion-site .site-glyph,.suggestion-site .site-glyph.small{font-size:13px;letter-spacing:0}
.suggestion-site .site-fallback>.icon,.suggestion-site>.icon{width:17px;height:17px;opacity:1}
.form-preview .preview-icon{overflow:hidden;color:var(--tile-ink,#fff)}
.form-preview .preview-icon .site-glyph{font-size:28px}
.favicon-controls{display:flex;gap:13px;align-items:center;margin:-3px 0 18px}
.favicon-controls .secondary-button{flex:none;min-width:95px}
.favicon-controls .help-text{margin:0;min-width:0}
.favicon-controls .secondary-button:disabled{opacity:.48;cursor:default;filter:none}
@media(max-width:390px){.favicon-controls{align-items:flex-start;gap:10px}.favicon-controls .secondary-button{min-width:85px;padding-right:12px;padding-left:12px}}

/* Independent sticky clock/search. Both are direct children of the full page,
   so either can remain visible beyond the initial header area. */
:root{--header-pin-top:16px;--pinned-clock-height:0px;--search-surface:rgba(23,33,43,.92);--search-focus:rgba(30,44,57,.98);--header-surface:rgba(23,33,43,.92)}
html[data-theme=light]{color-scheme:light;--search-surface:rgba(246,249,247,.9);--search-focus:rgba(252,254,253,.98);--header-surface:rgba(245,248,248,.92)}
html[data-theme=dark]{color-scheme:dark}
main{padding-top:clamp(54px,7vh,90px)}
.clock-block{position:relative;z-index:20;width:fit-content;max-width:100%;margin:0 auto;padding:8px 20px 12px;text-align:center;border:1px solid transparent;border-radius:24px;transition:background .18s,box-shadow .18s,border-color .18s}
.clock{white-space:nowrap}
#clock-seconds{font-size:1em;font-weight:200;letter-spacing:inherit;opacity:.6;padding-left:.14em}
#clock-seconds:empty{display:none}
.search-wrapper{z-index:21;margin-top:22px}
.pin-clock .clock-block{position:sticky;top:var(--header-pin-top)}
.pin-search .search-wrapper{position:sticky;top:var(--header-pin-top)}
.pin-clock.pin-search .search-wrapper{top:calc(var(--header-pin-top) + var(--pinned-clock-height) + 12px)}
.clock-block.is-stuck{background:var(--header-surface);border-color:var(--panel-border);backdrop-filter:blur(28px);box-shadow:0 8px 30px #07132126}
.clock-block.is-stuck .clock{color:var(--fg);text-shadow:none}
.clock-block.is-stuck .date{color:var(--muted)}
.search-form{background:var(--search-surface);border-color:var(--panel-border);color:var(--fg)}
.search-form:focus-within{background:var(--search-focus)}
.search-form input,.search-submit{color:var(--fg)}
.search-form input::placeholder{color:var(--muted);opacity:.9}
.search-shortcut{color:var(--muted);border-color:var(--panel-border);opacity:1}
.engine-button:after{background:var(--panel-border)}
.desktop{grid-auto-flow:row}
.desktop-heading{justify-content:space-between;height:auto;min-height:27px;gap:12px}
.desktop-heading #edit-hint{line-height:1.6}
.desktop-wrap{margin-top:34px}
.daily-quote{position:static;margin:clamp(30px,5vh,64px) 0 0;display:block;padding-bottom:8px}
.minimal main{padding-top:24vh}
.minimal .desktop-wrap{display:none}

/* Provider logos use the same image/caching pipeline as site cards. */
.engine-mark{display:grid;place-items:center;width:23px;height:23px;flex:0 0 23px;color:var(--engine-color);border-radius:5px;overflow:hidden}
.engine-mark .site-visual{width:100%;height:100%}
.engine-mark .site-favicon{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}
.engine-mark .site-glyph,.engine-mark .site-glyph.small{font-size:19px;line-height:1;font-weight:650;letter-spacing:0}
.engine-option .engine-mark{width:21px;height:21px;flex-basis:21px}
.engine-list-row{gap:12px}
.engine-list-row>.engine-mark{width:26px;height:26px;flex-basis:26px}
.engine-list-copy{flex:1;min-width:0}
.engine-list-row small{max-width:100%}
.engine-list-row .engine-extract-button{flex-shrink:0;margin-left:0;padding:7px 9px;border:1px solid var(--panel-border);border-radius:8px;font-size:11px;color:var(--fg);background:var(--panel-2)}
.engine-list-row .engine-extract-button:hover{border-color:var(--accent)}
.engine-list-row>[data-delete-engine]{margin-left:0;padding:6px}

/* Pointer dragging keeps widget editing and touch scrolling intact. */
.tile-drag-handle{position:absolute;z-index:4;left:50%;bottom:0;transform:translateX(-50%);display:grid;place-items:center;width:30px;height:22px;padding:4px 8px;border-radius:7px;background:var(--panel);border:1px solid var(--panel-border);color:var(--muted);box-shadow:0 2px 8px #07132124;cursor:grab;touch-action:none;opacity:0;transition:opacity .15s,background .15s}
.tile-drag-handle svg{width:13px;height:13px;transform:rotate(90deg)}
.tile:hover>.tile-drag-handle,.tile:focus-within>.tile-drag-handle,.editing .tile-drag-handle,.tile-widget>.tile-drag-handle{opacity:1}
.tile-drag-handle:hover,.tile-drag-handle:focus-visible{color:var(--fg);background:var(--panel-2)}
.tile-widget>.tile-drag-handle{left:auto;right:5px;bottom:3px;transform:none;width:27px;height:19px;padding:3px 7px}
.tile-widget>.tile-label{max-width:calc(100% - 50px)}
.tile-link:hover>.tile-label,.tile-folder:hover>.tile-label{opacity:0}
.tile-link:focus-within>.tile-label,.tile-folder:focus-within>.tile-label{opacity:0}
.editing .group-button{touch-action:none;cursor:grab}
.editing .tile-actions{right:3px;top:3px;gap:2px}
.tile.dragging{opacity:.28}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
body.is-dragging .tile-drag-handle{opacity:1}
body.is-dragging .tile-body{transform:none!important}
.drop-before>.tile-body,.drop-after>.tile-body{box-shadow:0 0 0 2px #a9e3d333}
.drop-inside{outline:3px solid var(--accent)!important;outline-offset:3px;border-radius:var(--radius)}
.group-button.drop-inside{background:var(--accent-strong);color:#fff}
.drag-preview{position:fixed;z-index:100;pointer-events:none;display:flex;flex-direction:column;gap:3px;min-width:125px;max-width:235px;padding:12px 16px;border:1px solid var(--panel-border);border-radius:14px;background:var(--panel);color:var(--fg);box-shadow:0 12px 35px #04142240}
.drag-preview small{font-size:10px;color:var(--muted)}
.drag-preview strong{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drag-indicator{position:fixed;z-index:99;pointer-events:none;background:var(--accent);border-radius:8px;box-shadow:0 0 0 2px #142a2944,0 0 16px #93e2cf66}
html[data-theme=dark] .tile-folder .tile-body{background:rgba(34,49,61,.86);border-color:var(--panel-border)}
html[data-theme=dark] .tile-add .tile-body{background:rgba(26,41,52,.64);border-color:#adbfce55}
html[data-theme=light] .tile-folder .tile-body{background:rgba(239,246,244,.75);border-color:#ffffff7a}
@media(min-width:1700px){main{padding-top:8vh}}
@media(max-width:900px){main{padding-top:64px}.desktop-wrap{margin-top:28px}}
@media(max-width:560px){
 :root{--header-pin-top:54px}
 main{padding-top:72px}
 .clock-block{padding:7px 10px 10px;border-radius:20px}
 .clock{font-size:clamp(38px,10.8vw,64px);letter-spacing:-1.8px}
 #clock-period{font-size:.22em;padding-left:5px}
 .search-wrapper{margin-top:17px}
 .desktop-wrap{margin-top:25px}
 .daily-quote{margin-top:32px;font-size:10px}
 .engine-mark{width:20px;height:20px;flex-basis:20px}
 .engine-list-row{gap:8px}
 .engine-list-row .engine-extract-button{padding:6px;font-size:10px}
 .desktop-heading{align-items:flex-start}
 .desktop-heading #edit-hint{font-size:10px}
 .desktop-heading .pill-button{white-space:nowrap;flex-shrink:0}
}
@media(hover:none),(pointer:coarse){
 .tile-drag-handle{opacity:1;left:auto;right:0;bottom:0;transform:none;width:25px;height:22px}
 .tile-widget>.tile-drag-handle{right:0;bottom:0;width:30px;height:25px}
 .tile-link>.tile-label,.tile-folder>.tile-label{max-width:calc(100% - 26px);align-self:flex-start}
 .tile-link:hover>.tile-label,.tile-folder:hover>.tile-label{opacity:1}
}
@media(prefers-reduced-motion:reduce){.clock-block,.tile-drag-handle{transition:none}}

:root {
  --ui-font: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
  --ui-scale: 1; --surface-rgb: 24 33 43; --surface-opacity: .72; --surface-blur: 14px;
  --material-blur: var(--surface-blur); --material-texture: linear-gradient(transparent,transparent);
  --surface-background: rgb(var(--surface-rgb) / var(--surface-opacity));
  --surface-shadow: 0 12px 40px rgb(5 15 25 / .16), inset 0 1px 0 rgb(255 255 255 / .045);
  --sidebar-width: 50px; --sidebar-opacity: .28; --search-width: 600px; --search-height: 46px;
  --search-opacity: .65; --search-radius: 23px; --clock-weight: 400; --clock-color: #fff;
  --clock-offset-y: 0px; --search-offset-y: 0px; --nav-header-space: 0px;
  --desktop-max-width: 1350px; --icon-opacity: 1; --label-size: 12px;
  --accent-soft: color-mix(in srgb,var(--accent) 14%,transparent);
  font-family: var(--ui-font); font-optical-sizing: auto;
}
html[data-theme=light] {
  --surface-rgb: 247 250 252; --panel-border: rgb(45 65 83 / .12);
  --fg: #243442; --muted: #5b6e7d;
  --surface-shadow: 0 12px 40px rgb(20 37 56 / .12), inset 0 1px 0 rgb(255 255 255 / .8);
}
html[data-theme=dark] { --panel-border: rgb(223 240 255 / .13); --muted: #b1bfcb; }
html[data-font=system] { --ui-font: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',sans-serif; }
body { font-family: var(--ui-font); font-size: calc(14px * var(--ui-scale)); }
html[data-material=solid],html[data-material=mica] { --material-blur: 0px; }
html[data-material=acrylic] {
  --material-texture: repeating-linear-gradient(0deg,rgb(255 255 255 / .025) 0 1px,transparent 1px 3px);
}
html[data-material=mica] {
  --material-texture: linear-gradient(125deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent 54%,rgb(117 133 169 / .1));
  --surface-background: rgb(var(--surface-rgb) / max(.88,var(--surface-opacity)));
}
.sidebar,.app-dialog,.engine-menu,.search-suggestions,.context-menu,.shortcuts-tooltip,.top-tools {
  background-color: var(--surface-background); background-image: var(--material-texture);
  border-color: var(--panel-border); color: var(--fg);
  -webkit-backdrop-filter: blur(var(--material-blur));
  backdrop-filter: blur(var(--material-blur));
}
.app-dialog,.engine-menu,.search-suggestions,.context-menu,.shortcuts-tooltip { box-shadow: var(--surface-shadow); }
.app-dialog::backdrop { backdrop-filter: none; background: rgb(3 10 19 / .35); }
.clock-block.is-stuck {
  background: var(--surface-background); background-image: var(--material-texture);
  -webkit-backdrop-filter: blur(var(--material-blur)); backdrop-filter: blur(var(--material-blur));
}
.search-form {
  height: var(--search-height); border-radius: var(--search-radius);
  background: rgb(var(--surface-rgb) / var(--search-opacity)); background-image: var(--material-texture);
  -webkit-backdrop-filter: blur(var(--material-blur)); backdrop-filter: blur(var(--material-blur));
  border-color: var(--panel-border); box-shadow: 0 5px 22px rgb(8 24 40 / .1), inset 0 1px 0 rgb(255 255 255 / .06);
}
.search-form:focus-within { background-color: rgb(var(--surface-rgb) / min(1,calc(var(--search-opacity) + .12))); }
.engine-button { width: 61px; padding-left: 14px; border-radius: var(--search-radius) 0 0 var(--search-radius); }
.engine-button:after { top: 30%; bottom: 30%; }
.search-submit { width: 44px; border-radius: 0 var(--search-radius) var(--search-radius) 0; }
.search-form input { font-size: calc(14px * var(--ui-scale)); padding-left: 9px; }
.engine-menu,.search-suggestions { top: calc(100% + 9px); }
.engine-mark { overflow: visible; border-radius: 0; background: transparent; }
.engine-mark .site-visual,.engine-mark .site-visual.is-loaded { background: transparent; border: none; box-shadow: none; border-radius: 0; }
.engine-mark .site-favicon { object-fit: contain; padding: 0; border: none; background: transparent; filter: none; }
.engine-mark .site-fallback { background: transparent; }
/* This removes our artificial white tile, preserving the provider's actual art. */
.tile-folder .tile-body,
html[data-theme=light] .tile-folder .tile-body,
html[data-theme=dark] .tile-folder .tile-body {
  background: var(--surface-background); background-image: var(--material-texture);
  border-color: var(--panel-border);
  -webkit-backdrop-filter: blur(min(12px,var(--material-blur)));
  backdrop-filter: blur(min(12px,var(--material-blur)));
}
.tile-link .tile-body { opacity: var(--icon-opacity); }
.tile-label { font-size: calc(var(--label-size) * var(--ui-scale)); color: var(--label-color); height: calc(14px + var(--label-size)); line-height: 1.3; }
.tile-body { height: calc(100% - 14px - var(--label-size)); }
.tile-widget .tile-body { backdrop-filter: none; -webkit-backdrop-filter: none; }
.folder-item>.folder-site { border: 1px solid var(--panel-border); box-shadow: 0 4px 16px rgb(8 25 40 / .1); }
.folder-item>span { font-size: calc(12px * var(--ui-scale)); color: var(--fg); }

/* Navigation stays recoverable even when completely collapsed. */
.sidebar {
  width: var(--sidebar-width); gap: 8px; inset: 0 auto 0 0;
  border-right: 1px solid var(--panel-border); border-left: 0;
  background-color: rgb(var(--surface-rgb) / var(--sidebar-opacity));
  z-index: 30; transition: transform .2s ease,opacity .2s ease;
}
.brand { width: 100%; margin: 38px 0 24px; padding: 0; min-height: 36px; }
.brand-mark,.brand-avatar { width: 32px; height: 32px; border-radius: 50%; }
.brand-mark { font-size: 30px; padding-bottom: 8px; }
.brand-avatar { display: block; object-fit: cover; box-shadow: 0 2px 8px rgb(8 25 30 / .12); }
.brand:focus-visible { outline-offset: -3px; border-radius: 12px; }
.groups { flex: 1 1 auto; gap: 8px; padding: 4px 0; width: 100%; overflow-y: auto; overflow-x: hidden; }
.group-button { width: calc(100% - 8px); min-height: 56px; flex-shrink: 0; border-radius: 10px; color: var(--muted); font-size: calc(12px * var(--ui-scale)); gap: 5px; }
.group-button>span { max-width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.group-button .icon { width: 19px; height: 19px; }
.group-button:hover,.side-button:hover { color: var(--fg); background: color-mix(in srgb,var(--fg) 8%,transparent); }
.group-button.active { color: var(--fg); background: var(--accent-soft); box-shadow: inset 0 1px 0 rgb(255 255 255 / .08); }
.group-button.active:before { left: -4px; width: 2px; height: 19px; background: var(--accent); }
.side-button { width: min(36px,calc(var(--sidebar-width) - 8px)); height: 36px; border-radius: 10px; color: var(--muted); }
.sidebar-bottom { padding-bottom: 18px; margin-top: 6px; gap: 5px; }
.no-sidebar-labels .group-button>span { display: none; }
.no-sidebar-labels .group-button { min-height: 42px; }
html[data-sidebar-position=right] .sidebar { left: auto; right: 0; border-right: 0; border-left: 1px solid var(--panel-border); }
html[data-sidebar-position=right] .group-button.active:before { left: auto; right: -4px; border-radius: 3px 0 0 3px; }
main { margin-left: var(--sidebar-width); margin-right: 0; padding: max(12px,calc(6vh + var(--clock-offset-y) + var(--nav-header-space))) 38px 72px; }
html[data-sidebar-position=right] main { margin-left: 0; margin-right: var(--sidebar-width); }
html[data-sidebar-visibility=auto] main,html[data-sidebar-visibility=hidden] main { margin-left: 0; margin-right: 0; }
html[data-sidebar-visibility=auto] .sidebar,html[data-sidebar-visibility=hidden] .sidebar { transform: translateX(-100%); }
html[data-sidebar-position=right][data-sidebar-visibility=auto] .sidebar,html[data-sidebar-position=right][data-sidebar-visibility=hidden] .sidebar { transform: translateX(100%); }
html[data-sidebar-visibility=auto]:has(#navigation-reveal:hover) .sidebar,
html[data-sidebar-visibility=auto] .sidebar:hover,
html[data-sidebar-visibility=auto] .sidebar:focus-within,
html[data-sidebar-position] body.navigation-open .sidebar { transform: translate(0,0); }
.navigation-reveal { position: fixed; z-index: 31; left: 0; top: 46%; width: 24px; height: 48px; padding: 4px; border-radius: 0 10px 10px 0; background: var(--surface-background); border: 1px solid var(--panel-border); color: var(--fg); box-shadow: var(--surface-shadow); }
.navigation-reveal .icon { width: 16px; height: 16px; }
html[data-sidebar-position=right] .navigation-reveal { left: auto; right: 0; border-radius: 10px 0 0 10px; }
.navigation-open .navigation-reveal { background: var(--panel-2); }

/* An optional horizontal layout uses the very same groups and drag behavior. */
html[data-navigation=top] { --nav-header-space: 64px; --header-pin-top: 76px; }
html[data-navigation=top] .sidebar { inset: 0 0 auto; width: 100%; height: 58px; flex-direction: row; padding: 5px 18px; border: 0; border-bottom: 1px solid var(--panel-border); }
html[data-navigation=top] .brand { width: 38px; min-height: 36px; margin: 0 16px 0 0; }
html[data-navigation=top] .groups { flex-direction: row; width: auto; min-width: 0; height: 48px; overflow-x: auto; overflow-y: hidden; gap: 7px; padding: 4px; }
html[data-navigation=top] .group-button { width: auto; flex: 0 0 auto; min-width: 64px; min-height: 36px; padding: 8px 13px; flex-direction: row; gap: 8px; }
html[data-navigation=top] .group-button.active:before { top: auto; bottom: -4px; left: 30%; right: 30%; width: 40%; height: 2px; border-radius: 2px; }
html[data-navigation=top] .sidebar-bottom { flex-direction: row; margin: 0 0 0 8px; padding: 0; gap: 3px; }
html[data-navigation=top] .add-group { margin: 0 0 0 6px; }
html[data-navigation=top] .side-button { width: 34px; height: 34px; }
html[data-navigation=top] main { margin: 0; }
html[data-navigation=top][data-sidebar-visibility=auto],
html[data-navigation=top][data-sidebar-visibility=hidden] { --nav-header-space: 0px; --header-pin-top: 16px; }
html[data-navigation=top][data-sidebar-visibility=auto] .sidebar,
html[data-navigation=top][data-sidebar-visibility=hidden] .sidebar { transform: translateY(-100%); }
html[data-navigation=top][data-sidebar-visibility=auto]:has(#navigation-reveal:hover) .sidebar,
html[data-navigation=top][data-sidebar-visibility=auto] .sidebar:hover,
html[data-navigation=top][data-sidebar-visibility=auto] .sidebar:focus-within,
html[data-navigation=top] body.navigation-open .sidebar { transform: translate(0,0); }
html[data-navigation=top] .navigation-reveal { inset: 0 auto auto 20px; width: 48px; height: 24px; border-radius: 0 0 10px 10px; }

/* Header proportions follow a 70px clock, 14px date and 600×46px search. */
.clock-block { padding: 0 16px 6px; border: 0; transform: translateX(var(--clock-shift,0px)); }
.clock { font-family: var(--ui-font); font-size: var(--clock-size); font-weight: var(--clock-weight); line-height: 1; letter-spacing: -.045em; color: var(--clock-color); padding: 0 4px; }
#clock-seconds { font-size: 1em; font-weight: max(200,calc(var(--clock-weight) - 150)); letter-spacing: inherit; opacity: .58; padding-left: .16em; }
#clock-period { font-size: 14px; font-weight: 450; }
.date { font-size: calc(14px * var(--ui-scale)); line-height: 20px; min-height: 20px; margin-top: 8px; color: var(--clock-color); opacity: .88; letter-spacing: .3px; }
.clock-theme-color .clock,.clock-theme-color .date { color: var(--fg); }
.search-wrapper { width: min(var(--search-width),100%); margin-top: max(8px,calc(clamp(20px,2.45vh,28px) + var(--search-offset-y))); transform: translateX(var(--search-shift,0px)); }
.clock-block.is-stuck { padding: 6px 16px; }
.clock-block.is-stuck .date { opacity: 1; }
.desktop-wrap { max-width: var(--desktop-max-width); margin-top: 20px; }
.desktop { transition: none; }
.desktop-empty { grid-column: 1/-1; padding: 56px 20px; display: grid; place-items: center; gap: 14px; color: var(--label-color); font-size: 14px; }

.widget-inner button:focus-visible,.widget-inner a:focus-visible,.widget-inner input:focus-visible,.widget-inner textarea:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.widget-inner input,.widget-inner textarea{min-width:0;color:inherit}
.widget-inner input::placeholder,.widget-inner textarea::placeholder{color:var(--w-muted);opacity:.9}
.widget-icon{display:block;width:15px;height:15px;flex:none;vertical-align:middle}
.widget-heading{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:18px;flex:none;font-size:10px;font-weight:550;letter-spacing:.2px}
.widget-heading>span:first-child{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.widget-heading>span:first-child>.widget-icon{width:13px;height:13px;opacity:.7}
.widget-heading-actions{display:flex;align-items:center;gap:2px}
.widget-inner .widget-icon-button{display:grid;place-items:center;flex:none;width:21px;height:21px;border-radius:6px;opacity:.76;transition:background .15s,opacity .15s}
.widget-inner .widget-icon-button:hover{opacity:1;background:var(--w-hover)}
.widget-icon-button>.widget-icon{width:13px;height:13px}
.widget-heading .widget-config{margin-right:-5px;margin-top:-3px;margin-bottom:-3px}
.widget-heading-actions .widget-config{margin-left:0}
.widget-inner .w-inline-form{display:flex;align-items:center;gap:4px;flex:none;margin-top:auto;padding-top:5px;border-top:1px solid var(--w-border);height:27px}
.widget-inner .w-inline-form:focus-within{border-top-color:var(--w-accent)}
.w-inline-form input{border:0;outline:0;background:none;flex:1;width:100%;height:22px;font-size:10px!important;padding:0}
.w-inline-form input:focus-visible{outline:none}
.widget-inner .w-inline-form button{background:var(--w-control);border-radius:6px;width:20px;height:20px}
.widget-inner .w-inline-form button:hover{background:var(--w-hover)}
.w-empty-list{display:grid;place-items:center;min-height:52px;text-align:center;line-height:1.8;font-size:10px;color:var(--w-muted)}
.widget-inner .w-row-delete{width:17px;height:20px;opacity:0;margin-right:-2px;color:var(--w-muted)}
.widget-inner li:hover .w-row-delete,.widget-inner .w-row-delete:focus-visible{opacity:.75}
.widget-inner ul{list-style:none;padding:0;margin:0;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--w-scrollbar) transparent}

/* Public photos are requested only after enabling this card. */
.w-wallpaper{padding:0;overflow:hidden}
.w-wallpaper-landscape,.w-wallpaper-photo,.w-wallpaper-shade{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.w-wallpaper-landscape{opacity:.8}
.w-wallpaper-photo{opacity:0;transition:opacity .3s ease;z-index:1}
.w-wallpaper.has-wallpaper-image .w-wallpaper-photo{opacity:1}
.w-wallpaper.has-wallpaper-error .w-wallpaper-photo{display:none}
.w-wallpaper-shade{z-index:2;background:linear-gradient(180deg,#14282475,transparent 40%,#071815b3)}
.w-wallpaper-content{position:relative;z-index:3;display:flex;flex-direction:column;width:100%;height:100%;padding:12px 13px;text-shadow:0 1px 9px #14352a30}
.w-wallpaper .widget-heading{font-size:10px;color:var(--w-heading)}
.w-wallpaper .widget-icon-button{opacity:.8;border-radius:50%;width:22px;height:22px}
.w-wallpaper .widget-icon-button:hover{background:var(--w-hover);opacity:1}
.w-wallpaper-provider-tag{font-size:7px;font-weight:450;letter-spacing:1.5px;opacity:.7}
.w-wallpaper-invite{display:flex;flex:1;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:0}
.w-wallpaper-invite strong{font-size:17px;font-weight:500;line-height:1.6;letter-spacing:.25px}
.w-wallpaper-invite>span{font-size:9px;color:#f2fff4cc}
.widget-inner .w-wallpaper-primary{display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;white-space:nowrap;font-size:9px;font-weight:550;min-height:26px;padding:6px 11px;background:var(--w-accent);color:var(--w-accent-ink);border:1px solid #fff8;border-radius:7px;text-shadow:none;box-shadow:0 2px 8px #173c2912}
.widget-inner .w-wallpaper-primary:hover{background:var(--w-accent-hover);box-shadow:0 2px 10px #173c292a}
.widget-inner .w-wallpaper-primary:disabled{cursor:default;opacity:.6}
.w-wallpaper-primary>.widget-icon{width:11px;height:11px}
.w-wallpaper-invite .w-wallpaper-primary{margin-top:8px}
.w-wallpaper-disclosure{font-size:7px;line-height:1.3;opacity:.72;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-wallpaper a{color:inherit;text-decoration:none}
.w-wallpaper a:hover{text-decoration:underline;text-underline-offset:2px}
.w-wallpaper-status{font-size:8px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;max-width:100%;color:#fffded}
.w-wallpaper-status:not(:empty){background:#10281d4d;align-self:flex-start;border-radius:4px;padding:2px 5px;text-shadow:none}
.w-wallpaper-footer{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-width:0}
.w-wallpaper-credit{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:8px;line-height:1.3}
.w-wallpaper-credit>a{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-wallpaper-credit>span{opacity:.7;font-size:7px;white-space:nowrap}
.w-wallpaper-actions{display:flex;align-items:center;gap:6px;flex:none}
.widget-inner .w-wallpaper-next{display:flex;align-items:center;justify-content:center;gap:4px;min-height:26px;border-radius:7px;padding:5px 7px;white-space:nowrap;background:#102a214b;border:1px solid #ffffff2f;backdrop-filter:blur(10px);color:#fff;font-size:9px}
.widget-inner .w-wallpaper-next:hover{background:#102a216b}
.w-wallpaper-next>.widget-icon{width:11px;height:11px}
.w-wallpaper-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;flex:1;min-height:0;text-align:center}
.w-wallpaper-empty>.widget-icon{width:23px;height:23px;opacity:.8}
.w-wallpaper-empty>strong{font-weight:500;font-size:11px}
.w-wallpaper-empty>span:not(.w-wallpaper-spinner){font-size:8px;opacity:.8;line-height:1.5;max-width:100%}
.w-wallpaper-empty .w-wallpaper-primary{padding:4px 9px;min-height:23px;font-size:8px}
.w-wallpaper-spinner{width:16px;height:16px;border:1.5px solid #ffffff50;border-top-color:#fff;border-radius:50%;animation:w-spin 1s linear infinite}
@container (max-width:220px){
  .w-wallpaper-content{padding:10px}
  .w-wallpaper-invite strong{font-size:13px}
  .w-wallpaper-invite>span{font-size:8px}
  .w-wallpaper-disclosure{font-size:6px}
  .w-wallpaper-footer{flex-direction:column;gap:6px;align-items:stretch}
  .w-wallpaper-credit{gap:3px;font-size:7px}
  .w-wallpaper-credit>span{font-size:6px}
  .w-wallpaper-actions{justify-content:space-between;gap:3px}
  .widget-inner .w-wallpaper-primary,.widget-inner .w-wallpaper-next{font-size:8px;min-height:24px;padding:5px 7px}
  .w-wallpaper-status{font-size:7px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
@media(prefers-reduced-motion:reduce){.w-wallpaper-spinner{animation:none}.w-wallpaper-photo{transition:none}}

/* Weather: the card stays explicit about enabling, cached data, and errors. */
.w-weather{padding-bottom:10px}
.w-weather:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;top:-100px;right:-65px;background:#f2eaff13;pointer-events:none}
.w-weather .widget-heading{font-weight:500}
.w-weather .widget-icon-button:hover{background:var(--w-hover)}
.w-weather-current{position:relative;display:flex;align-items:center;justify-content:space-between;height:66px;flex:1;min-height:47px;margin-top:2px}
.w-weather-current>strong{font-size:49px;letter-spacing:-3px;font-weight:400;line-height:1;position:relative;z-index:1}
.w-weather-current>strong sup{vertical-align:top;font-size:31px;line-height:1.2;font-weight:300;position:relative;left:2px}
.w-weather-art{width:73px;height:67px;flex:none;filter:drop-shadow(0 4px 8px #34447716);overflow:visible}
.w-weather-current>.w-weather-art{position:absolute;right:-4px;bottom:-1px;width:73px;height:68px}
.w-weather-description{font-size:10px;position:relative;margin-top:1px;white-space:nowrap;opacity:.95}
.w-weather-details{display:flex;gap:9px;font-size:9px;color:var(--w-muted);margin-top:4px;min-height:13px}
.w-weather .w-weather-update{display:block;text-align:left;font-size:8px;color:var(--w-muted);opacity:1;white-space:nowrap;margin-top:auto;padding-top:6px;flex:none}
.w-weather .w-weather-update:hover{opacity:.95}
.w-weather .w-weather-update.is-error{color:var(--w-error);opacity:1;font-size:8px}
.w-weather-off{display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.w-weather-off>.w-weather-art{height:51px;width:58px;margin:-2px 0 -3px}
.w-weather-off>span{font-size:10px;color:var(--w-muted)}
.widget-inner .w-weather-enable{padding:5px 11px;border-radius:7px;background:var(--w-control);color:var(--w-fg);border:1px solid var(--w-border);font-size:10px;line-height:1.2}
.widget-inner .w-weather-enable:hover{background:var(--w-hover)}
.w-weather-source{font-size:7px;letter-spacing:.1px;color:var(--w-muted);text-align:center;margin-top:7px;flex:none}
.w-weather-unavailable{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;flex:1;min-height:0;text-align:center}
.w-weather-unavailable>.widget-icon{width:30px;height:30px;opacity:.7;margin:2px 0}
.w-weather-unavailable>strong{font-size:10px;font-weight:500}
.w-weather-unavailable>span:not(.w-weather-loading){font-size:8px;color:var(--w-muted);line-height:1.5;max-width:100%}
.w-weather-loading{width:12px;height:12px;border:1.5px solid var(--w-border);border-top-color:var(--w-fg);border-radius:50%;animation:w-spin 1s linear infinite}
@keyframes w-spin{to{transform:rotate(360deg)}}

/* The calendar keeps a real six-week month inside a compact tile. */
.w-calendar{padding:10px 11px 8px}
.w-calendar-top{display:flex;align-items:center;justify-content:space-between;flex:none;height:22px;margin-bottom:4px}
.w-calendar-top>span{display:flex;align-items:baseline;gap:7px}
.w-calendar-top strong{font-weight:700;font-size:20px;letter-spacing:-.7px;color:var(--w-accent)}
.w-calendar-top strong small{font-weight:500;font-size:9px;margin-left:3px;letter-spacing:0}
.w-calendar-top em{font-size:9px;font-style:normal;color:var(--w-muted);letter-spacing:.5px}
.w-calendar-top>div{display:flex;align-items:center;gap:0;margin-right:-5px}
.w-calendar-top .widget-icon-button{width:18px;height:21px;color:var(--w-muted)}
.w-calendar-top .widget-icon-button .widget-icon{width:11px;height:11px}
.w-calendar-top .w-calendar-today-button{font-size:9px}
.w-calendar-weekdays,.w-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:0}
.w-calendar-weekdays{font-size:8px;flex:none;height:16px;color:var(--w-muted);align-items:center}
.w-calendar-weekdays>span:nth-last-child(-n+2){color:var(--w-weekend)}
.w-calendar-grid{flex:1;min-height:0;grid-template-rows:repeat(var(--calendar-rows,5),minmax(0,1fr));align-items:center;font-size:9px;line-height:1}
.w-calendar-day{display:grid;place-items:center;width:17px;height:17px;justify-self:center;border-radius:6px;font-variant-numeric:tabular-nums}
.w-calendar-day.is-weekend{color:var(--w-weekend)}
.w-calendar-day.is-outside{opacity:.42}
.w-calendar-day.is-today{background:var(--w-accent);color:var(--w-accent-ink);font-weight:650;box-shadow:0 3px 7px var(--w-decor)}
.w-calendar-lunar{flex:none;text-align:center;color:var(--w-muted);font-size:8px;margin-top:5px;border-top:1px solid var(--w-border);padding-top:5px;line-height:1}

/* Notes retain their native textarea and selection across every clock tick. */
.w-notes .widget-heading{color:inherit;opacity:.78}
.w-notes-input{display:block;flex:1;min-height:0;width:100%;resize:none;outline:none!important;border:0;background:transparent;padding:8px 0 2px;font-size:11px!important;line-height:1.8!important;scrollbar-width:thin;scrollbar-color:var(--w-scrollbar) transparent;white-space:pre-wrap;overflow-wrap:anywhere}
.w-notes-footer{position:relative;flex:none;height:10px;font-size:7px;color:var(--w-muted);margin-top:4px}
.w-notes-fold{position:absolute;right:-12px;bottom:-12px;border-top:18px solid var(--w-decor);border-right:18px solid transparent;width:0;height:0;transform:rotate(180deg)}

.w-todo .widget-heading{color:var(--w-heading)}
.w-todo-summary{font-size:9px;line-height:16px;background:var(--w-control);color:var(--w-muted);padding:1px 6px;border-radius:5px;font-weight:500;letter-spacing:1px}
.w-todo-list{flex:1;margin:5px 0!important}
.w-todo-row{display:flex;align-items:center;justify-content:space-between;gap:3px;min-height:27px}
.w-todo-row label{display:flex;align-items:center;gap:6px;min-width:0;flex:1;cursor:pointer;font-size:10px}
.w-todo-row label>span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;line-height:1.5}
.w-todo-row input{appearance:none;width:12px;height:12px;margin:0;border:1.3px solid var(--w-input-border);border-radius:4px;cursor:pointer;flex:none;position:relative;background:var(--w-input)}
.w-todo-row input:hover{border-color:var(--w-accent)}
.w-todo-row input:checked{background:var(--w-accent);border-color:var(--w-accent)}
.w-todo-row input:checked:after{content:"";display:block;width:6px;height:3px;border-left:1.3px solid var(--w-accent-ink);border-bottom:1.3px solid var(--w-accent-ink);transform:translate(2px,2px) rotate(-45deg)}
.w-todo-row.is-done label>span{text-decoration:line-through;text-decoration-color:var(--w-muted);color:var(--w-muted);opacity:.8}

.w-countdown .widget-heading{color:var(--w-heading)}
.w-countdown-title{position:relative;z-index:1;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:9px;color:var(--w-fg)}
.w-countdown-caption{text-align:center;font-size:8px;color:var(--w-muted);margin-top:4px}
.w-countdown-number{position:relative;z-index:1;text-align:center;white-space:nowrap;flex:1;display:flex;justify-content:center;align-items:center;gap:5px;min-height:32px;margin:2px 0}
.w-countdown-number strong{font-size:44px;line-height:1;font-weight:500;letter-spacing:-2px;color:var(--w-accent);font-variant-numeric:tabular-nums}
.w-countdown-number span{font-size:10px;align-self:flex-end;margin-bottom:6px;opacity:.75}
.w-countdown-date{text-align:center;font-size:9px;letter-spacing:1px;color:var(--w-muted);position:relative;z-index:1;margin-top:1px}
.w-countdown-orbit{position:absolute;right:-25px;top:52px;width:100px;height:100px;border:1px solid var(--w-border);border-radius:50%;transform:rotate(20deg);z-index:0}
.w-countdown-orbit:after{content:"";position:absolute;width:5px;height:5px;background:var(--w-decor);border-radius:50%;top:8px;left:18px}

.w-focus{padding-bottom:10px}
.w-focus .widget-heading{color:var(--w-heading)}
.w-focus .widget-heading>.widget-icon-button{color:var(--w-muted)}
.w-focus-ring{position:relative;display:grid;place-items:center;flex:1;min-height:66px;width:100%;margin:3px 0}
.w-focus-ring:before{content:"";position:absolute;height:83px;width:83px;border-radius:50%;background:conic-gradient(from -90deg,var(--w-accent) calc(var(--focus-progress,1) * 360deg),var(--w-border) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px))}
.w-focus-ring>div{text-align:center}
.w-focus-ring strong{display:block;font-size:25px;letter-spacing:-.6px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.25}
.w-focus-ring span{display:block;font-size:6px;letter-spacing:.3px;color:var(--w-muted);margin-top:4px}
.w-focus-controls{display:flex;justify-content:center;align-items:center;gap:9px;flex:none;height:23px}
.widget-inner .w-focus-start{display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;background:var(--w-accent);color:var(--w-accent-ink);border-radius:7px;padding:5px 12px;height:24px;min-width:65px}
.widget-inner .w-focus-start:hover{background:var(--w-accent-hover)}
.w-focus-start .widget-icon{width:11px;height:11px;fill:currentColor;stroke-width:1.8px}
.w-focus-start [data-running="true"] .widget-icon{fill:none;stroke-width:2.5px}
.w-focus-controls>.widget-icon-button{background:var(--w-control);width:24px;height:24px;border-radius:7px;color:var(--w-muted)}
.w-focus .widget-icon-button:hover{background:var(--w-hover)}

.w-workday .widget-heading{color:var(--w-heading)}
.w-workday-caption{font-size:8px;text-align:center;margin-top:auto;color:var(--w-muted);padding-top:7px}
.w-workday-time{display:block;white-space:nowrap;text-align:center;font-size:26px;line-height:1.15;letter-spacing:-1px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:5px}
.w-workday-finish{text-align:center;font-size:8px;color:var(--w-muted);margin-top:6px}
.w-workday-pay{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:8px;border-top:1px solid var(--w-border);margin-top:auto;min-height:22px;font-size:8px}
.w-workday-pay>span{color:var(--w-muted)}
.w-workday-pay>strong{font-size:9px;font-weight:550}

.w-quote{padding:13px 16px}
.w-quote .widget-heading{color:var(--w-heading);font-size:9px}
.w-quote-text{position:relative;z-index:1;margin:auto 0;font-size:15px;font-weight:400;line-height:1.9;letter-spacing:.3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.w-quote-author{position:relative;text-align:right;z-index:1;color:var(--w-muted);font-size:8px;padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-quote-decoration{position:absolute;right:10px;bottom:-40px;font-family:Georgia,serif;font-size:180px;line-height:1;opacity:.12;color:var(--w-accent);pointer-events:none;z-index:0}

.w-hotlinks .widget-heading{color:var(--w-heading)}
.w-hotlinks-tag{font-size:7px;font-weight:400;color:var(--w-muted)}
.w-hotlinks-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;flex:1;align-content:center;margin:5px 0 2px}
.w-hotlink{display:flex;align-items:center;gap:6px;min-width:0;text-decoration:none;color:inherit;border-radius:7px;padding:4px 3px;font-size:10px;transition:background .15s}
.w-hotlink:hover{background:var(--w-hover)}
.w-hotlink>span:nth-child(2){white-space:nowrap;text-overflow:ellipsis;overflow:hidden;flex:1}
.w-hotlink-logo{width:23px;height:23px;display:grid;place-items:center;flex:none;border-radius:7px;background:var(--platform-color);color:white;font-size:11px;font-weight:650;box-shadow:inset 0 1px 0 #ffffff40}
.w-hotlink>.widget-icon{width:10px;height:10px;opacity:.24}
.w-hotlinks-footer{text-align:center;font-size:7px;color:var(--w-muted);letter-spacing:.1px;margin-top:3px;flex:none}

.w-calculator{padding:10px;gap:5px}
.w-calculator-screen{position:relative;flex:none;height:29px;padding-bottom:4px}
.w-calculator-input{display:block;width:100%;height:25px;text-align:right;border:0;background:transparent;outline:0;font-size:23px!important;font-weight:400!important;line-height:1!important;font-variant-numeric:tabular-nums;padding:0 3px;letter-spacing:-.5px}
.w-calculator-input::placeholder{opacity:1!important}
.w-calculator-input:focus-visible{outline:none!important}
.w-calculator-error{position:absolute;bottom:-1px;left:0;right:0;font-size:7px;color:var(--w-error);line-height:1;white-space:nowrap;text-align:right;background:var(--w-bg)}
.w-calculator-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4px;flex:1;min-height:0}
.widget-inner .w-calculator-key{display:grid;place-items:center;border-radius:6px;background:var(--w-key);color:var(--w-key-ink);font-size:11px;min-height:0;line-height:1;box-shadow:0 1px 2px #47526906}
.widget-inner .w-calculator-key:hover{background:var(--w-hover)}
.widget-inner .w-calculator-key:active{transform:translateY(1px)}
.widget-inner .w-calculator-key.is-operator{background:var(--w-operator);color:var(--w-operator-ink)}
.widget-inner .w-calculator-key.is-operator:hover{background:var(--w-hover)}
.widget-inner .w-calculator-key.is-equal{background:var(--w-accent);color:var(--w-accent-ink)}

 .workspace-dialog .settings-nav-button .icon{width:15px;height:15px}
 .workspace-dialog .settings-content,.workspace-dialog .add-content,.workspace-dialog .wallpaper-content{padding:24px 16px}
 .workspace-dialog .settings-nav>small{display:block;padding:18px 7px 0;font-size:9px}
 .wallpaper-content .wallpaper-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

 .wallpaper-content .wallpaper-grid{grid-template-columns:1fr}.editor-section{padding:13px}.icon-choices{gap:8px}
 .editor-footer>.field{max-width:none;flex-basis:100%}.editor-footer .button-row{justify-content:flex-start}
 .workspace-dialog .setting-row{gap:12px}.source-symbol{display:none}

/* A single focus indication on the URL control, not a nested outline. */

/* Shared restrained sliders instead of the platform's heavy full-width track. */

.workspace-dialog input[type=range]::-moz-range-track{height:4px;border-radius:5px;background:color-mix(in srgb,var(--muted) 23%,transparent)}
.workspace-dialog input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border:2px solid var(--workspace-pane);border-radius:50%}
.workspace-dialog input[type=range]:focus-visible{outline:1px solid var(--accent);outline-offset:4px;border-radius:8px}
.icon-color-field .color-input{appearance:none;-webkit-appearance:none;border:0;padding:0;background:none;overflow:hidden;cursor:pointer}
.icon-color-field .color-input::-webkit-color-swatch-wrapper{padding:0}
.icon-color-field .color-input::-webkit-color-swatch{border:1px solid var(--control-border);border-radius:50%}
.icon-color-field .color-input::-moz-color-swatch{border:1px solid var(--control-border);border-radius:50%}

/* Editor-only preference: preserve the scrollport and keyboard/wheel behavior.

html.hide-editor-scrollbar .app-dialog.site-editor-dialog,
html.hide-editor-scrollbar .app-dialog .add-content:has(#link-form){scrollbar-width:none;-ms-overflow-style:none;scrollbar-gutter:auto}

html.hide-editor-scrollbar .app-dialog .add-content:has(#link-form)::-webkit-scrollbar{display:none;width:0;height:0}

function validateConfig(widgetType, raw, path) {
  const v = raw === undefined ? {} : raw;
  const fields = {
    countdown: ['title', 'date'], workday: ['endTime', 'payday', 'workdays'], clock: ['timeZone', 'label'],
    quote: ['text', 'author', 'quoteIndex'], notes: ['color']
  };
  keys(v, fields[widgetType] || [], path);
  const out = {};
  if (v.title !== undefined) out.title = string(v.title, `${path}.title`, 120);
  if (v.date !== undefined) out.date = date(v.date, `${path}.date`);
  if (v.endTime !== undefined) out.endTime = time(v.endTime, `${path}.endTime`);
  if (v.payday !== undefined) out.payday = number(v.payday, `${path}.payday`, 1, 31, true);
  if (v.workdays !== undefined) {
    out.workdays = array(v.workdays, `${path}.workdays`, 7).map(day => number(day, `${path}.workdays`, 0, 6, true));
    unique(out.workdays, `${path}.workdays`);
  }
  if (v.timeZone !== undefined) {
    out.timeZone = string(v.timeZone, `${path}.timeZone`, 80);
    try { new Intl.DateTimeFormat('en', { timeZone: out.timeZone }).format(); } catch { invalid(`${path}.timeZone`, '不是有效时区'); }
  }
  if (v.label !== undefined) out.label = string(v.label, `${path}.label`, 60);
  if (v.text !== undefined) out.text = string(v.text, `${path}.text`, 1000, true);
  if (v.author !== undefined) out.author = string(v.author, `${path}.author`, 120, true);
  if (v.quoteIndex !== undefined) out.quoteIndex = number(v.quoteIndex, `${path}.quoteIndex`, 0, 1000000, true);
  if (v.color !== undefined) out.color = enumeration(v.color, ['yellow', 'pink', 'mint'], `${path}.color`);
  return out;
}

/** Parse and validate before any storage mutation. Invalid records are never silently dropped. */
function validateImport(raw) {
  let data;
  if (typeof raw === 'string') {
    if (raw.length > MAX_BACKUP_BYTES || byteLength(raw) > MAX_BACKUP_BYTES) invalid('备份', '文件不能超过 6 MiB');
    try { data = JSON.parse(raw.replace(/^\uFEFF/, '')); } catch { invalid('备份', '不是有效 JSON 文件'); }
  } else {
    // Object callers include the live application. Serialization also rejects cycles.
    try {
      const serialized = JSON.stringify(raw);
      if (serialized === undefined || serialized.length > MAX_BACKUP_BYTES || byteLength(serialized) > MAX_BACKUP_BYTES) invalid('备份', '内容为空或超过 6 MiB');
    } catch (error) {
      if (error?.message?.startsWith('数据校验失败')) throw error;
      invalid('备份', '不能包含循环引用或无法保存的数据');
    }
    data = raw;
  }
  keys(data, Object.keys(DEFAULT_STATE), 'state');
  if (data.schemaVersion !== 1) invalid('schemaVersion', '仅支持栖页 v1 备份');
  const settings = validateSettings(plain(data.settings, 'settings'));
  const groups = array(data.groups, 'groups', LIMITS.groups, 1).map((group, i) => {
    const path = `groups[${i}]`;
    keys(group, ['id', 'name', 'icon'], path);
    return { id: id(group.id, `${path}.id`), name: string(group.name, `${path}.name`, 40), icon: string(maybe(group.icon, 'folder'), `${path}.icon`, 40) };
  });
  unique(groups.map(g => g.id), 'groups');
  const groupIds = new Set(groups.map(g => g.id));
  const activeGroupId = id(data.activeGroupId, 'activeGroupId');
  if (!groupIds.has(activeGroupId)) invalid('activeGroupId', '对应分组不存在');
  const items = array(data.items, 'items', LIMITS.items).map((item, i) => {
    const path = `items[${i}]`;
    plain(item, path);
    const type = enumeration(item.type, ['link', 'folder', 'widget'], `${path}.type`);
    const allowed = type === 'link' ? ['id', 'groupId', 'type', 'title', 'url', 'icon', 'iconMode', 'iconUrl', 'color', 'size', 'folderId'] : type === 'folder' ? ['id', 'groupId', 'type', 'title', 'icon', 'color', 'size'] : ['id', 'groupId', 'type', 'widget', 'title', 'size', 'config'];
    keys(item, allowed, path);
    const groupId = id(item.groupId, `${path}.groupId`);
    if (!groupIds.has(groupId)) invalid(`${path}.groupId`, '对应分组不存在');
    const base = { id: id(item.id, `${path}.id`), groupId, type, title: string(item.title, `${path}.title`, 120) };
    const size = maybe(item.size, type === 'link' ? '1x1' : '2x2');
    if (!SIZES.has(size)) invalid(`${path}.size`, '卡片尺寸不受支持');
    if (type === 'widget') {
      if (!WIDGETS.has(item.widget)) invalid(`${path}.widget`, '组件类型不受支持');
      return { ...base, widget: item.widget, size, config: validateConfig(item.widget, item.config, `${path}.config`) };
    }
    const appearance = { icon: string(maybe(item.icon, type === 'folder' ? 'folder' : item.title.slice(0, 1)), `${path}.icon`, 80), color: color(maybe(item.color, '#6BA39A'), `${path}.color`), size };
    if (type === 'folder') return { ...base, ...appearance };
    // Old backups acquire automatic discovery without losing their text fallback.
    const iconMode = enumeration(maybe(item.iconMode, 'auto'), ['auto', 'text'], `${path}.iconMode`);
    const iconUrl = normalizeIconSelection(item.iconUrl);
    if (item.iconUrl !== undefined && item.iconUrl !== null && !iconUrl) invalid(`${path}.iconUrl`, '需要安全的 HTTPS 图标地址或有效的本地静态图片');
    return { ...base, url: url(item.url, `${path}.url`), ...appearance, iconMode, ...(iconUrl ? {iconUrl} : {}), folderId: item.folderId === undefined || item.folderId === null ? null : id(item.folderId, `${path}.folderId`) };
  });
  unique(items.map(item => item.id), 'items');
  const folderMap = new Map(items.filter(item => item.type === 'folder').map(item => [item.id, item]));
  for (const item of items) if (item.folderId !== undefined && item.folderId !== null) {
    const folder = folderMap.get(item.folderId);
    if (!folder || folder.groupId !== item.groupId) invalid(`items.${item.id}.folderId`, '文件夹不存在或不属于同一分组');
  }
  const todos = array(maybe(data.todos, []), 'todos', LIMITS.todos).map((todo, i) => {
    const path = `todos[${i}]`; keys(todo, ['id', 'text', 'done'], path);
    return { id: id(todo.id, `${path}.id`), text: string(todo.text, `${path}.text`, 1000), done: bool(todo.done, `${path}.done`) };
  });
  unique(todos.map(todo => todo.id), 'todos');
  const f = maybe(data.focus, DEFAULT_STATE.focus);
  keys(f, ['duration', 'remaining', 'endAt', 'running'], 'focus');
  const focus = { duration: number(f.duration, 'focus.duration', 1, 180, true), remaining: number(f.remaining, 'focus.remaining', 0, 10800), endAt: f.endAt === null ? null : number(f.endAt, 'focus.endAt', 0, 8640000000000000), running: bool(f.running, 'focus.running') };
  if (focus.running && focus.endAt === null) invalid('focus.endAt', '运行中的番茄钟必须包含结束时间');
  const cd = maybe(data.countdown, DEFAULT_STATE.countdown);
  keys(cd, ['title', 'date'], 'countdown');
  const wd = maybe(data.workday, DEFAULT_STATE.workday);
  keys(wd, ['endTime', 'payday', 'monthlySalary'], 'workday');
  const habits = array(maybe(data.habits, []), 'habits', LIMITS.habits).map((habit, i) => {
    const path = `habits[${i}]`; keys(habit, ['id', 'name', 'dates'], path);
    const dates = array(habit.dates, `${path}.dates`, LIMITS.dates).map(v => date(v, `${path}.dates`));
    unique(dates, `${path}.dates`);
    return { id: id(habit.id, `${path}.id`), name: string(habit.name, `${path}.name`, 120), dates };
  });
  unique(habits.map(habit => habit.id), 'habits');
  return {
    schemaVersion: 1, updatedAt: number(maybe(data.updatedAt, 0), 'updatedAt', 0, 8640000000000000),
    settings, activeGroupId, groups, items, notes: string(maybe(data.notes, ''), 'notes', LIMITS.notes, true), todos, focus,
    countdown: { title: string(cd.title, 'countdown.title', 120), date: date(cd.date, 'countdown.date') },
    workday: { endTime: time(wd.endTime, 'workday.endTime'), payday: number(wd.payday, 'workday.payday', 1, 31, true), monthlySalary: number(wd.monthlySalary, 'workday.monthlySalary', 0, 1000000000) },
    habits
  };
}

function exportState(state) {
  const data = validateImport(state);
  const output = JSON.stringify(data, null, 2);
  if (byteLength(output) > MAX_BACKUP_BYTES) throw new Error('导出的备份超过 6 MiB；请先移除自定义壁纸后再导出。');
  return output;
}

function hasExtensionStorage() { return !!globalThis.chrome?.storage?.local; }

function chromeCall(owner, method, ...args) {
  return new Promise((resolve, reject) => {
    try {
      const result = owner[method](...args, value => {
        const lastError = globalThis.chrome?.runtime?.lastError;
        if (lastError) reject(new Error(lastError.message || '浏览器扩展操作失败'));
        else resolve(value);
      });
      if (result && typeof result.then === 'function') result.then(resolve, reject);
    } catch (error) { reject(error); }
  });
}

async function readStored() {
  if (hasExtensionStorage()) {
    const result = await chromeCall(globalThis.chrome.storage.local, 'get', STORAGE_KEY);
    return result?.[STORAGE_KEY];
  }
  if (!globalThis.localStorage) throw new Error('此环境无法访问本地存储。请在扩展或浏览器页面中打开栖页。');
  const raw = globalThis.localStorage.getItem(STORAGE_KEY);
  return raw === null ? undefined : raw;
}

async function loadState() {
  let stored;
  try { stored = await readStored(); } catch (error) { throw new Error(`无法读取栖页数据：${error.message}`); }
  if (stored === undefined) return clone(DEFAULT_STATE);
  try { return validateImport(stored); } catch (error) { throw new Error(`本地数据异常，原数据已保留。${error.message}`); }
}

const subscribers = new Set();
let attachedListener = null;
let localQueue = Promise.resolve();
let lastEmitted = '';

function emitState(state) {
  const fingerprint = JSON.stringify(state);
  if (lastEmitted === fingerprint) return;
  lastEmitted = fingerprint;
  for (const subscriber of subscribers) {
    try { subscriber(clone(state)); } catch { /* One UI subscriber must not interrupt another. */ }
  }
}

function attachStorageListener() {
  if (attachedListener) return;
  if (globalThis.chrome?.storage?.onChanged) {
    const handler = (changes, areaName) => {
      if (areaName !== 'local' || !changes[STORAGE_KEY]?.newValue) return;
      try { emitState(validateImport(changes[STORAGE_KEY].newValue)); } catch { /* Keep the last validated state. */ }
    };
    globalThis.chrome.storage.onChanged.addListener(handler);
    attachedListener = () => globalThis.chrome?.storage?.onChanged?.removeListener(handler);
  } else if (globalThis.addEventListener) {
    const handler = event => {
      if (event.key !== STORAGE_KEY || !event.newValue) return;
      try { emitState(validateImport(event.newValue)); } catch { /* Keep the last validated state. */ }
    };
    globalThis.addEventListener('storage', handler);
    attachedListener = () => globalThis.removeEventListener('storage', handler);
  }
}

function subscribeState(callback) {
  if (typeof callback !== 'function') throw new TypeError('订阅者必须是函数');
  subscribers.add(callback);
  attachStorageListener();
  return () => {
    subscribers.delete(callback);
    if (!subscribers.size && attachedListener) { attachedListener(); attachedListener = null; }
  };
}

function withWriteLock(operation) {
  // Web Locks coordinates the new tab, popup and worker in supported browsers.
  const task = () => globalThis.navigator?.locks?.request
    ? globalThis.navigator.locks.request(STORAGE_KEY, operation)
    : operation();
  const result = localQueue.then(task, task);
  localQueue = result.catch(() => {});
  return result;
}

async function persistValidated(state, previousRevision = state.updatedAt) {
  const updatedAt = Math.max(Date.now(), previousRevision + 1);
  if (updatedAt > 8640000000000000) throw new Error('本地数据版本超出可保存范围，请导出备份后明确重置或恢复。');
  const next = { ...state, updatedAt };
  try {
    if (hasExtensionStorage()) await chromeCall(globalThis.chrome.storage.local, 'set', { [STORAGE_KEY]: next });
    else {
      if (!globalThis.localStorage) throw new Error('本地存储不可用');
      globalThis.localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    }
  } catch (error) { throw new Error(`保存失败，原数据未主动清除。可能空间不足或存储被禁用：${error.message}`); }
  emitState(next);
  return clone(next);
}

async function saveState(state, options = {}) {
  // Validate and snapshot now: later UI mutations cannot alter an enqueued write.
  const next = validateImport(state);
  return withWriteLock(async () => {
    // A lock serializes writes, but an old complete snapshot could still erase a
    // link added by another surface. Reject it instead of guessing at deletions.
    // Explicit restore/reset can replace even a damaged old record.
    let current;
    if (options.replace !== true) {
      current = await loadState();
      if (current.updatedAt !== next.updatedAt) {
        const error = new Error('另一个标签页已更新栖页，此次改动尚未保存。已保留最新数据，请在刷新后的内容上重试。');
        error.code = 'STATE_CONFLICT';
        error.currentState = clone(current);
        throw error;
      }
    } else {
      // A restore gets a new local revision, not the historical backup revision.
      // This also prevents a rapid reset from reusing an old snapshot's version.
      try { current = await loadState(); } catch { /* Explicit replacement may repair damaged storage. */ }

/** A deliberately small arithmetic parser: no eval, Function, or executable input. */
function calculateExpression(source) {
  const text = String(source).replace(/[×x]/g, '*').replace(/[÷]/g, '/').replace(/[−]/g, '-').replace(/\s+/g, '');
  if (!text || text.length > 256 || /[^\d.+\-*/()%]/.test(text)) throw new Error('请输入有效算式');
  let position = 0;
  let depth = 0;
  function number() {
    const match = /^(?:\d+(?:\.\d*)?|\.\d+)/.exec(text.slice(position));
    if (!match) throw new Error('算式还没有写完整');
    position += match[0].length;
    return Number(match[0]);
  }
  function primary() {
    if (++depth > 48) throw new Error('括号层数过多');
    let value;
    if (text[position] === '(') {
      position += 1;
      value = expression();
      if (text[position] !== ')') throw new Error('请检查括号');
      position += 1;
    } else value = number();
    depth -= 1;
    while (text[position] === '%') { value /= 100; position += 1; }
    return value;
  }
  function unary() {
    let sign = 1;
    while (text[position] === '+' || text[position] === '-') { if (text[position] === '-') sign *= -1; position += 1; }
    return sign * primary();
  }
  function term() {
    let value = unary();
    while (text[position] === '*' || text[position] === '/') {
      const operator = text[position++];
      const right = unary();
      if (operator === '/' && right === 0) throw new Error('不能除以 0');
      value = operator === '*' ? value * right : value / right;
    }
    return value;
  }
  function expression() {
    let value = term();
    while (text[position] === '+' || text[position] === '-') {
      const operator = text[position++];
      const right = term();
      value = operator === '+' ? value + right : value - right;
    }
    return value;
  }
  const value = expression();
  if (position !== text.length) throw new Error('请检查算式');
  if (!Number.isFinite(value)) throw new Error('结果超出计算范围');
  return Number(value.toPrecision(12));
}

function habitStreak(dates, now = new Date()) {
  const records = new Set(Array.isArray(dates) ? dates : []);
  const date = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (!records.has(localDateKey(date))) date.setDate(date.getDate() - 1);
  let streak = 0;
  while (records.has(localDateKey(date)) && streak <= 36600) { streak += 1; date.setDate(date.getDate() - 1); }
  return streak;
}

    const streak = habitStreak(habit.dates, now);

}

function cityKey(city) { return `${city.latitude.toFixed(4)},${city.longitude.toFixed(4)}`; }

function weatherDescription(code) {
  if (code === 0) return '晴';
  if (code === 1) return '晴间多云';
  if (code === 2) return '多云';
  if (code === 3) return '阴';
  if ([45, 48].includes(code)) return '雾';
  if ([51, 53, 55, 56, 57].includes(code)) return '毛毛雨';
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '雨';
  if ([71, 73, 75, 77, 85, 86].includes(code)) return '雪';
  if ([95, 96, 99].includes(code)) return '雷雨';
  return '天气数据';
}

}

function parseWeatherResponse(raw, now = Date.now()) {
  const current = raw?.current;
  if (!current || typeof current.temperature_2m !== 'number' || !Number.isFinite(current.temperature_2m) || typeof current.weather_code !== 'number' || !Number.isFinite(current.weather_code)) throw new Error('天气服务返回的数据不完整');
  const number = (value) => typeof value === 'number' && Number.isFinite(value) ? value : null;
  return { fetchedAt: now, temperature: current.temperature_2m, feelsLike: number(current.apparent_temperature), humidity: number(current.relative_humidity_2m), code: current.weather_code, isDay: current.is_day !== 0, max: number(raw.daily?.temperature_2m_max?.[0]), min: number(raw.daily?.temperature_2m_min?.[0]), observedAt: typeof current.time === 'string' ? current.time : '' };
}

function readWeatherCache(key) {
  try {
    const value = JSON.parse(globalThis.localStorage?.getItem(WEATHER_CACHE_KEY) || '{}')[key];
    return value && Number.isFinite(value.temperature) && Number.isFinite(value.code) && Number.isFinite(value.fetchedAt) && value.fetchedAt <= Date.now() + 60_000 ? value : null;
  } catch { return null; }
}

function writeWeatherCache(key, data) {
  try {
    let cache;
    try { cache = JSON.parse(globalThis.localStorage?.getItem(WEATHER_CACHE_KEY) || '{}'); } catch { cache = {}; }
    const entries = Object.entries(cache && typeof cache === 'object' ? cache : {}).filter(([other, value]) => other !== key && value && Number.isFinite(value.fetchedAt)).sort((a, b) => b[1].fetchedAt - a[1].fetchedAt).slice(0, 7);
    globalThis.localStorage?.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ...Object.fromEntries(entries), [key]: data }));
  } catch { /* The weather still works when browser storage is unavailable. */ }
}

function weatherState(city) {
  const key = cityKey(city);
  if (!weatherStates.has(key)) weatherStates.set(key, { status: 'idle', data: readWeatherCache(key), error: '', lastAttempt: 0 });
  return weatherStates.get(key);
}

  const weather = current.data;

  const stale = Date.now() - weather.fetchedAt >= WEATHER_TTL;

}

function cachedWallpaper() {
  try {
    const stored = globalThis.localStorage?.getItem(WALLPAPER_CACHE_KEY) || '';
    if (stored.length > 5000) return null;
    const cache = JSON.parse(stored || '{}');
    if (!Number.isFinite(cache.at) || Date.now() - cache.at > 86_400_000 || cache.at > Date.now() + 60_000) return null;
    const photo = normalizeWallpaperPhoto(cache.photo);
    return photo ? { photo, page: Number.isInteger(cache.page) && cache.page >= 1 && cache.page <= 1000 ? cache.page : 1 } : null;
  } catch { return null; }
}

function currentWallpaperBrowser(state) {
  if (!wallpaperBrowser) {
    const cached = cachedWallpaper();
    wallpaperBrowser = createWallpaperBrowser({
      initialPhoto: cached?.photo || normalizeWallpaperPhoto(state.settings?.remoteWallpaper),
      startPage: cached?.page || 1 + Math.floor(Math.random() * 20),
      onChange: (reason) => {
        const current = wallpaperBrowser.getState();
        if (current.status === 'ready' && current.photo) {
          try { globalThis.localStorage?.setItem(WALLPAPER_CACHE_KEY, JSON.stringify({ at: Date.now(), page: current.page, photo: current.photo })); } catch { /* Browsing still works without local cache. */ }
        }
        for (const binding of wallpaperBindings) {
          if (reason === 'image') syncWallpaperImages(binding);
          else updateWallpaperCards(binding);
        }
      },
    });

  return wallpaperBrowser;
}

 return `<div class="wallpaper-widget-art" aria-hidden="true"></div>${photo ? `<img class="wallpaper-widget-photo" src="${escapeHtml(photo.thumbnail)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" draggable="false">` : ''}<button class="wallpaper-launcher" data-action="wallpaper" aria-label="打开壁纸中心"><span class="wallpaper-eyebrow">WALLPAPERS</span><strong>换一片风景</strong><span>自定义 · 官方背景 · 摄影图库</span><span class="wallpaper-launch-arrow" aria-hidden="true">↗</span></button>`;

function syncWallpaperImages(binding) {
  if (!binding.alive || !wallpaperBrowser) return;

async function removeItem(id) {

 const removed=clone(item), oldIndex=state.items.indexOf(item), childIds=state.items.filter(i=>i.folderId===id).map(i=>i.id);

 toast(item.type==='folder'?'文件夹已移除，里面的网站已移回桌面。':`已移除${item.title}`,async()=>{
  if(!state.groups.some(g=>g.id===removed.groupId))removed.groupId=currentGroup().id;
  if(removed.folderId&&!state.items.some(i=>i.id===removed.folderId))removed.folderId=null;
  if(!state.items.some(i=>i.id===removed.id))state.items.splice(Math.min(oldIndex,state.items.length),0,removed);
  if(removed.type==='folder')state.items.forEach(i=>{if(childIds.includes(i.id)&&!i.folderId&&i.groupId===removed.groupId)i.folderId=removed.id;});

 });

async function applyDesktopDrop(intent) {
 if (intent.kind === 'group-reorder') {
  const ordered = reorderById(state.groups,intent.groupId,intent.targetId,intent.position);
  if (ordered === state.groups) return;
  state.groups = ordered; await commit(true,{preserveWidgets:true}); return;
 }
 const item = state.items.find(entry => entry.id === intent.itemId);
 if (!item) return;
 if (intent.kind === 'reorder') {
  const target = state.items.find(entry => entry.id === intent.targetId);
  if (!target || item.groupId !== target.groupId || item.folderId || target.folderId) return;
  const ordered = reorderById(state.items,item.id,target.id,intent.position);
  if (ordered === state.items) return;
  state.items = ordered; await commit(true,{preserveWidgets:true}); return;
 }
 if (!state.groups.some(group => group.id === intent.groupId)) return;
 if(intent.kind==='create-folder'){
  const target=state.items.find(entry=>entry.id===intent.targetId);
  if(!target||target.id===item.id||item.type!=='link'||target.type!=='link'||item.folderId||target.folderId||item.groupId!==target.groupId||target.groupId!==intent.groupId)return;
  const folder={id:uid(),groupId:target.groupId,type:'folder',title:'新建文件夹',icon:'folder',color:'#7b9aaf',size:'1x1'};
  const index=state.items.indexOf(target);
  // Both children and their new parent enter the SAME validated storage write.
  item.folderId=folder.id;target.folderId=folder.id;
  state.items=[...state.items.slice(0,index),folder,...state.items.slice(index)];
  await commit(true,{preserveWidgets:true});toast('已创建文件夹，右键可重命名或移动项目。');return;
 }
 if (intent.kind === 'folder') {
  const folder = state.items.find(entry => entry.id === intent.folderId && entry.type === 'folder' && entry.groupId === intent.groupId);
  if (!folder || item.type !== 'link') return;
  await moveItem(item.id,folder.groupId,folder.id,{preserveWidgets:true}); toast('已收进文件夹。'); return;
 }
 if (intent.kind === 'group') {
  await moveItem(item.id,intent.groupId,null,{preserveWidgets:true}); toast('已移动到所选分组。'); return;
 }
 if (intent.kind === 'append') {
  item.groupId = intent.groupId;
  if (item.type === 'link') item.folderId = null;
  if (item.type === 'folder') state.items.forEach(child => { if (child.folderId === item.id) child.groupId = intent.groupId; });
  state.items = [...state.items.filter(entry => entry.id !== item.id),item];
  await commit(true,{preserveWidgets:true});
 }
}

 try{state=await loadState();persistedState=clone(state);if(!state.settings.rememberGroup)state.activeGroupId=state.groups[0].id;}catch(err){blockedStorage=true;toast(err.message);}
 syncController=createSyncController({
  getState:()=>clone(state), beforeSync:async()=>{await saveQueue;if(blockedStorage)throw new Error('请先恢复本机桌面数据，再进行同步。');if(JSON.stringify(state)!==JSON.stringify(persistedState))await persist({fromSync:true});},
  applyRemote:applySyncedDesktop,toast,openDialog,closeDialog,exportBackup,
  isEditing:()=>dialog.open || desktopDrag?.isDragging() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || ''),
  refreshPanel:()=>{if(dialogKind==='settings'&&dialogData.tab==='sync')openDialog('settings',{tab:'sync'});}
 });
 await syncController.init();
 await faviconCacheReady;
 $$('[data-action=add-group]').forEach(e=>e.innerHTML=icon('plus'));
 $$('.sidebar-bottom [data-action=local-search]').forEach(e=>e.innerHTML=icon('search'));
 $$('.sidebar-bottom [data-action=icon-settings]').forEach(e=>e.innerHTML=icon('grid'));
 $$('.sidebar-bottom [data-action=settings]').forEach(e=>e.innerHTML=icon('settings'));
 $$('.top-tools [data-action=wallpaper]').forEach(e=>e.innerHTML=icon('wallpaper'));
 $$('.top-tools [data-action=edit]').forEach(e=>e.innerHTML=icon('edit'));
 $$('.top-tools [data-action=add]').forEach(e=>e.innerHTML=icon('plus'));
 $('#shortcuts-button').innerHTML=icon('keyboard');
 $('#navigation-reveal').innerHTML=icon('panel');
 $('#search-submit').innerHTML=icon('search');
 desktopDrag=createDesktopDragController({
  document, getState:()=>state, getActiveGroupId:()=>currentGroup().id,
  canDragGroups:()=>editing, isBlocked:()=>dialog.open || blockedStorage || state.settings.minimal,
  onStart:()=>{hideSearchMenus();$('#context-menu').hidden=true;},
  onDrop:applyDesktopDrop,
  onError:err=>{renderDesktop();if(!err.notified)toast(err.message || '移动未保存，请重试。');}
 });
 renderDesktop();
 subscribeState(incoming=>{if(saving || !incoming || incoming.updatedAt===state.updatedAt)return;state=incoming;persistedState=clone(incoming);if(!dialog.open&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName || ''))renderDesktop();});
 new ResizeObserver(updateGrid).observe($('.desktop-wrap'));
 new ResizeObserver(updateHeaderPlacement).observe($('#clock-block'));
 window.addEventListener('resize',updateHeaderPlacement,{passive:true});
 document.fonts?.ready.then(updateHeaderPlacement);
 $('#content-scroll').addEventListener('scroll',hideSearchMenus,{passive:true});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applySettings);
 setInterval(()=>{renderClock();if(!document.hidden)refreshLiveWidgets($('#desktop'),state);},1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderClock();refreshLiveWidgets($('#desktop'),state);syncController.onVisible();}});
 document.addEventListener('focusout',()=>syncController.onIdle());
 setInterval(()=>{if(!document.hidden)syncController.onIdle();},60000);
 if(new URLSearchParams(location.search).get('search')==='local')openDialog('local-search');
 if(blockedStorage)openDialog('settings',{tab:'data'});
}
init().catch(err=>{console.error('Qiye initialization failed',err);toast('桌面初始化失败，请刷新页面重试。');});

document.addEventListener('change',async event=>{
 if(!event.target.matches('[data-header-mode]'))return;
 if(event.target.value==='mixed')return;
 state.settings.pinClock=state.settings.pinSearch=event.target.value==='fixed';
 try{applySettings();await persist();}catch(error){if(!error.notified)toast(error.message);}
});

</script>
</body>
</html>
